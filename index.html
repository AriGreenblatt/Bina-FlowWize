<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תזרים+ — ניהול תזרים משפחתי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --radius:.625rem;
  --background:oklch(1 0 0);
  --foreground:oklch(.129 .042 264.695);
  --card:oklch(1 0 0);
  --primary:oklch(.208 .042 265.755);
  --primary-foreground:oklch(.984 .003 247.858);
  --secondary:oklch(.968 .007 247.896);
  --secondary-foreground:oklch(.208 .042 265.755);
  --muted:oklch(.968 .007 247.896);
  --muted-foreground:oklch(.554 .046 257.417);
  --accent:oklch(.55 .15 48);
  --accent-foreground:oklch(.99 .005 90);
  --destructive:oklch(.577 .245 27.325);
  --border:oklch(.929 .013 255.508);
  --emerald:#059669; --emerald-700:#047857; --rose:#e11d48; --rose-700:#be123c;
}
*{box-sizing:border-box;border-color:var(--border)}
html,body{margin:0}
body{background:var(--background);color:var(--foreground);font-family:"Heebo",Arial,system-ui,sans-serif;font-size:16px;line-height:1.5}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default;opacity:.5}
h1,h2,h3,p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted-foreground)}
.small{font-size:.875rem}
.xs{font-size:.75rem}
.nowrap{white-space:nowrap}
.up{color:var(--emerald)} .down{color:var(--rose)}
.link{color:var(--primary)} .link:hover{text-decoration:underline}
.hidden{display:none!important}

/* layout */
.wrap{margin:0 auto;padding-inline:24px}
.w5{max-width:64rem}.w6{max-width:72rem}.w7{max-width:80rem}
main.wrap{padding-block:32px}
.stack>*+*{margin-top:24px}
.stack-lg>*+*{margin-top:32px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.row3{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.between{justify-content:space-between}
.grid3{display:grid;gap:16px}
.grid2{display:grid;gap:24px}
@media (min-width:640px){.grid3{grid-template-columns:repeat(3,1fr)}}
@media (min-width:768px){.md2{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1024px){.grid2{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.wrap{padding-inline:16px}}

/* top bar (replaces the account strip) */
.topbar{border-bottom:1px solid var(--border);background:color-mix(in oklch,var(--muted) 40%,transparent);font-size:.875rem}
.topbar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding-block:8px}
.topbar .brand{font-weight:800;color:var(--primary);margin-inline-end:8px}
.topbar nav{display:flex;flex-wrap:wrap;gap:4px}
.topbar nav a{padding:2px 10px;border-radius:999px;color:var(--muted-foreground)}
.topbar nav a:hover{color:var(--foreground);background:var(--muted)}
.topbar nav a.on{color:var(--primary);background:var(--card);border:1px solid var(--border);font-weight:600}
.topbar .note{margin-inline-start:auto;color:var(--muted-foreground);font-size:.75rem}
/* Wide screens: the main menu is a fixed column on the right-hand side (the start side in RTL).
   Narrow screens keep it as a bar across the top. */
@media (min-width:900px){
  body{padding-inline-start:210px}
  #topbar{position:fixed;top:0;bottom:0;inset-inline-start:0;width:210px;z-index:30}
  .topbar{height:100%;border-bottom:0;border-inline-end:1px solid var(--border);background:color-mix(in oklch,var(--muted) 55%,transparent)}
  .topbar .wrap{height:100%;flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:0;padding:22px 14px 16px;margin:0}
  .topbar .brand{font-size:1.35rem;padding:0 12px 18px;margin:0}
  .topbar nav{flex-direction:column;flex-wrap:nowrap;gap:2px}
  .topbar nav a{padding:9px 12px;border-radius:8px;font-size:.95rem;border:1px solid transparent}
  .topbar nav a.on{border-color:var(--border)}
  .topbar .note{margin:auto 0 0;padding:12px 12px 0;border-top:1px solid var(--border);line-height:1.4}
}

/* app header */
.appnav{border-bottom:1px solid var(--border);background:color-mix(in oklch,var(--card) 70%,transparent)}
.appnav .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:16px}
.appnav h1{font-size:1.25rem;font-weight:700;letter-spacing:-.01em}

/* surfaces */
.card{border:1px solid var(--border);background:var(--card);border-radius:calc(var(--radius) + 4px);padding:20px;box-shadow:0 1px 2px #0000000d}
.card.p4{padding:16px}
.card.dashed{border-style:dashed}
.card h2{font-size:1.125rem;font-weight:600}
.kpi-label{font-size:.875rem;color:var(--muted-foreground)}
.kpi-value{margin-top:8px;font-size:1.875rem;font-weight:700;font-variant-numeric:tabular-nums}
.kpi-sm{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;border-radius:calc(var(--radius) - 2px);font-size:.875rem;font-weight:500;height:36px;padding:0 16px;background:var(--primary);color:var(--primary-foreground);border:1px solid var(--primary);transition:opacity .15s}
.btn:hover:not(:disabled){opacity:.9}
.btn.sm{height:32px;padding:0 12px}
.btn.lg{height:40px;padding:0 32px;font-size:1rem}
.btn.outline{background:var(--background);color:var(--foreground);border-color:var(--border);box-shadow:0 1px 2px #0000000d}
.btn.outline:hover:not(:disabled){background:var(--muted);opacity:1}
.btn.ghost{background:transparent;color:var(--foreground);border-color:transparent}
.btn.ghost:hover:not(:disabled){background:var(--muted)}
.pill{border:1px solid var(--border);border-radius:999px;padding:4px 12px;color:var(--muted-foreground)}
.pill:hover{color:var(--primary)}
.pill.on{border-color:var(--primary);color:var(--primary)}
.mpill{border:1px solid var(--border);border-radius:6px;padding:4px 8px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.mpill.on{border-color:var(--primary);color:var(--primary)}
.chip{border-radius:999px;background:var(--muted);padding:4px 10px}
.input{border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);background:var(--background);padding:6px 12px;font-size:.875rem}
.sel-xs,.in-xs{border:1px solid var(--border);border-radius:4px;background:var(--background);padding:2px 4px;font-size:.75rem;max-width:100%}
.sel-sm{padding:4px 8px;font-size:.875rem}
.btn-xs{border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-size:.75rem;color:var(--primary)}
.picker-add{display:inline-flex;align-items:center;gap:4px}
input[type=file]{font-size:.875rem}
input[type=file]::file-selector-button{margin-inline-end:12px;border:0;border-radius:4px;background:var(--primary);color:var(--primary-foreground);padding:6px 12px;cursor:pointer}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;text-align:right;font-size:.875rem}
.tbl thead{color:var(--muted-foreground)}
.tbl thead tr{border-bottom:1px solid var(--border)}
.tbl th{padding:8px;font-weight:500;vertical-align:top}
.tbl td{padding:8px}
.tbl tbody tr{border-bottom:1px solid var(--border)}
.tbl tbody tr:last-child{border-bottom:0}
.tbl.hover tbody tr:hover{background:color-mix(in oklch,var(--muted) 50%,transparent)}
.sortbtn{display:inline-flex;align-items:center;gap:4px;font-weight:500}
.sortbtn:hover,.sortbtn.on{color:var(--foreground)}
.kind{border-radius:4px;padding:2px 8px;font-size:.75rem}
.kind.income{background:#10b9811a;color:var(--emerald-700)}
.kind.expense{background:#f43f5e1a;color:var(--rose-700)}
.kind.cc{background:#6366f11a;color:#4338ca}
.kind.sep{background:#64748b1f;color:#334155}
.kind.fin{background:#f59e0b1f;color:#b45309}
.kpi-value.fin{color:#b45309}
.seg-toggle{display:inline-flex;border:1px solid var(--border);border-radius:999px;padding:3px;background:var(--card)}
.seg-toggle button{padding:5px 14px;border-radius:999px;font-size:.85rem;color:var(--muted-foreground)}
.seg-toggle button.on{background:var(--primary);color:var(--primary-foreground);font-weight:600}
.nodata{display:inline-block;margin-inline-start:8px;padding:1px 8px;border-radius:999px;background:#f59e0b1f;color:#b45309;font-size:.72rem;font-weight:600;white-space:nowrap}
.nodata-note{margin-bottom:12px;padding:10px 12px;border-radius:8px;background:#f59e0b14;border:1px solid #f59e0b55;color:#92400e;font-size:.85rem}

/* column filter */
.cf{position:relative;margin-top:4px;font-weight:400}
.cf-btn{display:flex;width:100%;min-width:72px;align-items:center;justify-content:space-between;gap:4px;border:1px solid var(--border);border-radius:4px;background:var(--background);padding:2px 8px;font-size:.75rem;color:var(--muted-foreground)}
.cf-btn.on{border-color:var(--primary);color:var(--primary)}
.cf-overlay{position:fixed;inset:0;z-index:10}
.cf-btn.open{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in oklch,var(--primary) 15%,transparent)}
.cf-pop{position:fixed;z-index:20;width:16rem;border:1px solid var(--border);border-radius:6px;background:var(--card);padding:8px;text-align:right;box-shadow:0 10px 15px -3px #0000001a,0 4px 6px -4px #0000001a;color:var(--foreground)}
.cf-pop label{display:flex;align-items:center;gap:8px;border-radius:4px;padding:4px;font-size:.75rem;cursor:pointer}
.cf-pop label:hover{background:var(--muted)}
.cf-list{max-height:15rem;overflow-y:auto}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;overflow:visible}
.h80{height:320px}.h72{height:288px}.h64{height:256px}
#tip{position:fixed;z-index:50;pointer-events:none;background:#fff;border:1px solid #ccc;padding:8px 10px;font-size:.8rem;line-height:1.5;white-space:nowrap;direction:rtl;box-shadow:0 2px 6px #0000001a}
.cat-list li{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cat-list li+li{margin-top:8px}

/* type-to-search category/topic fields */
[hidden]{display:none!important}
.combo-in{border:1px solid var(--border);border-radius:4px;background:var(--background);padding:3px 6px;font-size:.75rem;width:10rem;max-width:100%}
.combo-in:focus{outline:2px solid color-mix(in oklch,var(--primary) 25%,transparent);border-color:var(--primary)}
.combo-in::placeholder{color:var(--muted-foreground)}
.combo-in.sel-sm{font-size:.875rem;padding:4px 8px;width:12rem}
#combo-pop{position:fixed;z-index:70;max-height:280px;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:6px;box-shadow:0 10px 15px -3px #0000001a,0 4px 6px -4px #0000001a;padding:4px;font-size:.8rem;text-align:right}
.combo-item{padding:5px 8px;border-radius:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.combo-item.active,.combo-item:hover{background:var(--muted)}
.combo-item.create{color:var(--primary);font-weight:600;border-top:1px solid var(--border);margin-top:2px}
.combo-item.clear{color:var(--muted-foreground)}
.combo-item mark{background:none;color:inherit;font-weight:700;text-decoration:underline}
.combo-more{padding:5px 8px;color:var(--muted-foreground);font-size:.75rem}

/* transaction types */
.types-bar{position:sticky;top:0;z-index:15;background:color-mix(in oklch,var(--background) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.types-bar .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.tbl tr.changed td{background:color-mix(in oklch,#f59e0b 12%,transparent)}
.tbl tr.missing td:first-child{box-shadow:inset -3px 0 0 #f59e0b}
.add-btn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:1px solid var(--border);border-radius:4px;color:var(--primary);font-weight:700;line-height:1;flex-shrink:0}
.add-btn:hover{background:var(--muted)}
.pick-cell{display:flex;align-items:center;gap:4px}
.mixed{font-size:.7rem;color:#b45309}

/* slice popup */
#modal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-overlay{position:absolute;inset:0;background:#0f172a66}
.modal{position:relative;display:flex;flex-direction:column;width:100%;max-width:56rem;max-height:calc(100vh - 32px);background:var(--card);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);padding:20px;box-shadow:0 20px 40px #0003}
.modal-head{margin-bottom:8px;flex-wrap:nowrap}
.modal-head h2{font-size:1.125rem;font-weight:600}
.modal-body{overflow:auto;min-height:0;flex:1;border-top:1px solid var(--border)}
.modal-body thead th{position:sticky;top:0;background:var(--card)}

/* toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;background:var(--primary);color:var(--primary-foreground);padding:10px 18px;border-radius:8px;font-size:.875rem;box-shadow:0 4px 12px #0003;transition:opacity .2s}

/* home */
.hero{text-align:center}
.hero h1{font-size:3rem;font-weight:800;letter-spacing:-.025em;color:var(--primary)}
.hero p{margin-top:16px;font-size:1.125rem;color:var(--muted-foreground)}

/* prd / modules */
.doc-head{border-bottom:1px solid var(--border);background:var(--secondary)}
.doc-head .wrap{padding-block:40px}
.eyebrow{font-size:.875rem;font-weight:500;letter-spacing:.1em;color:var(--accent);text-transform:uppercase}
.doc-title{margin-top:12px;font-size:2.25rem;font-weight:700;letter-spacing:-.025em}
@media (min-width:768px){.doc-title{font-size:3rem}.doc-head .wrap{padding-block:56px}}
.doc-tag{border-radius:999px;border:1px solid var(--border);padding:4px 12px;color:var(--muted-foreground)}
.doc-tag.accent{background:var(--accent);color:var(--accent-foreground);border-color:var(--accent);font-weight:600}
.doc-link{border-radius:999px;border:1px solid var(--border);background:var(--background);padding:4px 12px;font-weight:600}
.doc-link:hover{background:var(--muted)}
.doc-link.primary{background:var(--primary);color:var(--primary-foreground)}
.prd-layout{display:flex;gap:40px;padding-block:40px}
.toc{display:none;width:16rem;flex-shrink:0}
@media (min-width:1024px){.toc{display:block}.toc-mobile{display:none}}
.toc .sticky{position:sticky;top:32px;max-height:calc(100vh - 64px);overflow-y:auto}
.toc button,.toc-mobile button.item{display:block;width:100%;text-align:right;border-radius:6px;padding:8px 12px;font-size:.875rem;line-height:1.5rem;color:var(--muted-foreground)}
.toc button:hover{background:var(--muted);color:var(--foreground)}
.toc button.on{background:var(--secondary);font-weight:600;color:var(--secondary-foreground)}
.toc .n{margin-inline-end:8px;opacity:.6;font-variant-numeric:tabular-nums}
.prd-body{min-width:0;flex:1}
.prd-sec{margin-bottom:56px;scroll-margin-top:32px}
.prd-sec>h2{margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:12px;font-size:1.5rem;font-weight:700;letter-spacing:-.025em}
@media (min-width:768px){.prd-sec>h2{font-size:1.875rem}}
.prd-sec>h2 .n{margin-inline-end:12px;color:var(--accent)}
.b-lead{margin-bottom:20px;border-right:2px solid color-mix(in oklch,var(--accent) 70%,transparent);padding-right:16px;line-height:2rem;color:var(--muted-foreground);font-style:italic}
.b-p{margin-bottom:16px;line-height:2rem}
.b-h3{margin:32px 0 12px;font-size:1.125rem;font-weight:600}
.b-label{margin:20px 0 8px;font-size:.875rem;font-weight:700;letter-spacing:.025em;color:var(--accent)}
.b-ul{margin-bottom:16px}.b-ul.sub{padding-right:16px}
.b-ul li,.b-ol li{display:flex;gap:12px;line-height:1.75rem}
.b-ul li+li,.b-ol li+li{margin-top:8px}
.dot{margin-top:10px;width:6px;height:6px;flex-shrink:0;border-radius:999px;background:var(--accent)}
.b-ol{margin-bottom:16px}
.olnum{margin-top:2px;display:flex;width:24px;height:24px;flex-shrink:0;align-items:center;justify-content:center;border-radius:999px;background:var(--secondary);font-size:.75rem;font-weight:600}
.b-table{margin-bottom:24px;overflow-x:auto;border:1px solid var(--border);border-radius:8px}
.b-table table{width:100%;min-width:34rem;border-collapse:collapse;font-size:.875rem}
.b-table th{background:var(--secondary);border-bottom:1px solid var(--border);padding:10px 12px;text-align:right;font-weight:600}
.b-table td{border-bottom:1px solid color-mix(in oklch,var(--border) 70%,transparent);padding:10px 12px;vertical-align:top;line-height:1.5rem}
.b-table tr:nth-child(even) td{background:color-mix(in oklch,var(--muted) 40%,transparent)}
.mod-nav{position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border);background:color-mix(in oklch,var(--background) 90%,transparent);backdrop-filter:blur(8px)}
.mod-nav .wrap{display:flex;flex-wrap:wrap;gap:8px;padding-block:12px}
.mod-card{scroll-margin-top:80px}
.mod-id{display:flex;width:40px;height:40px;flex-shrink:0;align-items:center;justify-content:center;border-radius:8px;background:var(--accent);color:var(--accent-foreground);font-size:.875rem;font-weight:700}
.mod-phase{flex-shrink:0;border-radius:999px;border:1px solid var(--border);background:var(--secondary);padding:4px 12px;font-size:.75rem;font-weight:600}
.crit{margin-top:24px;border:1px solid color-mix(in oklch,var(--accent) 30%,transparent);border-radius:8px;background:color-mix(in oklch,var(--muted) 40%,transparent);padding:16px}
.check{margin-top:4px;display:flex;width:20px;height:20px;flex-shrink:0;align-items:center;justify-content:center;border-radius:4px;border:1px solid color-mix(in oklch,var(--accent) 50%,transparent);font-size:11px;font-weight:700;color:var(--accent)}
.caps{font-size:.75rem;font-weight:700;letter-spacing:.1em;color:var(--muted-foreground)}
footer.doc{border-top:1px solid var(--border);padding-top:24px;padding-bottom:64px;font-size:.875rem;color:var(--muted-foreground)}
</style>
</head>
<body>
<div id="topbar"></div>
<div id="app"></div>
<div id="tip" class="hidden"></div>
<div id="toast" class="hidden"></div>
<div id="modal" class="hidden"></div>
<div id="cf-layer"></div>
<div id="combo-pop" hidden></div>

<!-- The data file this app reads. Switch with:  node standalone/use-data.mjs real | demo -->
<script src="demo/flowwise-demo.js" id="flowwise-data"></script>
<script>
"use strict";
/* ============================================================
   Flow-Wise standalone — a single-file port of the Lovable app.
   The data comes from a separate file (the <script id="flowwise-data"> above): the real data for
   personal use or the invented demo data for sharing. Changes are kept in this browser.

const SEED = window.FLOWWISE_DATA ?? null;
const PRD = {"prdMeta":{"product":"Flow-Wise","subtitle":"מסמך אפיון מוצר · PRD","tagline":"מערכת AI לניהול, ניתוח והפקת תובנות מתזרים פיננסי אישי","version":"גרסה 0.5","date":"ספטמבר 2026"},"sections":[{"id":"goals","num":"0","title":"מטרות המוצר והגדרות הצלחה","blocks":[{"t":"lead","text":"סעיף זה מגדיר מה המוצר אמור להשיג וכיצד נדע שהצלחנו. כל מודול בהמשך המסמך כולל קריטריוני קבלה ניתנים לבדיקה."},{"t":"h3","text":"0.1 מטרות המוצר"},{"t":"ol","items":["איחוד: כל העסקאות מכל המקורות הפיננסיים מרוכזות במאגר אחד, ללא ספירה כפולה.","הבנה: המשתמש יכול לענות תוך פחות מדקה על השאלה \"לאן הלך הכסף בתקופה X\" בכל רמת פירוט.","שליטה: המשתמש יכול לשנות את מבנה הסיווג בכל שלב, גם רטרואקטיבית, והמערכת מתעדכנת בהתאם.","שקיפות: כל מספר במערכת ניתן לשחזור עד לרמת העסקה הבודדת."]},{"t":"h3","text":"0.2 מדדי הצלחה לגרסה הראשונה"},{"t":"table","head":["מדד","הגדרה","יעד"],"rows":[["כיסוי ייבוא","אחוז השורות בקובץ מקור שנקלטו בהצלחה ללא התערבות ידנית","95% ומעלה"],["דיוק סיווג אוטומטי","אחוז העסקאות שסווגו נכון על ידי המנוע ללא תיקון משתמש","80% ומעלה לאחר חודש שימוש"],["כפילויות","מספר עסקאות כפולות במאגר לאחר ייבוא חוזר של אותו קובץ","0"],["עקיבות","אחוז המספרים בדשבורד הניתנים לפירוק לעסקאות מקור","100%"],["זמן תובנה","זמן ממסך הבית עד לגרף מפולח לפי נושא","פחות מ-30 שניות"]]},{"t":"h3","text":"0.3 מונחון"},{"t":"table","head":["מונח","הגדרה"],"rows":[["עסקה (Transaction)","שורה בודדת של חיוב או זיכוי, כפי שנקלטה ממקור פיננסי. נתוני המקור אינם משתנים לעולם."],["תת-קטגוריה","הרמה הנמוכה ביותר בעץ הסיווג. לדוגמה: מוניות, סופרמרקט, חשמל."],["קטגוריה","קיבוץ של תתי-קטגוריות. לדוגמה: תחבורה, מזון, תשלומי בית."],["נושא (Topic)","חתך אנליטי-ניהולי מעל הקטגוריות, המשקף כוונה ולא סוג הוצאה. לדוגמה: שוטף, החזרי הלוואות, עזרה למשפחה, תרומות."],["נהנה (Beneficiary)","אדם או גורם שהכסף הועבר אליו או לטובתו, לצורך שאלות מסוג \"כמה נתתי ליואב\"."],["חוק סיווג (Rule)","כלל אוטומטי הממפה תבנית בתיאור העסקה או בשם בית העסק לסיווג. מבנה מלא בסעיף 6.4."],["נושא ראשי (Primary Topic)","הנושא היחיד שלפיו מחושבים כל הסיכומים והפילוחים. לכל קטגוריה נושא ראשי אחד בלבד, גם כשהיא משויכת לנושאים נוספים."],["נושא משני","שיוך נוסף של קטגוריה לנושא, לצורכי חתך אנליטי בלבד. אינו משתתף בסיכומים."],["סוג תנועה (Movement Type)","אחד משלושה: הוצאה, הכנסה או העברה. קובע אם העסקה נספרת בסיכומים. טבלת הכרעה בסעיף 5.3."],["פרופיל מיפוי (Import Profile)","מיפוי שמור בין עמודות קובץ של מקור מסוים לשדות הסכמה האחידה, כדי שייבוא חוזר מאותו מקור לא ידרוש מיפוי מחדש."],["מפתח כפילות","צירוף השדות שלפיו המערכת מזהה שעסקה כבר קיימת במאגר. מוגדר בסעיף 4.4."],["טעינה (Import)","אירוע ייבוא בודד של קובץ אחד. כל עסקה משויכת לטעינה, וטעינה ניתנת לביטול מלא."],["מקור סיווג","כיצד הגיעה העסקה לסיווגה: ידני, חוק, למידה מתיקונים או AI."]]},{"t":"h3","text":"0.4 מוסכמות תצוגה וחישוב"},{"t":"p","text":"מוסכמות אלה חלות על כל המסכים, הגרפים והייצוא. אין להחליט אותן מחדש ברמת המסך."},{"t":"table","head":["נושא","מוסכמה"],"rows":[["שפה וכיוון","עברית, RTL מלא בכל המסכים, כולל סדר עמודות בטבלאות וכיוון גלילה."],["מטבע","שקל חדש. תצוגה: ₪ לפני המספר, מפריד אלפים בפסיק, ללא אגורות בסיכומים ובגרפים (₪12,480), ועם שתי ספרות אחרי הנקודה ברמת העסקה הבודדת (₪128.90)."],["תצוגת תאריך","DD/MM/YYYY. בגרפים חודשיים: MM/YYYY."],["אזור זמן","Asia/Jerusalem. תאריכים נשמרים כתאריך בלבד, ללא שעה, כדי למנוע הזזת יום."],["הגדרת חודש","מהיום הראשון ועד היום האחרון בחודש הקלנדרי, כולל. אין חודש פיננסי נפרד בגרסה 1."],["שנה","שנה קלנדרית, ינואר עד דצמבר."],["תחילת שבוע","יום ראשון."],["תקופת ברירת מחדל","דשבורד: החודש הנוכחי. רשימת הוצאות וניתוח: 12 החודשים האחרונים."],["תאריך קובע לניתוח","תאריך החיוב, אלא אם שונה בהגדרות (סעיף 4.5)."],["עיגול","סכומים נשמרים בדיוק מלא ומעוגלים רק בתצוגה. אחוזים מוצגים בספרה אחת אחרי הנקודה, והסכום מוצג תמיד לצד האחוז."],["מספרים שליליים","מוצגים עם סימן מינוס לפני הסכום, בצבע נבדל, ולעולם לא בסוגריים."],["מיון טקסט עברי","לפי א-ב, כאשר ערכים ריקים בסוף הרשימה."]]}]},{"id":"product","num":"1","title":"תיאור המוצר","blocks":[{"t":"lead","text":"Flow-Wise היא מערכת חכמה לניהול, איחוד, סיווג וניתוח של הוצאות ותקבולים אישיים לאורך זמן. המערכת מרכזת נתונים ממספר מקורות פיננסיים, מאחדת אותם למאגר עסקאות אחד, מאפשרת סיווג וקטלוג מחדש, ומפיקה ניתוחים ותובנות בעזרת AI."},{"t":"h3","text":"1.1 הבעיה"},{"t":"p","text":"הנתונים הפיננסיים מפוזרים בין כרטיסי אשראי, חשבונות בנק ומקורות נוספים. קשה לקבל תמונה רב-שנתית ברורה, להבין לאן הולך הכסף, לזהות מגמות, וללמוד כיצד לשפר את פיזור התזרים."},{"t":"h3","text":"1.2 הפתרון"},{"t":"p","text":"מערכת אחת שמאחדת את העסקאות, מאפשרת סיווג גמיש, ניתוח היסטורי, גרפים אינטראקטיביים ושאילתות חופשיות בשפה טבעית."},{"t":"p","text":"מטרת המערכת היא לענות על השאלה: לאן הולך הכסף שלי לאורך זמן, מה השתנה, ומה אני יכול ללמוד מכך כדי לשפר את ניהול ופיזור התזרים — ובפרט בין הוצאות שוטפות, החזר הלוואות, עזרה למשפחה ותרומות לצרכי מס."},{"t":"h3","text":"1.3 קהל יעד"},{"t":"p","text":"בגרסה הראשונה: משתמש יחיד המנהל ומנתח את כספיו האישיים."},{"t":"p","text":"פיתוח עתידי: תמיכה במספר משתמשים וברמות חשיפה שונות בהתאם לסיווג הנתונים. לדוגמה, מתן גישה למשתמש מסוים רק לנתוני שוטף, רק להלוואות, או רק לעזרה לילדים. רמות החשיפה ייקבעו לפי הרשאות וסיווגי הנתונים."},{"t":"h3","text":"1.4 עקרונות מנחים"},{"t":"ul","items":["נתוני המקור קדושים — נשמרים כפי שנקלטו ואינם נדרסים לעולם.","הסיווג הוא שכבה נפרדת ומתקנת מעל נתוני המקור, וניתן לשנותה בכל עת.","כל חישוב מתבצע בבסיס הנתונים. ה-AI מבין את השאלה ומסביר את התשובה, אך אינו מחשב מספרים.","כל מספר במסך ניתן ללחיצה ולפירוק לעסקאות שמרכיבות אותו."]}]},{"id":"scope","num":"2","title":"היקף הגרסאות","blocks":[{"t":"lead","text":"אחד הלקחים מגרסה 0.3 היה שההיקף רחב מדי לגרסה ראשונה. סעיף זה מגדיר סדר עדיפויות ברור. שום דבר לא נמחק — רק נדחה לשלב מאוחר יותר."},{"t":"h3","text":"2.1 גרסה 1 — הליבה"},{"t":"p","text":"המטרה: להביא נתונים אמיתיים פנימה, לסווג אותם נכון, ולראות אותם בגרף אחד שאפשר להתפרק ממנו לעסקאות."},{"t":"table","head":["מודול","רכיב","למה זה בליבה"],"rows":[["M1","ייבוא ואיחוד נתונים","בלי נתונים אין מוצר. זהו גם הרכיב המסוכן ביותר טכנית."],["M2","עסקאות, רשימת הוצאות וסיווג","היכולת לתקן ולקטלג מחדש היא מה שהופך נתונים גולמיים לשימושיים."],["M3","מנוע סיווג — Rules ולמידה מתיקונים","בלעדיו הסיווג הידני אינו בר-קיימא בהיקף של אלפי עסקאות."],["M4","גרפים עם Drill-down","זהו לב חוויית התובנה. מספיק Bar ו-Pie בגרסה זו."],["M5","דשבורד","תמונת מצב פותחת, נבנה אחרון כי הוא צורך את כל השאר."],["—","עיצוב בסיסי והזדהות","מצב בהיר/כהה, צבע הדגשה אחד, ומסך התחברות לפי סעיף 10.1."]]},{"t":"p","text":"מזהי המודולים M1–M9 קבועים לאורך כל המסמך: הם מוגדרים בסעיף 3, מתועדפים כאן, ומתורגמים לסדר בנייה בסעיף 12 ובנספח ג'."},{"t":"h3","text":"2.2 גרסה 1.5"},{"t":"ul","items":["AI Financial Analyst — שאילתות בשפה טבעית עם שמירת הקשר.","מודול תובנות ואופטימיזציית תזרים.","AI fallback לעסקאות שהחוקים לא זיהו, כולל Confidence score.","ניתוח היסטורי מתקדם: חודש רגיל, זיהוי חריגות, השוואת שנים.","מודול נהנים מלא, כולל זיהוי אוטומטי."]},{"t":"h3","text":"2.3 Backlog — לא בטווח הנראה לעין"},{"t":"ul","items":["התאמה אישית מלאה של ערכת העיצוב (ראו נספח א').","מערכת הרשאות רב-משתמשית לפי פלחי מידע.","Open Banking אוטומטי, אפליקציית מובייל נייטיב, ניהול השקעות, תחזיות שוק ההון.","ביצוע פעולות בנקאיות או העברות כספים, ייעוץ השקעות אוטונומי, מערכת חשבונאית מלאה."]}]},{"id":"modules","num":"3","title":"מודולים, פיצ'רים וקריטריוני קבלה","blocks":[{"t":"lead","text":"לכל מודול מוגדרים קריטריוני קבלה — משפטים הניתנים לבדיקה בינארית. מודול נחשב גמור רק כאשר כל הקריטריונים שלו מתקיימים."},{"t":"h3","text":"M1 — ייבוא ואיחוד נתונים (v1)"},{"t":"ul","items":["העלאת קבצים ממקורות פיננסיים שונים, כולל העלאת מספר קבצים בבת אחת.","זיהוי אוטומטי של המקור לפי חתימת הקובץ, ומיפוי עמודות למבנה אחיד.","שמירת פרופיל מיפוי לכל מקור, כך שייבוא הבא מאותו מקור אינו דורש מיפוי חוזר.","מסך Preview לפני קליטה: כמה שורות נקראו, כמה יסווגו, כמה זוהו ככפילויות, כמה נכשלו ומדוע.","זיהוי כפילויות ומניעת ספירה כפולה לפי מפתח מוגדר (ראו סעיף 4).","היסטוריית טעינות עם אפשרות לבטל טעינה שלמה (Rollback)."]},{"t":"label","text":"קריטריוני קבלה"},{"t":"sub","items":["ייבוא חוזר של אותו קובץ מוסיף 0 עסקאות ומדווח על מספר הכפילויות שזוהו.","סכום העסקאות שנקלטו שווה בדיוק לסכום בקובץ המקור, כולל שורות זיכוי.","שורה שנכשלה בקליטה מוצגת למשתמש עם סיבת הכשל, ואינה מפילה את שאר הקובץ.","ביטול טעינה מחזיר את המאגר בדיוק למצבו לפני הטעינה."]},{"t":"h3","text":"M2 — עסקאות, רשימת הוצאות וסיווג (v1)"},{"t":"ul","items":["טבלת עסקאות עם חיפוש חופשי, מיון וסינון לפי תאריך, סכום, חשבון, קטגוריה ונושא.","מסך רשימת הוצאות המציג לכל עסקה את הקטגוריה ואת הנושא הראשי, ומאפשר לשנות אותם ישירות מהשורה — לעסקה בודדת או לקבוצת עסקאות מסומנות.","קטלוג מחדש של נתונים היסטוריים בכל שלב, ללא מגבלת זמן.","יצירת נושא או קטגוריה חדשים והעברת קטגוריות בין נושאים.","שמירת נתוני המקור לצד שכבת הסיווג, כולל תיעוד מי שינה ומתי."]},{"t":"label","text":"קריטריוני קבלה"},{"t":"sub","items":["שינוי סיווג של 500 עסקאות בפעולה אחת מסתיים בפחות מ-3 שניות ומעדכן את כל הסיכומים.","לאחר שינוי סיווג, הערך המקורי מהקובץ עדיין ניתן לצפייה בעסקה.","סינון לפי נושא ראשי מחזיר בדיוק את הסכום המוצג לאותו נושא בדשבורד. סינון לפי נושא משני מסומן בממשק כחתך אנליטי, וסכומו אינו אמור להשתלב בסך הכולל (ראו החלטה 11)."]},{"t":"h3","text":"M3 — מנוע סיווג חכם (v1 חלקי, v1.5 מלא)"},{"t":"ul","items":["חוקים המבוססים על בית עסק, תיאור, סכום או חשבון. תמיכה בהתאמה מדויקת ובהכלה.","למידה מתיקונים: תיקון ידני חוזר מציע ליצור חוק אוטומטי.","AI fallback לעסקאות לא מזוהות (v1.5).","Confidence score והפניית עסקאות בספק לתור בדיקה ייעודי.","סדר קדימויות ברור בין חוקים, כדי שהתנהגות המנוע תהיה צפויה."]},{"t":"label","text":"קריטריוני קבלה"},{"t":"sub","items":["יצירת חוק חדש מציעה להחיל אותו רטרואקטיבית, ומציגה כמה עסקאות יושפעו לפני האישור.","סיווג ידני של המשתמש גובר תמיד על סיווג אוטומטי ואינו נדרס בייבוא הבא.","כל עסקה מציגה מדוע סווגה כך: לפי איזה חוק, לפי למידה או לפי AI."]},{"t":"h3","text":"M4 — גרפים וניתוח (v1)"},{"t":"p","text":"לפני יצירת גרף יוצג מסך בחירה שבו המשתמש מגדיר את חתך הניתוח."},{"t":"ul","items":["חתך לפי חודש, לפי תת-קטגוריה, לפי קטגוריה או לפי נושא.","בחירת תקופה: חודש, שנה, מספר שנים או טווח תאריכים חופשי.","Preview של מספר העסקאות והסכום הכולל לפני יצירת הגרף.","Bar Chart ו-Pie Chart אינטראקטיביים. כאשר יש ריבוי קטגוריות: Top 9 ו-Other.","לחיצה על עמודה או פלח פותחת את מסך רשימת ההוצאות הקיים, מסונן לפי אותו חתך."]},{"t":"label","text":"קריטריוני קבלה"},{"t":"sub","items":["סכום כל הפלחים בגרף שווה לסכום הכולל המוצג בכותרת, כולל פלח Other.","Drill-down פותח את רשימת ההוצאות עם כותרת המסבירה את מקור הסינון, לדוגמה \"מוניות — ינואר עד יוני 2026\".","חזרה מהרשימה לגרף משמרת את הגרף, המסננים והגלילה."]},{"t":"h3","text":"M5 — דשבורד (v1)"},{"t":"ul","items":["תמונת מצב לתקופה שנבחרה: הכנסות, הוצאות, מאזן נטו והוצאה חודשית ממוצעת.","פילוח לפי נושא, קטגוריה ותת-קטגוריה.","השוואה לתקופה קודמת עם הצגת שיעור השינוי.","Top Categories והפניה מהירה לניתוח מעמיק."]},{"t":"label","text":"קריטריוני קבלה"},{"t":"sub","items":["כל מספר בדשבורד ניתן ללחיצה ומוביל לרשימת העסקאות שמרכיבות אותו.","שינוי תקופה מעדכן את כל הרכיבים במסך באופן עקבי, ללא ערכים משוריינים."]},{"t":"h3","text":"M6 — נהנים (v1 בסיסי, v1.5 מלא)"},{"t":"p","text":"מודול זה קיבל מעמד עצמאי בגרסה 0.4, מפני שדוגמת השימוש המרכזית של ה-AI (\"כמה נתתי ליואב\") תלויה בו לחלוטין, ובגרסה 0.3 הוא הופיע רק כשורה במודל הנתונים."},{"t":"ul","items":["ניהול רשימת נהנים: שם, יחס (בן/בת, הורה, מוסד), הערות.","שיוך נהנה לעסקה בשלוש דרכים: ידנית, בפעולה קבוצתית, או באמצעות חוק לפי תיאור ההעברה.","עסקה יכולה להיות משויכת לנהנה אחד לכל היותר.","מסך נהנה יחיד: סך הכל לאורך זמן, התפלגות חודשית ושנתית, ורשימת העסקאות."]},{"t":"label","text":"קריטריוני קבלה"},{"t":"sub","items":["שאילתה על נהנה מחזירה את אותו סכום כמו סינון ידני של רשימת העסקאות לפי אותו נהנה.","שינוי שם נהנה אינו מנתק את השיוך של עסקאות קיימות."]},{"t":"h3","text":"M7 — ניתוח היסטורי (v1.5)"},{"t":"ul","items":["מגמות חודשיות ושנתיות והשוואת שנים ותקופות.","ממוצע, חציון, מינימום ומקסימום לכל קטגוריה.","זיהוי הוצאות חד-פעמיות וחריגות.","זיהוי \"חודש רגיל\" והפרדה בין הוצאות קבועות, משתנות, חד-פעמיות, עזרה למשפחה והחזרי חוב."]},{"t":"label","text":"קריטריוני קבלה"},{"t":"sub","items":["הגדרת חריגה מפורשת וניתנת לבדיקה: הוצאה בקטגוריה הגדולה מפי שניים מהחציון של אותה קטגוריה ב-12 החודשים האחרונים.","\"חודש רגיל\" מחושב כחציון ההוצאות החודשיות לאחר החרגת עסקאות שסומנו כחד-פעמיות ושל תנועות מסוג העברה, והנוסחה מוצגת למשתמש.","כל מספר בכל מסך היסטורי לחיץ ומוביל לעסקאות שמרכיבות אותו.","השוואת שתי תקופות באורך שונה מציגה אזהרה, ולא משווה סכומים גולמיים."]},{"t":"h3","text":"M8 — AI Financial Analyst (v1.5)"},{"t":"p","text":"מסך צ'אט המאפשר שאילתות בשפה חופשית. דוגמה: \"הראה לי כמה כסף נתתי ליואב משנת 2023 ועד היום בהתפלגות חודשית\"."},{"t":"ul","items":["זיהוי אוטומטי של תקופה, נהנה, קטגוריה או נושא, סוג חישוב וצורת התפלגות.","הצגת סכום כולל, פירוט תקופתי וגרף מתאים, עם Drill-down לעסקאות המקור.","שמירת הקשר לשאילתות המשך: \"עכשיו רק 2025\", \"השווה לרפאל\", \"תציג לפי שנה\"."]},{"t":"label","text":"מעקות בטיחות — תוספת מרכזית בגרסה 0.4"},{"t":"sub","items":["הד פרשנות: לפני התשובה המערכת מציגה שורה אחת המתארת כיצד הבינה את השאלה — תקופה, מסננים וסוג החישוב. המשתמש יכול לתקן בלחיצה.","החישוב מתבצע תמיד בבסיס הנתונים. המודל מייצר שאילתה מובנית בלבד ולעולם אינו מייצר מספרים בעצמו.","כאשר השאלה אינה ניתנת למענה מהנתונים הקיימים, המערכת אומרת זאת במפורש ומציעה ניסוח חלופי. אסור להחזיר הערכה או ניחוש.","כל תשובה מציגה את מספר העסקאות שנכללו בחישוב, כאמצעי בקרה למשתמש.","פרטיות: לפני השליחה למודל חיצוני, נתוני העסקאות אינם נשלחים. נשלחת השאלה בלבד יחד עם סכמת הנתונים ורשימת הקטגוריות והנושאים. שמות נהנים נשלחים כמזהים ולא כשמות מלאים."]},{"t":"h3","text":"M9 — תובנות ואופטימיזציית תזרים (v1.5)"},{"t":"ul","items":["זיהוי שינוי בדפוסי הוצאה.","בחינת פיזור החזרי הלוואות ופיזור עזרה למשפחה לאורך זמן.","מעקב אחר תרומות מוכרות במס לאורך השנה, מול תקרת ההכרה.","זיהוי חודשים עמוסים בהתחייבויות והצעת תרחישים לפיזור יציב יותר.","כל תובנה מלווה בנתונים שהובילו אליה ובקישור לעסקאות."]},{"t":"label","text":"קריטריוני קבלה"},{"t":"sub","items":["כל תובנה מציגה את המספרים שהובילו אליה ואת מספר העסקאות שנכללו, וניתן להגיע מהן לרשימת העסקאות.","אין הצגת תובנה ללא בסיס: קטגוריה עם פחות משלושה חודשי נתונים אינה מייצרת תובנת מגמה.","המשתמש יכול לסגור תובנה, והיא אינה חוזרת על אותם נתונים."]}]},{"id":"import","num":"4","title":"מפרט ייבוא מפורט","blocks":[{"t":"lead","text":"זהו הרכיב המסוכן ביותר במערכת ולכן הוא מפורט כאן יותר מכל מודול אחר. כשל בייבוא אינו באג בודד — הוא מרעיל את כל הנתונים שמעליו."},{"t":"h3","text":"4.1 פורמטים נתמכים"},{"t":"table","head":["פורמט","סטטוס בגרסה 1","הערות"],"rows":[["Excel (xlsx / xls)","נתמך","פורמט היצוא הנפוץ ביותר של בנקים וחברות אשראי בישראל."],["CSV","לא בגרסה 1","קבצי המקור מיוצאים כ-Excel. תמיכה ב-CSV תיבחן בהמשך."],["PDF","לא בגרסה 1","דורש חילוץ טבלאות ואמינותו נמוכה. ייבחן בגרסה 1.5."],["הזנה ידנית","נתמך","הוספת עסקה בודדת, לצרכי תיקון והשלמה."]]},{"t":"h3","text":"4.2 שלבי הייבוא"},{"t":"ol","items":["העלאה: המשתמש בוחר קובץ אחד או יותר.","זיהוי מקור: המערכת מזהה את המקור לפי חתימת הקובץ — שמות העמודות, מספר שורות הכותרת והמבנה. אם לא זוהה, המשתמש בוחר ידנית.","דילוג על כותרות: קבצי בנק ישראליים כוללים לרוב מספר שורות כותרת ומטא-דאטה לפני הטבלה. המערכת מאתרת את שורת הכותרת האמיתית ומדלגת על מה שמעליה.","מיפוי עמודות: מיפוי לשדות האחידים — תאריך עסקה, תאריך חיוב, תיאור, בית עסק, סכום, מטבע, סוג עסקה, מספר תשלום. המיפוי נשמר כפרופיל.","נרמול ערכים: פירוק תאריכים, ניקוי סימני מטבע ומפרידי אלפים, קביעת סימן, זיהוי מטבע.","בדיקת כפילויות מול המאגר הקיים ובתוך הקובץ עצמו.","Preview: הצגת סיכום לפני קליטה — נקלטו, כפילויות, כשלים, סכום כולל.","קליטה: שמירת השורות יחד עם רשומת ייבוא (import) המאפשרת ביטול.","סיווג אוטומטי: הפעלת מנוע החוקים על העסקאות החדשות."]},{"t":"h3","text":"4.3 נרמול ערכים — כללים"},{"t":"table","head":["נושא","כלל"],"rows":[["תאריכים","תמיכה בפורמטים DD/MM/YYYY, DD-MM-YY ו-YYYY-MM-DD. ברירת מחדל ישראלית: יום לפני חודש. במקרה דו-משמעי המערכת שואלת פעם אחת לכל פרופיל מקור."],["סכומים","הסרת סימן ₪, פסיקי אלפים ורווחים. סוגריים משמעם ערך שלילי. עמודות נפרדות של חובה וזכות מאוחדות לשדה סכום יחיד."],["מטבע","ברירת מחדל ILS. עסקה במטבע זר נשמרת עם סכום מקורי, מטבע מקורי וסכום בשקלים כפי שחויב בפועל. כל הניתוחים מתבצעים בשקלים."],["קידוד","זיהוי אוטומטי של UTF-8 ו-Windows-1255. טקסט עברי משובש בתצוגה מסמן זיהוי שגוי ומוצג למשתמש ב-Preview."],["רווחים","קיצוץ רווחים מיותרים וכיווץ רווחים כפולים בתיאור, לצורך התאמת חוקים יציבה."]]},{"t":"h3","text":"4.4 מפתח זיהוי כפילויות"},{"t":"p","text":"קלט גרסה 1 הוא Excel בלבד. החלטה: עסקה נחשבת כפולה כאשר מתקיימת התאמה מלאה בין ארבעת השדות הבאים:"},{"t":"ul","items":["חשבון או כרטיס מקור.","תאריך העסקה.","הסכום המדויק, כולל סימן.","התיאור לאחר נרמול."]},{"t":"p","text":"בנוסף, אם למקור יש מזהה עסקה ייחודי משלו, הוא גובר על ארבעת השדות ומשמש כמפתח יחיד."},{"t":"p","text":"מקרה קצה מוכר: שתי עסקאות אמיתיות זהות באותו יום (לדוגמה, שתי נסיעות מונית באותו סכום). לכן זיהוי כפילות אינו מוחק אוטומטית — הוא מסמן, ומציג למשתמש ב-Preview רשימה של החשודות עם אפשרות לאשר קליטה בכל זאת."},{"t":"h3","text":"4.5 מקרים פיננסיים מיוחדים"},{"t":"table","head":["מקרה","טיפול"],"rows":[["חיוב חודשי מרוכז של כרטיס אשראי","החיוב בחשבון הבנק מסומן כ-Transfer ומוחרג מסך ההוצאות, כדי שלא ייספר פעמיים לצד העסקאות הפרטניות של אותו כרטיס. אם לא נטענו העסקאות הפרטניות של אותו חודש, החיוב המרוכז כן נספר, והמערכת מתריעה על כך."],["העברות בין חשבונות עצמיים","מסומנות כ-Transfer, אינן הכנסה ואינן הוצאה. המערכת מציעה זיהוי אוטומטי לפי סכומים תואמים בהפרש של עד 3 ימים בין שני חשבונות של המשתמש."],["תשלומים (עסקה בתשלומים)","כל תשלום נשמר כעסקה נפרדת בתאריך החיוב שלו, עם קישור לעסקת האם ושדות \"תשלום מספר\" ו-\"מתוך\". הניתוח מתבצע לפי מועד החיוב בפועל."],["הוראות קבע","מסומנות כהוצאה קבועה. חזרתיות מזוהה לפי אותו בית עסק וסכום דומה במרווח חודשי."],["זיכויים והחזרים","סוג תנועה: הוצאה, בסימן חיובי, באותה קטגוריה של החיוב המקורי. מקטינים את סך ההוצאה ואינם נספרים כהכנסה. ראו טבלת ההכרעה בסעיף 5.3."],["משיכה מחיסכון או מהשקעות","מסווגת כ-Transfer ולא כהכנסה. החלטה זו נובעת מכך שאין כאן כסף חדש."],["תאריך עסקה מול תאריך חיוב","שני השדות נשמרים. ברירת המחדל לניתוח היא תאריך החיוב, מפני שהוא זה שמשפיע על התזרים בפועל. ניתן להחליף בהגדרות."]]},{"t":"h3","text":"4.6 סכמת העסקה האחידה"},{"t":"p","text":"כל קובץ מקור מתורגם למבנה האחיד הבא. עמודת החובה קובעת האם ניתן לקלוט שורה בלעדיה."},{"t":"table","head":["שדה","טיפוס ופורמט","חובה","התנהגות כשהערך חסר או שגוי"],"rows":[["transaction_date — תאריך עסקה","תאריך","לא","אם חסר, מועתק מתאריך החיוב."],["charge_date — תאריך חיוב","תאריך","כן","אם חסר, מועתק מתאריך העסקה. אם שניהם חסרים — השורה נכשלת (E-01)."],["description — תיאור","טקסט, עד 300 תווים","כן","אם חסר, נשמר \"ללא תיאור\" והשורה מסומנת לבדיקה."],["merchant — בית עסק","טקסט, עד 150 תווים","לא","אם חסר, נגזר מהתיאור לצורך התאמת חוקים."],["amount — סכום","מספר עשרוני, שתי ספרות אחרי הנקודה","כן","שורה ללא סכום מספרי תקין נכשלת (E-02). סכום 0 נקלט ומסומן לבדיקה."],["currency — מטבע","קוד בן שלוש אותיות, ברירת מחדל \"ILS\"","כן","אם חסר, ILS."],["original_amount / original_currency","מספר / קוד מטבע","לא","ממולאים רק בעסקה במטבע זר."],["account_id — חשבון או כרטיס","מזהה חשבון קיים","כן","נקבע בעת הייבוא ברמת הקובץ, לא ברמת השורה."],["movement_type — סוג תנועה","הוצאה / הכנסה / העברה","כן","נקבע אוטומטית לפי סעיף 5.3, וניתן לשינוי ידני."],["installment_no / installment_total","מספר שלם","לא","ממולאים רק בעסקה בתשלומים."],["source_txn_id — מזהה מקור","טקסט","לא","כאשר קיים, הוא מפתח הכפילות היחיד."],["import_id — מזהה טעינה","מזהה","כן","נוצר על ידי המערכת, ומאפשר ביטול טעינה."],["raw_row — השורה המקורית","טקסט מובנה","כן","נשמרת כפי שנקלטה, ואינה משתנה לעולם."]]},{"t":"h3","text":"4.7 קטלוג שגיאות ייבוא"},{"t":"table","head":["קוד","מתי","הודעה למשתמש","תוצאה"],"rows":[["E-01","אין תאריך תקין בשורה","שורה ללא תאריך תקין","השורה נדחית ומוצגת ברשימת הכשלים."],["E-02","אין סכום מספרי תקין","לא זוהה סכום בשורה","השורה נדחית."],["E-03","תאריך דו-משמעי (יום/חודש)","פורמט התאריך אינו חד-משמעי — בחר פורמט","עצירה ושאלה אחת לכל פרופיל מקור, ואז המשך."],["E-04","טקסט עברי משובש — קידוד שגוי","זוהתה בעיית קידוד בקובץ","מוצג ב-Preview עם דוגמה. המשתמש בוחר קידוד או מבטל."],["E-05","לא זוהתה שורת כותרת","לא הצלחנו לזהות את מבנה הקובץ","המשתמש בוחר ידנית את שורת הכותרת."],["E-06","עמודת חובה לא מופתה","חסר מיפוי לשדה חובה","הקליטה חסומה עד להשלמת המיפוי."],["E-07","כפילות חשודה","עסקה זהה כבר קיימת במאגר","מסומנת ב-Preview, אינה נקלטת אלא באישור מפורש."],["E-08","הקובץ אינו Excel תקין או פגום","לא ניתן לקרוא את הקובץ","הקובץ נדחה כולו."],["E-09","הקובץ חורג מהמגבלות בסעיף 4.8","הקובץ גדול מדי","הקובץ נדחה כולו עם הסבר."],["E-10","כל שורות הקובץ נכשלו","לא נקלטה אף שורה מהקובץ","לא נוצרת רשומת ייבוא כלל."]]},{"t":"p","text":"כלל על: שורה שנכשלה לעולם אינה מפילה את הקובץ. הקליטה ממשיכה, והכשלים מוצגים בטבלה הניתנת לייצוא, עם מספר השורה בקובץ המקורי."},{"t":"h3","text":"4.8 מגבלות, ריבוי קבצים וייבוא חוזר"},{"t":"table","head":["נושא","כלל"],"rows":[["גודל קובץ","עד 10MB לקובץ."],["מספר שורות","עד 20,000 שורות לקובץ. מעבר לכך המשתמש מתבקש לפצל."],["ריבוי קבצים","ניתן להעלות עד 10 קבצים בפעולה אחת. כל קובץ מעובד בנפרד, מקבל רשומת ייבוא משלו, וניתן לביטול בנפרד."],["חשבון לכל קובץ","כל קובץ משויך לחשבון או לכרטיס אחד, הנבחר לפני הקליטה."],["ייבוא חוזר חלקי","קובץ המכיל גם שורות שכבר נקלטו וגם שורות חדשות: הכפילויות מסומנות ואינן נקלטות, החדשות נקלטות. ה-Preview מציג את שתי הכמויות בנפרד."],["ביטול טעינה","מחיקה מלאה של כל העסקאות של אותה רשומת ייבוא, כולל הסיווגים שנוצרו להן. ביטול נחסם אם עסקאות מאותה טעינה שימשו בסיווג ידני — במקרה זה מוצגת אזהרה ואישור נוסף."],["טעינה נכשלת באמצע","הקליטה אטומית ברמת הקובץ: או שכל השורות התקינות נקלטות, או שאף אחת."]]}]},{"id":"semantics","num":"5","title":"סמנטיקה פיננסית","blocks":[{"t":"h3","text":"5.1 מוסכמת סימן"},{"t":"ul","items":["הוצאה נשמרת כערך שלילי. הכנסה נשמרת כערך חיובי.","בתצוגה למשתמש הוצאות מוצגות כערך חיובי בהקשר של \"סך הוצאות\", כדי למנוע בלבול.","מאזן נטו = סך ההכנסות פחות סך ההוצאות, ללא העברות."]},{"t":"h3","text":"5.2 שלושת סוגי התנועה"},{"t":"table","head":["סוג","הגדרה והשפעה"],"rows":[["הוצאה (Expense)","כסף שיצא מהמשק הבית. נספר בסך ההוצאות ובכל הפילוחים."],["הכנסה (Income)","כסף חדש שנכנס מבחוץ: משכורת, קצבה, החזר מס. נספר בסך ההכנסות."],["העברה (Transfer)","תנועת כסף בין חשבונות של אותו משתמש, או חיוב אשראי מרוכז. אינה נספרת לא כהוצאה ולא כהכנסה, ומוחרגת מכל הפילוחים."]]},{"t":"p","text":"כל עסקה חייבת להיות מסווגת לאחד משלושת הסוגים. סיווג שגוי כאן הוא מקור הטעות הפיננסית החמור ביותר במערכת."},{"t":"h3","text":"5.3 טבלת הכרעה — סוג תנועה וסימן"},{"t":"p","text":"זוהי הטבלה הקובעת. בכל מקרה של ספק בין סעיף 4.5 לסעיף זה, טבלה זו גוברת. הסימן המצוין הוא הסימן הנשמר במאגר, לא הסימן המוצג."},{"t":"table","head":["מקרה","סוג תנועה","סימן שמור","השפעה על הסיכומים"],"rows":[["רכישה רגילה בכרטיס או בחשבון","הוצאה","שלילי","מגדילה את סך ההוצאות ואת הקטגוריה."],["משכורת, קצבה, החזר מס","הכנסה","חיובי","מגדילה את סך ההכנסות."],["זיכוי או החזר מבית עסק (החזרת מוצר, ביטול חיוב)","הוצאה","חיובי","מקטינה את סך ההוצאות ואת אותה קטגוריה. אינה נספרת כהכנסה."],["חיוב חודשי מרוכז של כרטיס אשראי בחשבון הבנק","העברה","שלילי","מוחרג לחלוטין, בתנאי שהעסקאות הפרטניות של אותו כרטיס ואותו חודש נטענו."],["העברה בין שני חשבונות של המשתמש","העברה","לפי הכיוון","מוחרגת משני הצדדים."],["הפקדה לחיסכון או להשקעה","העברה","שלילי","מוחרגת מההוצאות, ומוצגת בנפרד בנושא \"חיסכון והשקעות\"."],["משיכה מחיסכון או מהשקעות","העברה","חיובי","אינה הכנסה. אין כאן כסף חדש."],["תשלום בהוראת קבע","הוצאה","שלילי","נספרת רגיל, ומסומנת כהוצאה קבועה."],["תשלום בודד מתוך עסקה בתשלומים","הוצאה","שלילי","כל תשלום נספר בחודש החיוב שלו בלבד."],["ריבית ועמלות מינוס","הוצאה","שלילי","קטגוריית \"הלוואות\" או \"עמלות בנק\"."],["העברת כסף לאדם (עזרה למשפחה, מתנה)","הוצאה","שלילי","נספרת, ומשויכת לנהנה."],["קבלת כסף מאדם פרטי","הכנסה","חיובי","נספרת כהכנסה בתת-קטגוריה \"הכנסה אחרת\", אלא אם המשתמש מסמן ידנית כהעברה."]]},{"t":"p","text":"כלל תצוגה נגזר: במסכים מוצגים סכומי הוצאה בערך מוחלט תחת הכותרת המתאימה, וזיכוי מוצג בסימן מינוס לצד הסכום, כדי שיהיה ברור שהוא מקטין את ההוצאה ולא מוסיף אליה."}]},{"id":"taxonomy","num":"6","title":"עץ סיווג התחלתי","blocks":[{"t":"lead","text":"גרסה 0.3 הגדירה שלוש רמות סיווג אך לא נתנה אף דוגמה. ללא עץ התחלתי קונקרטי אין למנוע הסיווג יעד למדוד מולו. להלן עץ הזרעה שיוטען כברירת מחדל, וניתן לשינוי מלא על ידי המשתמש."},{"t":"h3","text":"6.1 נושאים אנליטיים"},{"t":"table","head":["נושא","מה נכלל","שאלה שהוא עונה עליה"],"rows":[["שוטף","מחיה יומיומית: מזון, תחבורה, תשלומי בית, בריאות","כמה עולה לי לחיות בחודש רגיל"],["דיור","משכנתה, שכר דירה, ארנונה, ועד בית, תחזוקה","כמה מהתזרים נעול בדיור"],["החזרי הלוואות","החזרי הלוואות, מינוס, אשראי חוץ-בנקאי","מתי מסתיימות ההתחייבויות ואיך הן מתפזרות"],["עזרה למשפחה","העברות לילדים, להורים ולקרובים","כמה נתתי, למי, ומתי"],["תרומות","תרומות למוסדות מוכרים לצורכי מס","כמה תרמתי השנה מול תקרת ההכרה"],["חד-פעמי","אירועים, רכישות גדולות, נסיעות לחו\"ל","מה עיוות את החודש הזה"],["חיסכון והשקעות","הפקדות לחיסכון, קרנות והשקעות","כמה באמת הצלחתי לחסוך"],["הכנסות","משכורת, קצבאות, החזרי מס, הכנסות אחרות","מהי ההכנסה הפנויה האמיתית"]]},{"t":"h3","text":"6.2 טבלת זרעה — קטגוריות, תתי-קטגוריות ונושא ראשי"},{"t":"p","text":"אלה השורות הממשיות שהמערכת טוענת בהפעלה הראשונה. עמודת הנושא הראשי היא הנושא שלפיו מחושבים כל הסיכומים (ראו החלטה 11 בסעיף 11). נושאים נוספים ניתן לשייך בכל עת דרך מסך הקטגוריות."},{"t":"table","head":["קטגוריה","נושא ראשי","תתי-קטגוריות"],"rows":[["מזון","שוטף","סופרמרקט, מכולת, שוק, מסעדות, בתי קפה, משלוחי אוכל"],["תחבורה","שוטף","דלק, מוניות, תחבורה ציבורית, חניה, כבישי אגרה, ביטוח רכב, טיפולים ורישוי"],["תשלומי בית","שוטף","חשמל, מים, גז, אינטרנט, טלוויזיה, סלולר"],["בריאות","שוטף","קופת חולים, ביטוח בריאות, תרופות, רופאי שיניים, טיפולים"],["ביטוחים","שוטף","ביטוח חיים, ביטוח דירה, ביטוח משלים"],["קניות אישיות","שוטף","ביגוד והנעלה, טיפוח, ספרים, ציוד לבית"],["פנאי ותרבות","שוטף","מנויים דיגיטליים, קולנוע והופעות, ספורט וחדר כושר, תחביבים"],["ילדים וחינוך","שוטף","גני ילדים, חוגים, שכר לימוד, ציוד לימודי"],["דיור","דיור","משכנתה, שכר דירה, ארנונה, ועד בית, תחזוקה ותיקונים"],["הלוואות","החזרי הלוואות","הלוואה בנקאית, הלוואה חוץ-בנקאית, ריבית ועמלות מינוס"],["עזרה למשפחה","עזרה למשפחה","עזרה לילדים, עזרה להורים, מתנות ואירועים משפחתיים"],["תרומות","תרומות","תרומה למוסד מוכר, מעשר, תמיכה שוטפת"],["אירועים ונסיעות","חד-פעמי","חופשות, טיסות, אירועים משפחתיים, רכישות גדולות"],["חיסכון","חיסכון והשקעות","הפקדה לחיסכון, קרן השתלמות, גמל להשקעה, ניירות ערך"],["הכנסות","הכנסות","משכורת, קצבה, החזר מס, הכנסה מהשכרה, הכנסה אחרת"],["עמלות בנק","שוטף","דמי ניהול חשבון, עמלות כרטיס, עמלות המרה"],["לא מסווג","שוטף","ממתין לסיווג"]]},{"t":"p","text":"קטגוריית \"לא מסווג\" היא חובה. כל עסקה שהמנוע לא זיהה משויכת אליה, כדי שלעולם לא תהיה עסקה ללא סיווג, והיא מוצגת בתור עבודה פתוח במסך העסקאות."},{"t":"h3","text":"6.3 דוגמאות לחוקי זרעה"},{"t":"table","head":["תבנית בתיאור","תת-קטגוריה","הערה"],"rows":[["שופרסל, רמי לוי, ויקטורי, יוחננוף","סופרמרקט","התאמת הכלה בשם בית העסק"],["פז, סונול, דלק, יילו","דלק","שים לב: \"דלק\" מופיע גם בשם החברה וגם כתיאור גנרי"],["גט, אובר, מוניות","מוניות",""],["חברת חשמל","חשמל",""],["ביטוח לאומי (זיכוי)","קצבה","סימן חיובי — יסווג כהכנסה"]]},{"t":"h3","text":"6.4 מפרט מנוע הסיווג (M3)"},{"t":"label","text":"מבנה חוק"},{"t":"table","head":["שדה","ערכים אפשריים","הערה"],"rows":[["שדה בדיקה","תיאור · בית עסק · סכום · חשבון · סוג תנועה","ניתן לשלב עד שלושה תנאים בחוק אחד, ביחס וגם."],["סוג התאמה","מכיל · שווה בדיוק · מתחיל ב · טווח סכומים","ההשוואה מתבצעת על הטקסט לאחר נרמול (סעיף 4.3), ללא תלות ברווחים כפולים."],["תוצאה","תת-קטגוריה (חובה) · נושא ראשי חלופי (רשות) · סוג תנועה (רשות) · נהנה (רשות)","הקטגוריה נגזרת אוטומטית מתת-הקטגוריה."],["עדיפות","מספר שלם 1–999, נמוך = חזק יותר","נקבע ידנית וניתן לגרירה בטבלת החוקים."],["מצב","פעיל · מושבת","השבתה אינה מוחקת סיווגים שכבר בוצעו."]]},{"t":"label","text":"סדר ההכרעה — מלמעלה למטה, הראשון שמתאים זוכה"},{"t":"ol","items":["סיווג ידני של המשתמש על העסקה — גובר תמיד ולעולם אינו נדרס, גם לא בייבוא חוזר או בהרצת חוקים מחדש.","מזהה עסקה זהה לעסקה שסווגה ידנית בעבר (אותו בית עסק ואותו סכום מדויק) — למידה מתיקונים.","חוק פעיל בעל מספר העדיפות הנמוך ביותר מבין החוקים המתאימים.","שובר שוויון בין חוקים באותה עדיפות: החוק הספציפי יותר — מספר תנאים גדול יותר, ואם עדיין שוויון, אורך מחרוזת ההתאמה הארוך יותר. אם גם זה שווה, החוק שנוצר מאוחר יותר.","AI fallback עם Confidence score (v1.5).","ברירת מחדל: תת-קטגוריה \"ממתין לסיווג\"."]},{"t":"label","text":"כללי הפעלה"},{"t":"ul","items":["החוקים מורצים אוטומטית על עסקאות חדשות בסיום כל ייבוא.","יצירה או עריכה של חוק מציגה לפני האישור כמה עסקאות קיימות יושפעו, ומאפשרת החלה רטרואקטיבית או החלה על עסקאות עתידיות בלבד.","החלה רטרואקטיבית לעולם אינה נוגעת בעסקאות שסווגו ידנית.","לאחר שלושה תיקונים ידניים של אותו בית עסק לאותה תת-קטגוריה, המערכת מציעה ליצור חוק, עם עדיפות ברירת מחדל 500.","כל עסקה שומרת את מקור הסיווג שלה — ידני, חוק (עם מזהה החוק), למידה או AI — ומציגה אותו בעמודת \"מקור סיווג\"."]}]},{"id":"screens","num":"7","title":"מסכים, ניווט וזרימות משתמש","blocks":[{"t":"h3","text":"7.1 מפת המסכים"},{"t":"table","head":["מסך","נתיב","תיאור","גרסה"],"rows":[["מסך פתיחה","/","מסך הבית הציבורי: שם המערכת 'תזרים+', תיאור קצר, תרשים עוגה ותרשים עמודות להמחשה בלבד (ללא תחקור) וכפתורי כניסה למערכת ולמסמך האפיון","v1"],["התחברות","/auth","כניסה בדוא\"ל וסיסמה או בחשבון Google; כל שאר המסכים דורשים משתמש מחובר","v1"],["דשבורד","/dashboard","מסך הבית: תמונת מצב כוללת לתקופה נבחרת (3/6/12 חודשים או הכל), תרשים תזרים חודשי ותרשים עוגה לפי נושא","v1"],["עסקאות / רשימת הוצאות","/transactions","רשימה, מיון, סינון מרובה-ערכים לכל עמודה, עימוד, עריכת סיווג בשורה ופעולות קבוצתיות","v1"],["ייבוא","/import","טעינת קובצי Excel, זיהוי לשוניות, Preview, מניעת כפילויות והיסטוריית טעינות עם ביטול","v1"],["קבצים ב-Google Drive","/drive","רשימת קובצי ה-Excel בתיקיית FlowWise, ממוינים לפי מועד עדכון","v1"],["קטגוריות ונושאים","/taxonomy","ניהול עץ הסיווג, שיוך קטגוריה לכמה נושאים וסימון נושא ראשי","v1"],["מסמך אפיון","/prd","צפייה במסמך ה-PRD בתוך המערכת","v1"],["מודולים","/modules","פירוט המודולים וקריטריוני הקבלה","v1"],["הגדרות","/settings","העדפות מערכת, מוסכמות תאריך, חשבונות ומצב תצוגה","v1.5"],["נהנים","/beneficiaries","ניהול נהנים ומסך נהנה יחיד","v1.5"],["AI Analyst","/assistant","שאילתות חופשיות בשפה טבעית","v1.5"],["תובנות","/insights","מגמות והצעות לשיפור התזרים","v1.5"]]},{"t":"label","text":"7.1.1 מסך רשימת ההוצאות (/transactions) — המסך המרכזי במערכת"},{"t":"table","head":["היבט","הגדרה"],"rows":[["עמודות, מימין לשמאל","תיבת סימון · תאריך · תיאור · סוג תנועה · סכום · קטגוריה · נושא · חשבון · מקור (שם הקובץ) · תפריט פעולות. בגרסה מלאה נוספות: בית עסק, תת-קטגוריה ומקור סיווג."],["עמודת חשבון","שורות מגיליון \"הוצאות מהחשבון בנק\" מוצגות כ\"בנק\". שורות מגיליון עסקאות אשראי מוצגות עם ארבע הספרות האחרונות של הכרטיס, הנקראות מתוך הגיליון עצמו (עמודת כרטיס או שורת כותרת) ובנפילה לאחור משם הקובץ."],["קטגוריה ונושא","נקראים כפי שהם מופיעים בקובץ האקסל, הן בגיליון הבנק והן בגיליון האשראי, ונשמרים כערך מקור הניתן לעריכה."],["מיון","כל כותרת עמודה ניתנת ללחיצה: לחיצה ראשונה ממיינת, לחיצה נוספת הופכת את הכיוון, וחץ מציין את המיון הפעיל. סכומים ומספרי כרטיס ממוינים מספרית, טקסט עברי לפי סדר אלפביתי עברי. ברירת המחדל: תאריך, מהחדש לישן."],["תקופת ברירת מחדל","12 החודשים האחרונים."],["עימוד","מוצגות 200 שורות ראשונות, עם כפתורי \"הצג עוד 500\" ו\"הצג הכל\" הממוקמים מעל הטבלה לצד מונה \"מוצגות N מתוך M\". הכפתורים נשארים תמיד גלויים ומושבתים כשאין עוד שורות. הסכום הכולל ומספר העסקאות מחושבים על כל התוצאה המסוננת, לא על המנה המוצגת."],["מסננים לפי עמודה","מתחת לכל כותרת עמודה בורר בסגנון אקסל: רשימת כל הערכים הקיימים עם תיבות סימון לבחירה מרובה, תיבת חיפוש בתוך הרשימה, \"בחר הכל\" ו\"נקה\". הרשימות מתעדכנות ומציגות רק ערכים שעדיין זמינים תחת שאר המסננים הפעילים."],["מסננים נוספים","חיפוש חופשי בתיאור ובמקור · טווח תאריכים · טווח סכומים · מצב סיווג (מסווג / ממתין) · נהנה (v1.5)"],["עריכה בשורה","תת-קטגוריה, קטגוריה ונושא ראשי ניתנים לשינוי ישירות מהשורה בבורר נפתח. שמירה מיידית עם אישור קצר ואפשרות ביטול."],["פעולות קבוצתיות","סימון שורות או סימון הכול לפי המסנן הנוכחי, ואז: שינוי סיווג, שינוי נושא, סימון כהעברה, סימון כחד-פעמי, שיוך נהנה (v1.5), יצירת חוק מהבחירה."],["שקיפות","לחיצה על שורה פותחת חלונית צד עם נתוני המקור כפי שנקלטו, היסטוריית שינויי הסיווג, ומזהה הייבוא שממנו הגיעה."],["שימור מצב","מסננים, מיון, מיקום גלילה והשורות המסומנות נשמרים במעבר למסך אחר וחזרה."],["Empty state","ללא נתונים: \"עדיין אין עסקאות\" עם כפתור למסך הייבוא. עם מסננים ללא תוצאה: הצעה לנקות מסננים."]]},{"t":"label","text":"7.1.2 יתר מסכי גרסה 1"},{"t":"table","head":["מסך","אזורי המסך","ברירות מחדל ופעולה ראשית"],"rows":[["דשבורד","בורר תקופה עליון · ארבעה כרטיסי מדד (הכנסות, הוצאות, מאזן נטו, ממוצע חודשי) · גרף פילוח לפי נושא · גרף מגמה חודשית · טבלת Top 10 קטגוריות","תקופה: החודש הנוכחי, עם השוואה לחודש הקודם. כל מספר לחיץ ומוביל לרשימת ההוצאות המסוננת."],["ייבוא","אזור גרירה · טבלת מיפוי עמודות · לוח Preview (נקלטו, כפילויות, כשלים, סכום) · טבלת היסטוריית טעינות","פעולה ראשית: העלאת קובץ. כל שורה בהיסטוריה כוללת תאריך, שם קובץ, חשבון, מספר עסקאות, סכום וכפתור ביטול טעינה."],["ניתוח","אשף בן ארבעה צעדים: תקופה · סוג חתך · בחירה ספציפית · Preview — ואחריו אזור הגרף","ברירת מחדל: 12 חודשים אחרונים, חתך לפי נושא. פעולה ראשית: צור תרשים. לחיצה על פלח פותחת את רשימת ההוצאות."],["קטגוריות ונושאים","עץ נושא ← קטגוריה ← תת-קטגוריה · חלונית קטגוריה עם שיוך לנושאים וסימון נושא ראשי · לשונית חוקי סיווג · שדות הוספה מהירה לנושא ולקטגוריה","פעולות: הוספה, שינוי שם, מיזוג, העברה בין נושאים. מחיקה נחסמת כשיש עסקאות משויכות, ומוצעת החלפה במקום."],["הגדרות","לשוניות: כללי (תאריך ניתוח, מטבע, מצב תצוגה) · חשבונות וכרטיסים · פרופילי ייבוא · נתונים (ייצוא וגיבוי)","ברירת מחדל לניתוח: תאריך חיוב. שיוך כרטיס אשראי לחשבון המחויב מוגדר כאן, והוא תנאי לזיהוי חיוב מרוכז."]]},{"t":"h3","text":"7.1.1 יצירת נושא או קטגוריה חדשים"},{"t":"p","text":"יצירת ערכי סיווג חדשים אפשרית בשני מסלולים משלימים, כדי שלא ייווצר מצב שבו המשתמש נאלץ לעזוב את מסך העבודה כדי להוסיף ערך חסר:"},{"t":"ul","items":["מסלול מנוהל — במסך 'קטגוריות ונושאים' קיימים שדה הוספה לנושא ושדה הוספה לקטגוריה, לצורך הקמה ותחזוקה מסודרת של עץ הסיווג.","מסלול מהיר (Inline) — בכל בורר נפתח של קטגוריה או נושא (ברשימת ההוצאות: עריכה בשורה ועריכה קבוצתית; ובעמודת הנושא הראשי במסך הסיווג) מופיעה אפשרות אחרונה '+ נושא חדש…' / '+ קטגוריה חדשה…'. בחירתה פותחת שדה טקסט קצר במקום הבורר.","לאחר שמירה הערך החדש נוצר, נטען לרשימות הפתוחות ונבחר אוטומטית עבור השורה או הקבוצה שממנה נוצר — ללא ניווט ובלי איבוד סינון, מיון או בחירת שורות.","Enter שומר, Escape מבטל. שם ריק אינו נשמר; שם קיים אינו יוצר כפילות אלא נבחר הערך הקיים."]},{"t":"p","text":"קריטריון קבלה: הוספת נושא או קטגוריה מתוך בורר בשורת עסקה משייכת את העסקה לערך החדש בפעולה אחת, והערך מופיע מיד גם במסך 'קטגוריות ונושאים' ובכל שאר הבוררים."},{"t":"h3","text":"7.1.2 התרשימים בדשבורד והתנהגות התחקור (Drill-down)"},{"t":"p","text":"הדשבורד הוא מסך הבית. הוא כולל שלוש כרטיסיות סיכום (הכנסות, הוצאות, יתרה), בורר תקופה (3 / 6 / 12 חודשים או הכל), תרשים עמודות של התזרים החודשי ותרשים עוגה של ההוצאות לפי נושא."},{"t":"ul","items":["לחיצה שמאלית על פלח בתרשים העוגה מתחקרת רמה אחת פנימה: פלח 'כרטיסי אשראי' נפתח לעוגת 'תקבולי כרטיס אשראי' לפי נושא; פלח 'אחר' נפתח לעוגה של הנושאים הקטנים; פלח רגיל שאין לו רמה נוספת פותח את רשימת העסקאות שלו.","לחיצה ימנית על פלח פותחת תמיד את רשימת העסקאות שמאחוריו, בלי להתחקר.","נושאים שחלקם בהוצאות קטן מ-2% מקובצים אוטומטית לפלח 'אחר'.","כפתור 'עסקאות' בכותרת התרשים פותח את כלל העסקאות של התצוגה הנוכחית.","בכל מסך ובכל רמת תחקור מופיע כפתור 'חזור' אחיד בפינה השמאלית העליונה, המחזיר צעד אחד אחורה."]},{"t":"h3","text":"7.1.3 מסך פתיחה וניווט קבוע"},{"t":"ul","items":["שם המערכת: תזרים+.","מסך הפתיחה (/) הוא מסך שיווקי-הסברי: כותרת 'תזרים+', משפט הסבר, ושני תרשימי דוגמה סטטיים (עוגה ועמודות) שאינם ניתנים לתחקור, לצד כפתור 'כניסה למערכת'.","בכל מסכי העבודה מוצג סרגל צד קבוע בצד ימין הכולל את כל המסכים: סקירה, עסקאות, ייבוא, קטגוריות ונושאים, קבצים ב-Drive, מסמך האפיון ומודולים. המסך הפעיל מסומן.","כותרת כל מסך כוללת כפתור 'חזור' אחיד בפינה השמאלית העליונה."]},{"t":"h3","text":"7.2 ניווט — החלטה"},{"t":"p","text":"בגרסה 0.3 הוגדרו שני מנגנוני ניווט מקבילים שחפפו זה לזה: שורת כפתורים עליונה וסרגל צד. גרסה 0.4 מכריעה:"},{"t":"ul","items":["הניווט הראשי הוא Sidebar בצד ימין, המכיל את כל מסכי המערכת. הוא ניתן לכיווץ, לפתיחה ולשינוי רוחב בגרירה, ומצבו נשמר כהעדפת משתמש.","מעל אזור התוכן תוצג שורת פעולות מהירות בלבד, ולא ניווט מלא: ייבוא קובץ, הוספת עסקה, חולל תרשים. שלוש פעולות, לא חמש.","המסך הפעיל מודגש ב-Sidebar. בסגירת ה-Sidebar אזור התוכן מתרחב אוטומטית.","הממשק כולו RTL מלא, כולל כיוון גלילה, יישור טבלאות וסדר עמודות."]},{"t":"h3","text":"7.3 זרימה: יצירת ניתוח"},{"t":"ol","items":["בחירת תקופה.","בחירת סוג ניתוח: חודש, תת-קטגוריה, קטגוריה או נושא.","בחירת הנושא או הקטגוריה הספציפיים במידת הצורך.","Preview של מספר העסקאות והסכום הכולל.","יצירת הגרף.","לחיצה על פלח או עמודה לקבלת רשימת העסקאות.","חזרה לגרף תוך שמירת כל הבחירות הקודמות."]},{"t":"h3","text":"7.4 זרימה: ייבוא קובץ"},{"t":"ol","items":["גרירת קובץ או בחירתו.","המערכת מזהה את המקור ומציגה את פרופיל המיפוי שזוהה.","המשתמש מאשר או מתקן את מיפוי העמודות.","Preview: נקלטו, כפילויות חשודות, שורות שנכשלו, סכום כולל.","אישור קליטה.","המערכת מציגה כמה עסקאות סווגו אוטומטית וכמה ממתינות לסיווג ידני."]},{"t":"h3","text":"7.5 זרימה: שאילתת AI (v1.5)"},{"t":"ol","items":["המשתמש מקליד שאלה בשפה טבעית.","המערכת מציגה שורת הד פרשנות: כך הבנתי את השאלה.","המערכת מתרגמת לשאילתה מובנית: Intent, Filters, Aggregation, Grouping, Visualization.","מוצגת תשובה מספרית, פירוט, גרף ומספר העסקאות שנכללו.","Drill-down לעסקאות המקור.","שאלות המשך תוך שמירת ההקשר."]},{"t":"h3","text":"7.6 עקרון Drill-down"},{"t":"p","text":"אין ליצור שני מסכי רשימה שונים. לחיצה על פלח או עמודה פותחת את מסך רשימת ההוצאות הקיים, באותו מבנה ובאותן אפשרויות, עם Context ומסננים מתאימים."},{"t":"ul","items":["הכותרת מבהירה את מקור הסינון, לדוגמה: \"מוניות — ינואר עד יוני 2026\".","הסכום הכולל ומספר העסקאות המסוננות מוצגים בראש המסך.","כל הפעולות הזמינות ברשימה הרגילה זמינות גם כאן.","חזרה לגרף משמרת את מצב הגרף והמסננים שהיו פעילים."]},{"t":"h3","text":"7.7 חוויית ההפעלה הראשונה"},{"t":"p","text":"בהפעלה הראשונה המאגר ריק לחלוטין. זהו המסלול המחייב, ואין להציג דשבורד ריק עם אפסים."},{"t":"ol","items":["לאחר ההתחברות הראשונה המשתמש מועבר אוטומטית למסך הייבוא, ולא לדשבורד.","מוצג Empty state יחיד עם משפט הסבר קצר ופעולה ראשית אחת: \"העלה קובץ Excel ראשון\".","עץ הסיווג ההתחלתי מסעיף 6.2 כבר טעון במאגר בשלב זה, כך שהסיווג האוטומטי עובד כבר על הקובץ הראשון.","לפני קליטת הקובץ הראשון המערכת מבקשת לתת שם לחשבון או לכרטיס שאליו הקובץ שייך, ויוצרת אותו.","לאחר הקליטה הראשונה המשתמש מועבר לרשימת ההוצאות, מסוננת לייבוא האחרון, עם ציון כמה עסקאות סווגו אוטומטית וכמה ממתינות.","הדשבורד וה-Sidebar זמינים מרגע זה. עד לייבוא הראשון, מסכי הדשבורד והניתוח מציגים Empty state עם קישור למסך הייבוא."]}]},{"id":"data","num":"8","title":"מודל הנתונים","blocks":[{"t":"table","head":["טבלה","תפקיד"],"rows":[["users","משתמשים והרשאות"],["accounts","חשבונות בנק וכרטיסי אשראי, כולל שיוך כרטיס לחשבון המחויב"],["transactions","העסקאות. כולל נתוני מקור, סוג תנועה, תאריך עסקה, תאריך חיוב, מטבע ושיוך לייבוא"],["transaction_classifications","שכבת הסיווג: קטגוריה, תת-קטגוריה, נושא, נהנה, מקור הסיווג ותאריך שינוי"],["categories","קטגוריות"],["subcategories","תת-קטגוריות"],["topics","נושאים אנליטיים. שיוך קטגוריות לנושאים הוא רב-ערכי (טבלת קישור category_topics) עם סימון נושא ראשי אחד לכל קטגוריה"],["beneficiaries","נהנים"],["classification_rules","חוקי סיווג, כולל סדר קדימות"],["imports","היסטוריית טעינות, לצורך מעקב וביטול"],["import_profiles","פרופילי מיפוי עמודות לכל מקור"],["ai_conversations / ai_messages","שיחות AI (v1.5)"]]},{"t":"h3","text":"8.1 עקרונות נתונים"},{"t":"ul","items":["נתוני המקור נשמרים כפי שנקלטו ואינם נדרסים לעולם.","סיווגים ותיקונים נשמרים בטבלה נפרדת, כך שניתן לשחזר את ההיסטוריה של כל שינוי.","קטגוריה יכולה להשתייך למספר נושאים, ולכל קטגוריה מסומן נושא ראשי אחד. סיכומים מחושבים לפי הנושא הראשי (ראו החלטה 5 בסעיף 11).","העברות פנימיות וחיובי אשראי מסומנות ומוחרגות, כדי למנוע ספירה כפולה.","כל מספר בדשבורד, בגרף או בתשובת AI חייב להיות ניתן לשחזור מהעסקאות.","בעתיד מודל ההרשאות יאפשר חשיפה לפי נושא, קטגוריה או פלח נתונים."]}]},{"id":"ux","num":"9","title":"הנחיות עיצוב וחוויית משתמש","blocks":[{"t":"ul","items":["ממשק בעברית ו-RTL מלא.","דשבורד נקי ולא עמוס. פעולה ראשית ברורה בכל מסך.","Feedback מיידי לכל פעולה, במיוחד לפעולות קבוצתיות.","Loading skeletons במקום מסך ריק. Empty states עם הסבר ופעולה מוצעת.","שמירת מצב המסך במעבר לפירוט וחזרה: מסננים, מיון, גלילה ובחירה.","Responsive — התאמה לדסקטופ ולמובייל.","הדגשת שקיפות: מקור כל סכום נגיש בלחיצה אחת.","עיצוב בגרסה 1: מצב בהיר וכהה, ובחירת צבע הדגשה אחד. יתר אפשרויות ההתאמה — בנספח א'."]}]},{"id":"nfr","num":"10","title":"דרישות לא-פונקציונליות","blocks":[{"t":"table","head":["נושא","דרישה"],"rows":[["היקף נתונים","עד 100,000 עסקאות ועד 15 שנות היסטוריה, ללא פגיעה בביצועים."],["ביצועים","טעינת דשבורד ורשימת עסקאות מסוננת בפחות מ-2 שניות, נמדד על מאגר של 50,000 עסקאות מרגע לחיצת המשתמש ועד להצגת הנתונים. ייבוא של 5,000 שורות בפחות מ-30 שניות."],["זמינות ה-AI","תשובת AI תוך 10 שניות. במקרה של כשל, המערכת מציעה חלופה ידנית ואינה מציגה שגיאה גולמית."],["אבטחה","גישה מאומתת בלבד. נתונים פיננסיים אינם נחשפים ללא הרשאה. תעבורה מוצפנת."],["פרטיות","נתוני עסקאות אינם נשלחים למודל חיצוני. נשלחת שאלת המשתמש והסכמה בלבד."],["גיבוי","גיבוי יומי אוטומטי, ואפשרות ייצוא מלא של כל הנתונים לקובץ בכל עת."],["מחיקת נתונים","מחיקת עסקה היא מחיקה רכה עם אפשרות שחזור. מחיקת חשבון מוחקת את כל הנתונים באופן סופי לאחר אישור כפול."],["נגישות","ניגודיות תקינה, ניווט מקלדת, וגדלי טקסט קריאים."]]},{"t":"h3","text":"10.1 הזדהות בגרסה 1 — החלטה"},{"t":"ul","items":["גרסה 1 כוללת מסך התחברות אחד עם דואר אלקטרוני וסיסמה, ומשתמש יחיד. אין הרשמה פתוחה ואין מסך ניהול משתמשים.","כל מסכי המערכת חסומים למשתמש שאינו מחובר, ומפנים למסך ההתחברות.","כל רשומה במאגר נושאת שיוך למשתמש מהיום הראשון, גם כשיש משתמש אחד בלבד, כדי שהמעבר לריבוי משתמשים לא ידרוש כתיבה מחדש של מודל הנתונים.","שחזור סיסמה בדואר אלקטרוני נחשב חלק מגרסה 1. ניהול הרשאות לפי נושא או קטגוריה — Backlog."]}]},{"id":"decisions","num":"11","title":"החלטות בסוגיות שהיו פתוחות","blocks":[{"t":"lead","text":"גרסה 0.3 הותירה תשע שאלות פתוחות. מסמך אפיון שמשאיר שאלות יסוד פתוחות אינו ניתן לפיתוח. להלן ההכרעות, עם נימוק קצר לכל אחת."},{"t":"table","head":["#","השאלה","ההחלטה","נימוק"],"rows":[["1","Budget vs Actual — האם לנהל תקציב מתוכנן?","לא בגרסה 1","המוצר עונה על \"לאן הלך הכסף\", לא \"לאן תכננתי\". תקציב הוא מוצר נפרד."],["2","מקורות ופורמטי קבצים","Excel בלבד בגרסה 1","החלטת המשתמש: כל קבצי המקור מיוצאים כ-Excel, ולכן CSV ו-PDF אינם בהיקף גרסה 1."],["3","העברות בין חשבונות וחיוב אשראי מרוכז","סוג תנועה שלישי — Transfer","ראו סעיף 5.2. זהו הפתרון היחיד שמונע ספירה כפולה באופן שיטתי."],["4","הוצאות חד-פעמיות","סימון ידני בגרסה 1, הצעת AI בגרסה 1.5","ההגדרה של \"חד-פעמי\" סובייקטיבית ותלוית הקשר."],["5","האם קטגוריה יכולה להשתייך למספר נושאים?","כן — ריבוי נושאים עם נושא ראשי אחד","קטגוריה יכולה להשתייך למספר נושאים לצורכי חתכים אנליטיים, אך לכל קטגוריה מוגדר נושא ראשי יחיד. סיכומים ופילוחים מחושבים לפי הנושא הראשי בלבד, כדי שסכום הנושאים יישאר שווה לסך ההוצאות."],["6","הלוואות — הוצאה או מודול מלא?","נושא וקטגוריות בלבד בגרסה 1","מודול הלוואות מלא (קרן, ריבית, לוח סילוקין) הוא מוצר בפני עצמו."],["7","משיכות מחיסכון והשקעות","Transfer, לא הכנסה","אין כאן כסף חדש. סיווג כהכנסה היה מנפח את התמונה."],["8","Forecast","לא בגרסה 1","תחזית ללא בסיס היסטורי נקי היא ניחוש. תיבחן לאחר שנה של נתונים מסווגים."],["9","מדיניות פרטיות ל-AI חיצוני","לא נשלחים נתוני עסקאות","ראו סעיף 10. נשלחים שאלה, סכמה ורשימת קטגוריות בלבד."],["10","זיכוי או החזר — הכנסה או הוצאה שלילית?","הוצאה בסימן חיובי","סוג התנועה נשאר Expense והסכום חיובי, כך שהזיכוי מקטין את סך הקטגוריה. סיווג כהכנסה היה מנפח גם את ההכנסות וגם את ההוצאות. ראו טבלת 5.3."],["11","מה מחזיר סינון לפי נושא משני?","חתך אנליטי מסומן, לא חלק מהסיכום","סיכומים ופילוחים מחושבים תמיד לפי הנושא הראשי. סינון לפי נושא משני מסומן בממשק כחתך אנליטי, שסכומו אינו אמור להשתלב בסך הכולל."],["12","האם יש מסך התחברות בגרסה 1?","כן — משתמש יחיד עם התחברות","ראו סעיף 10.1. שמירה על דרישת האבטחה מהיום הראשון, ומעבר עתידי לריבוי משתמשים ללא כתיבה מחדש של מודל הנתונים."]]},{"t":"h3","text":"11.1 מה עדיין פתוח"},{"t":"ul","items":["האם לזהות אוטומטית נהנים לפי תיאור ההעברה, או לדרוש שיוך ידני בלבד. יוכרע לאחר בחינת קבצי מקור אמיתיים.","האם להציג הוצאות במטבע זר גם במטבע המקור בדשבורד, או בשקלים בלבד.","שמות העמודות המדויקים בקבצי היצוא של הבנק וחברות האשראי שבשימוש בפועל. עד לקבלתם, פרופילי המיפוי בסעיף 4 מוגדרים גנרית והמשתמש ממפה ידנית בפעם הראשונה."]}]},{"id":"phases","num":"12","title":"שלבי פיתוח מומלצים","blocks":[{"t":"lead","text":"סדר הבנייה מנוסח במזהי המודולים הקבועים M1–M9 מסעיף 3. פירוט מלא, כולל הגדרת גמור לכל שלב, בנספח ג'."},{"t":"h3","text":"12.1 גרסה 1"},{"t":"ol","items":["תשתית והזדהות לפי סעיף 10.1.","מודל נתונים לפי סעיף 8: חשבונות, עסקאות, קטגוריות, נושאים, נהנים.","טעינת עץ הזרעה מסעיף 6.2, כולל סימון נושא ראשי לכל קטגוריה.","M1 — ייבוא: העלאה, מיפוי, נרמול, Preview, זיהוי כפילויות, קליטה וביטול.","M2 — מסך עסקאות ורשימת הוצאות: חיפוש, סינון, עריכת שורה ופעולות קבוצתיות.","M3 — מנוע סיווג: חוקים לפי סעיף 6.4 ולמידה מתיקונים.","מסך קטגוריות ונושאים, כולל ניהול ריבוי נושאים ונושא ראשי.","M4 — חולל תרשימים: בחירת חתך, Preview, Bar ו-Pie.","M4 — Drill-down מהגרף לרשימת ההוצאות הקיימת.","M5 — דשבורד.","ליטוש UX: מצב בהיר וכהה, Empty states, Loading skeletons ונגישות."]},{"t":"h3","text":"12.2 גרסה 1.5"},{"t":"ol","items":["M6 — מודול נהנים מלא.","M7 — ניתוח היסטורי: מגמות, השוואות, חודש רגיל וחריגות.","M3 — AI fallback לסיווג עם Confidence score.","M8 — AI Financial Analyst עם מעקות הבטיחות מסעיף 3.","M9 — תובנות ואופטימיזציית תזרים."]}]},{"id":"appendix-a","num":"נספח א'","title":"התאמה אישית של ערכת העיצוב (Backlog)","blocks":[{"t":"lead","text":"הדרישות הבאות הופיעו בגרסה 0.3 כמודול מלא. הן נשמרות כאן במלואן, אך אינן חלק מגרסה 1, מפני שהערך שלהן נמוך ביחס לעלות הפיתוח בהשוואה לליבה הפיננסית."},{"t":"ul","items":["בחירת צבע המסגרת ואזורי הניווט ובחירת צבע רקע המסך.","בחירת שילוב צבעים כולל Hue ו-Brightness.","בחירת צבעי עמודות ב-Bar Charts וצבעי פלחים ב-Pie Charts.","בחירת צבעי שורות ברשימת ההוצאות, כולל Alternating Row Colors.","שליטה אינטראקטיבית בגובה השורה ובחירת צבע Highlight.","Preview מיידי של הגדרות העיצוב לפני שמירה ואפשרות שחזור לברירת מחדל.","עדכון בזמן אמת: שינוי במסך ההגדרות משתקף מיד במסך שמאחוריו, ללא רענון ומבלי לאבד מסננים, בחירת שורה או מצב גרף."]}]},{"id":"appendix-b","num":"נספח ב'","title":"יומן שינויים","blocks":[{"t":"h3","text":"מגרסה 0.4 לגרסה 0.5 — ליטוש לקראת פיתוח"},{"t":"lead","text":"מטרת גרסה 0.5 אחת: להפוך כל משפט שניתן לפרש בשתי דרכים לטבלה, לערך מדויק או לכלל ניתן לבדיקה — כדי שהפיתוח לא יצטרך לנחש."},{"t":"table","head":["השינוי","הסיבה"],"rows":[["נוסף סעיף 0.4 — מוסכמות תצוגה, תאריך, מטבע ועיגול","לא הוגדר כיצד מוצג סכום, מהו 'חודש' ומהו אזור הזמן. כל מפתח היה מחליט אחרת."],["המונחון הורחב (נושא ראשי, סוג תנועה, פרופיל מיפוי, מפתח כפילות)","המסמך הסתמך על מונחים שלא הוגדרו."],["המודולים קיבלו מזהים קבועים M1–M9, וסעיפים 2 ו-12 מפנים אליהם","היו שלוש מערכות מספור שונות לאותה עבודה (6 רכיבים, 9 מודולים, 11 שלבים)."],["נוספו קריטריוני קבלה למודולים M7 ו-M9","היו המודולים היחידים ללא קריטריונים."],["נוסף סעיף 4.6 — סכמת העסקה האחידה","שדות הייבוא הוזכרו בפרוזה, ללא טיפוס, חובה/רשות והתנהגות בערך ריק."],["נוסף סעיף 4.7 — קטלוג שגיאות ייבוא","'שורה שנכשלה תוצג עם סיבה' ללא רשימת סיבות אינה דרישה ניתנת למימוש."],["נוסף סעיף 4.8 — מגבלות ייבוא, ריבוי קבצים וייבוא חוזר חלקי","לא הוגדרו גודל קובץ, מספר שורות מרבי או התנהגות בטעינה חוזרת חלקית."],["נוסף סעיף 5.3 — טבלת הכרעה לסוג תנועה וסימן","סתירה בין 5.1 (הוצאה שלילית) ל-4.5 (זיכוי חיובי) — כעת מוכרעת במפורש."],["סעיף 6.2 הפך לטבלת זרעה מלאה עם סימון נושא ראשי","המערכת צריכה שורות ממשיות לטעינה, לא 'מבחר מייצג'."],["נוסף סעיף 6.4 — מפרט מנוע הסיווג","'סדר קדימויות ברור' נאמר אך לא הוגדר. כעת: מספר עדיפות, שובר שוויון ותקדים ידני."],["סעיף 7.1 הורחב למפרט מסך מלא לכל מסך v1","תשעה נתיבים עם שורת תיאור אינם מספיקים לבניית מסך."],["נוסף סעיף 7.7 — חוויית ההפעלה הראשונה","לא הוגדר מה רואה המשתמש כשהמאגר ריק."],["נוסף סעיף 10.1 — הכרעת הזדהות בגרסה 1","'גישה מאומתת בלבד' מול 'משתמש יחיד' — לא היה ברור אם יש מסך התחברות."],["נוספו החלטות 10–12 בסעיף 11","סימן זיכויים, סמנטיקת סינון לפי נושא משני, והזדהות בגרסה 1."],["נוסף נספח ג' — סדר בנייה עם הגדרת גמור לכל שלב","רשימה שטוחה של 11 שלבים ללא קו סיום לכל שלב."]]},{"t":"h3","text":"מגרסה 0.3 לגרסה 0.4"},{"t":"table","head":["השינוי","הסיבה"],"rows":[["נוסף סעיף 0 — מטרות, מדדי הצלחה ומונחון","לא הייתה דרך לדעת מתי פיצ'ר גמור או מתי המוצר הצליח."],["נוספו קריטריוני קבלה לכל מודול","הפיכת תיאורים כלליים לדרישות ניתנות לבדיקה."],["נוסף סעיף 2 — חלוקה ל-v1 / v1.5 / Backlog","ההיקף בגרסה 0.3 היה רחב מכדי לבנות אותו כמקשה אחת."],["מפרט הייבוא הורחב מ-6 שורות לסעיף מלא (4)","זהו הרכיב המסוכן ביותר, ובגרסה 0.3 הוא היה הפחות מפורט."],["הוגדר מפתח זיהוי כפילויות מפורש","\"מניעת ספירה כפולה\" ללא הגדרת מפתח אינה דרישה ניתנת למימוש."],["נוסף סעיף 5 — סמנטיקה פיננסית וסוג תנועה שלישי","מוסכמת סימן, מטבע, תשלומים, זיכויים והעברות לא הוגדרו כלל."],["נוסף סעיף 6 — עץ סיווג התחלתי עם דוגמאות","שלוש רמות הסיווג הוגדרו ללא אף דוגמה קונקרטית."],["הנהנים הפכו למודול עצמאי","דוגמת ה-AI המרכזית תלויה בהם, אך לא היה להם אפיון."],["נוספו מעקות בטיחות ל-AI","לא הוגדר מה קורה כשהמודל טועה או כשאין תשובה."],["הניווט אוחד ל-Sidebar ראשי ושורת פעולות מהירות","בגרסה 0.3 היו שני מנגנוני ניווט חופפים."],["מודול העיצוב הועבר לנספח א'","היה מפורט יותר ממנוע הסיווג, ביחס הפוך לחשיבותו."],["נוסף סעיף 10 — דרישות לא-פונקציונליות","לא הוגדרו היקף נתונים, ביצועים, גיבוי, אבטחה ופרטיות."],["7 מתוך 9 השאלות הפתוחות הוכרעו","מסמך אפיון נועד להכריע, לא לרשום התלבטויות."]]}]},{"id":"appendix-c","num":"נספח ג'","title":"סדר בנייה והגדרת גמור לכל שלב","blocks":[{"t":"lead","text":"לכל שלב מוגדר קו סיום יחיד וניתן לבדיקה. אין לעבור לשלב הבא לפני שה\"הגדרת גמור\" מתקיימת במלואה. השלבים בנויים כך שכל אחד מהם מייצר משהו שאפשר להפעיל ולראות."},{"t":"table","head":["שלב","מה נבנה","הגדרת גמור"],"rows":[["ש1","תשתית, הזדהות ומסך ריק עם Sidebar","משתמש מתחבר, רואה את שבעת מסכי v1 בסרגל הצד, וכל מסך מציג Empty state תקין ב-RTL."],["ש2","מודל נתונים מלא לפי סעיף 8 + טעינת עץ הזרעה מסעיף 6.2","מסך קטגוריות מציג את כל נושאי וקטגוריות הזרעה, כולל סימון הנושא הראשי."],["ש3","M1 שלב א' — העלאת Excel, זיהוי מקור, מיפוי עמודות ושמירת פרופיל","קובץ אמיתי עולה, המיפוי נשמר כפרופיל, וייבוא שני של אותו מקור מזוהה אוטומטית."],["ש4","M1 שלב ב' — נרמול, כפילויות, Preview, קליטה וביטול","כל ארבעת קריטריוני הקבלה של M1 עוברים על קובץ אמיתי, כולל ייבוא חוזר עם 0 תוספות."],["ש5","M2 — מסך עסקאות ורשימת הוצאות עם עריכת שורה ופעולות קבוצתיות","שינוי סיווג ל-500 עסקאות בפעולה אחת מתחת ל-3 שניות, וערך המקור עדיין נצפה."],["ש6","M3 — מנוע חוקים לפי סעיף 6.4 ולמידה מתיקונים","יצירת חוק מציגה כמה עסקאות יושפעו, מחילה רטרואקטיבית, ואינה דורסת סיווג ידני."],["ש7","M4 — חולל תרשימים: בחירת חתך, Preview, Bar ו-Pie","סכום הפלחים כולל Other שווה לסכום בכותרת."],["ש8","M4 — Drill-down לרשימת ההוצאות הקיימת","לחיצה על פלח פותחת את אותו מסך רשימה עם כותרת הקשר, וחזרה משמרת גרף, מסננים וגלילה."],["ש9","M5 — דשבורד","כל מספר בדשבורד לחיץ ומוביל לעסקאות המרכיבות אותו; החלפת תקופה מעדכנת את כל המסך."],["ש10","ליטוש: מצב בהיר/כהה, Empty states, Loading skeletons, נגישות","כל מסך v1 עומד בסעיף 9 ובדרישות הביצועים בסעיף 10."]]}]}]};

    <p style="margin-top:8px;color:#666">לבנייה: <code dir="ltr">node standalone/build.mjs</code> (נתונים אמיתיים) או <code dir="ltr">node standalone/build-demo.mjs</code> (דמו).</p></div>`;
