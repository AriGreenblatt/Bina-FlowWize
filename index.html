}
let modalDrill = null;
function closeModal() { $("#modal").classList.add("hidden"); $("#modal").innerHTML = ""; modalDrill = null; }
addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#modal").classList.contains("hidden")) closeModal(); });

/* ============================================================
   Monthly cash flow by topic
   ============================================================ */
const tm = { months: 12, bar: null, stacked: false };

function topicMonthlyPage(r) {
  document.title = "Flow-Wise — תזרים חודשי לפי נושא";
  const data = flow();
  const catName = new Map(data.categories.map((c) => [c.id, c.name]));
  const topicName = new Map(data.topics.map((t) => [t.id, t.name]));
  const topicOf = (t) => (t.topic_id && topicName.get(t.topic_id)) || t.source_topic || NO_TOPIC;

  // Regular income and spending only: card payments, financing and one-off items are left out.
  const all = data.transactions.filter((t) => t.kind === "income" || t.kind === "expense");
  const allMonths = [...new Set(all.map((t) => t.txn_date.slice(0, 7)))].sort();
  const months = tm.months ? allMonths.slice(-tm.months) : allMonths;
  const keep = new Set(months);
  const scoped = all.filter((t) => keep.has(t.txn_date.slice(0, 7)));

  // Topics for the dropdown, largest spending first.
  const totals = new Map();
  for (const t of scoped) {
    const k = topicOf(t);
    const e = totals.get(k) ?? { expense: 0, income: 0 };
    e[t.kind] += t.amount;
    totals.set(k, e);
  }
  const options = [...totals].sort((a, b) => (b[1].expense - a[1].expense) || (b[1].income - a[1].income));
  const topic = r.q.topic && totals.has(r.q.topic) ? r.q.topic : options[0]?.[0] ?? null;
  if (tm.bar && tm.bar.topic !== topic && !tm.stacked) tm.bar = null;

  const mine = scoped.filter((t) => topicOf(t) === topic);
  const series = months.map((m) => {
    const inMonth = mine.filter((t) => t.txn_date.slice(0, 7) === m);
    const sum = (k) => Math.round(inMonth.filter((t) => t.kind === k).reduce((s, t) => s + t.amount, 0));
    return { month: m, expense: sum("expense"), income: sum("income") };
  });
  const hasExpense = series.some((d) => d.expense), hasIncome = series.some((d) => d.income);
  const bars = [
    ...(hasExpense || !hasIncome ? [{ key: "expense", name: "הוצאות", color: "hsl(350 70% 55%)" }] : []),
    ...(hasIncome ? [{ key: "income", name: "הכנסות / זיכויים", color: "hsl(152 60% 42%)" }] : []),
  ];
  const main = bars[0].key;
  const total = series.reduce((s, d) => s + d[main], 0);
  const avg = months.length ? total / months.length : 0;
  const peak = series.reduce((b, d) => (d[main] > (b?.[main] ?? -Infinity) ? d : b), null);
  const kpi = (label, value, tone = "") => `<div class="card"><div class="kpi-label">${label}</div><div class="kpi-value ${tone}">${esc(value)}</div></div>`;

  // Stacked view: every month's spending split by topic. The ten largest topics get their own
  // colour; the rest are grouped as "אחר".
  const TOP = 10;
  const ranked = options.filter(([, v]) => v.expense > 0).map(([name]) => name);
  const shown = ranked.slice(0, TOP);
  const stackOf = (t) => (shown.includes(topicOf(t)) ? topicOf(t) : OTHER_SLICE);
  const stacks = [...shown, ...(ranked.length > TOP ? [OTHER_SLICE] : [])].map((name) => ({ key: name, name, color: colorFor(name) }));
  const stackRows = months.map((m) => {
    const row = { month: m };
    for (const t of scoped) if (t.kind === "expense" && t.txn_date.slice(0, 7) === m) row[stackOf(t)] = (row[stackOf(t)] || 0) + t.amount;
    return row;
  });
  const allSpend = scoped.filter((t) => t.kind === "expense").reduce((s, t) => s + t.amount, 0);

  $("#app").innerHTML = `${appNav("תזרים חודשי לפי נושא", "הוצאות והכנסות של נושא אחד, חודש אחר חודש")}
  <main class="wrap w6 stack-lg">
    <div class="row3 between" style="flex-wrap:wrap;gap:12px">
      <label class="row small" style="gap:8px">
        <span class="muted">נושא:</span>
        <select class="input" data-act="tm-topic" style="min-width:240px">
          ${options.map(([name, v]) => `<option value="${esc(name)}"${name === topic ? " selected" : ""}>${esc(name)} — ${esc(ils(v.expense || v.income))}</option>`).join("")}
        </select>
      </label>
      <div class="row small">
        <button type="button" class="pill ${tm.stacked ? "on" : ""}" data-act="tm-stack" title="כל הנושאים בעמודה אחת לכל חודש">${tm.stacked ? "✓ " : ""}מוערם</button>
        <span class="muted" style="margin-inline-start:8px">טווח:</span>
        ${[3, 6, 12, 0].map((m) => `<button type="button" class="pill ${tm.months === m ? "on" : ""}" data-act="tm-months" data-v="${m}">${m === 0 ? "הכל" : `${m} חודשים`}</button>`).join("")}
      </div>
    </div>
    ${!topic ? `<div class="card dashed" style="padding:40px;text-align:center"><p class="muted">אין נתונים בטווח שנבחר.</p></div>` : tm.stacked ? `
    <section class="grid3" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
      ${kpi("סך הוצאות — כל הנושאים", ils(allSpend), "down")}
      ${kpi("ממוצע לחודש", ils(months.length ? allSpend / months.length : 0))}
      ${kpi("הנושא הגדול", shown[0] ? `${shown[0]} · ${ils(totals.get(shown[0]).expense)}` : "—")}
    </section>
    <section class="card">
      <h2 style="margin-bottom:16px">הוצאות לפי נושא — מוערם</h2>
      <div class="chart" id="tm-bar" style="height:340px"></div>
      <div class="row small" style="flex-wrap:wrap;justify-content:center;gap:6px 16px;margin-top:10px">
        ${stacks.map((st) => `<span class="row" style="gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:${st.color}"></span>${esc(st.name)}</span>`).join("")}
      </div>
      <p class="xs muted" style="text-align:center;margin-top:4px">לחיצה על צבע בעמודה — התנועות של אותו נושא באותו חודש</p>
      <div id="tm-detail"></div>
    </section>` : `
    <section class="grid3" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
      ${kpi(main === "expense" ? "סך הוצאות" : "סך הכנסות", ils(total), main === "expense" ? "down" : "up")}
      ${kpi("ממוצע לחודש", ils(avg))}
      ${kpi("החודש הגבוה", peak && peak[main] ? `${monthLabel(peak.month)} · ${ils(peak[main])}` : "—")}
      ${kpi("חודשים עם תנועות", `${series.filter((d) => d[main]).length} מתוך ${months.length}`)}
    </section>
    <section class="card">
      <h2 style="margin-bottom:16px">${esc(topic)} — לפי חודש</h2>
      <div class="chart h80" id="tm-bar"></div>
      <p class="xs muted" style="text-align:center;margin-top:4px">לחיצה על עמודה — התנועות של אותו חודש מתחת לגרף</p>
      <div id="tm-detail"></div>
    </section>`}
  </main>`;

  H = {
    // Picking a topic switches back to that topic's own chart.
    "tm-topic": { change: (e, el) => { tm.bar = null; tm.stacked = false; if (el.value === topic) topicMonthlyPage(r); else go("/topic-monthly", { topic: el.value }); } },
    "tm-months": { click: (e, el) => { tm.months = +el.dataset.v; tm.bar = null; topicMonthlyPage(r); } },
    "tm-close": { click: () => { tm.bar = null; redraw(); } },
    "tm-stack": { click: () => { tm.stacked = !tm.stacked; tm.bar = null; topicMonthlyPage(r); } },
  };
  if (!topic) return;

  const renderDetail = () => {
    const box = $("#tm-detail");
    if (!tm.bar) { box.innerHTML = ""; return; }
    const { month, key } = tm.bar;
    const rows = (tm.bar.stacked
      ? scoped.filter((t) => t.kind === "expense" && t.txn_date.slice(0, 7) === month && stackOf(t) === key)
      : mine.filter((t) => t.txn_date.slice(0, 7) === month && t.kind === key)).sort((a, b) => b.amount - a.amount);
    const sum = rows.reduce((s, t) => s + t.amount, 0);
    const bar = tm.bar.stacked ? { name: key === OTHER_SLICE ? "נושאים אחרים" : "הוצאות", color: colorFor(key) } : bars.find((b) => b.key === key);
    const title = tm.bar.stacked ? (key === OTHER_SLICE ? "נושאים אחרים" : key) : topic;
    const pageQ = tm.bar.stacked ? (key === OTHER_SLICE ? { kind: "expense", month } : { topic: key, kind: "expense", month }) : { topic, kind: key, month };
    box.innerHTML = `<div style="margin-top:20px;border-top:1px solid var(--border);padding-top:16px">
      <div class="row3 between">
        <div class="row3"><span style="width:14px;height:14px;border-radius:4px;background:${bar.color}"></span>
          <h3 style="font-size:1rem;font-weight:700">${esc(title)} · ${esc(bar.name)} — ${monthLabel(month)}</h3></div>
        <div class="row">
          <a class="btn outline sm" href="${href("/transactions", pageQ)}">לעמוד העסקאות</a>
          <button type="button" class="btn ghost sm" data-act="tm-close" aria-label="סגירה">✕</button>
        </div>
      </div>
      <div class="small muted" style="margin:10px 0 6px">${rows.length} תנועות · סה"כ <strong class="num" style="color:var(--foreground)">${esc(ils(sum))}</strong></div>
      ${rows.some((t) => t.missing_detail) ? `<div class="nodata-note"><strong>${NODATA}</strong> — ל-${rows.filter((t) => t.missing_detail).length} מהשורות אין פירוט מחברת האשראי; מוצג הסכום שחויב בבנק.</div>` : ""}
      <div class="tbl-wrap"><table class="tbl hover">
        <thead><tr><th>תאריך</th><th>תיאור</th><th>סכום</th><th>קטגוריה</th>${key === OTHER_SLICE ? "<th>נושא</th>" : ""}<th>חשבון</th></tr></thead>
        <tbody>${rows.map((t) => `<tr>
          <td class="num nowrap">${heDate(t.txn_date)}</td>
          <td>${descHtml(t)}</td>
          <td class="num nowrap">${esc(ils(t.amount))}</td>
          <td>${esc((t.category_id && catName.get(t.category_id)) || t.source_category || "—")}</td>${key === OTHER_SLICE ? `<td>${esc(topicOf(t))}</td>` : ""}
          <td class="num nowrap" style="text-align:center">${esc(t.account_label ?? "—")}</td>
        </tr>`).join("") || `<tr><td colspan="5" class="muted" style="padding:16px;text-align:center">אין תנועות בחודש זה.</td></tr>`}</tbody>
      </table></div>
    </div>`;
  };

  redraw = () => {
    if (tm.stacked) {
      drawStacked($("#tm-bar"), stackRows, stacks, {
        xKey: "month", format: ils,
        selected: tm.bar ? { i: stackRows.findIndex((d) => d.month === tm.bar.month), key: tm.bar.key } : null,
        onClick: (d, key) => {
          tm.bar = tm.bar && tm.bar.month === d.month && tm.bar.key === key ? null : { stacked: true, topic, month: d.month, key };
          redraw();
          if (tm.bar) $("#tm-detail")?.scrollIntoView({ behavior: "smooth", block: "nearest" });
        },
      });
      renderDetail();
      return;
    }
    drawBar($("#tm-bar"), series, {
      xKey: "month", axes: true, legend: bars.length > 1, tooltip: true, format: ils, bars,
      selected: tm.bar ? { i: series.findIndex((d) => d.month === tm.bar.month), key: tm.bar.key } : null,
      onClick: (d, key) => {
        tm.bar = tm.bar && tm.bar.month === d.month && tm.bar.key === key ? null : { topic, month: d.month, key };
        redraw();
        if (tm.bar) $("#tm-detail")?.scrollIntoView({ behavior: "smooth", block: "nearest" });
      },
    });
    renderDetail();
  };
  redraw();
}

/* ============================================================
   Transactions
   ============================================================ */
let txState = null;

/** Place the floating column filter under its header button (in page coordinates, fixed). */
function positionCfPop() {
  const pop = $("#cf-pop");
  const btn = txState?.openCol && $(`[data-act="cf-toggle"][data-k="${txState.openCol}"]`);
  if (!pop || !btn) return;
  const r = btn.getBoundingClientRect();
  const w = pop.offsetWidth;
  let right = innerWidth - r.right;                       // align right edges (RTL)
  right = Math.min(Math.max(8, right), innerWidth - w - 8);
  const below = innerHeight - r.bottom - 12;
  const list = $("#cf-list");
  if (list) list.style.maxHeight = Math.max(120, Math.min(360, below - 130)) + "px";
  pop.style.right = right + "px";
  pop.style.top = r.bottom + 4 + "px";
}
addEventListener("scroll", positionCfPop, true);
addEventListener("resize", positionCfPop);
addEventListener("keydown", (e) => {
  if (e.key === "Escape" && txState?.openCol && $("#cf-pop")) { txState.openCol = null; rerender && rerender(); }
});

function freshTxState(q) {
  return {
    key: JSON.stringify(q),
    filter: q.q ?? "", sortKey: "date", sortDir: "desc", limit: 200,
    openCol: null, colQ: "",
    colFilters: { ...(q.category ? { category: [q.category] } : {}), ...(q.topic ? { topic: [q.topic] } : {}) },
    selected: new Set(), bulkCat: "", bulkTopic: "",
  };
}

const KIND_LABEL = (k) => (k === "income" ? "הכנסה" : k === "transfer" ? "העברה" : k === "cc_payment" ? "תשלום כרטיס אשראי" : k === "separate" ? "מחוץ לתזרים" : k === "financing" ? "מימון" : "הוצאה");
const COLS = [["date", "תאריך"], ["description", "תיאור"], ["kind", "סוג"], ["amount", "סכום"], ["category", "קטגוריה"], ["topic", "נושא"], ["account", "חשבון"], ["source", "מקור"]];

function transactionsPage(r) {
  document.title = "Flow-Wise — עסקאות ורשימת הוצאות";
  const q = {
    ...(r.q.category ? { category: r.q.category } : {}),
    ...(r.q.topic ? { topic: r.q.topic } : {}),
    ...(["income", "expense", "transfer", "cc_payment", "separate", "financing"].includes(r.q.kind) ? { kind: r.q.kind } : {}),
    ...(["card", "bank"].includes(r.q.account) ? { account: r.q.account } : {}),
    ...(r.q.q ? { q: r.q.q } : {}),
    ...(/^\d{4}-\d{2}$/.test(r.q.month ?? "") ? { month: r.q.month } : {}),
  };
  if (!txState || txState.key !== JSON.stringify(q)) txState = freshTxState(q);
  const S = txState;

  const chips = [];
  if (q.kind) chips.push(KIND_LABEL(q.kind));
  if (q.account) chips.push(q.account === "card" ? "כרטיס אשראי" : "בנק");
  if (q.category) chips.push(q.category);
  if (q.topic) chips.push(q.topic);
  if (q.q) chips.push(`"${q.q}"`);
  if (q.month) chips.push(monthLabel(q.month));

  $("#app").innerHTML = `${appNav("עסקאות ורשימת הוצאות", "סינון, מיון ועריכת קטגוריה ונושא ראשי")}
  <main class="wrap w7 stack">
    ${chips.length ? `<div class="row small"><span class="muted">מסונן לפי:</span>${chips.map((c) => `<span class="chip">${esc(c)}</span>`).join("")}<a class="link" href="#/transactions">נקה סינון</a></div>` : ""}
    <section class="grid3" id="tx-totals"></section>
    <div id="tx-bulk"></div>
    <section class="card">
      <div class="row3 between" style="margin-bottom:16px">
        <div class="row3" id="tx-info"></div>
        <input class="input" data-act="tx-search" value="${esc(S.filter)}" placeholder="חיפוש לפי תיאור או קובץ">
      </div>
      <div class="tbl-wrap" id="tx-table"></div>
    </section>
  </main>`;

  const update = () => {
    const data = flow();
    const { transactions: txns, categories, topics } = data;
    const catName = new Map(categories.map((c) => [c.id, c.name]));
    const topicName = new Map(topics.map((t) => [t.id, t.name]));

    const cellValue = (t, k) => {
      switch (k) {
        case "date": return heDate(t.txn_date);
        case "kind": return KIND_LABEL(t.kind);
        case "amount": return ils(t.amount);
        case "account": return t.account_label ?? "—";
        case "source": return t.source_file ?? "—";
        case "category": return (t.category_id && catName.get(t.category_id)) || t.source_category || "—";
        case "topic": return (t.topic_id && topicName.get(t.topic_id)) || t.source_topic || "—";
        default: return t.description;
      }
    };
    const passes = (t, except) => Object.entries(S.colFilters).every(([k, vals]) => k === except || !vals?.length || vals.includes(cellValue(t, k)));
    const matchesSearch = (t) => {
      if (q.kind && t.kind !== q.kind) return false;
      if (q.month && t.txn_date.slice(0, 7) !== q.month) return false;
      if (q.account === "card") return !!t.account_label && t.account_label !== "בנק";
      if (q.account === "bank") return t.account_label === "בנק";
      return true;
    };
    const f = S.filter.trim();
    const searched = f ? txns.filter((t) => t.description.includes(f) || (t.source_file ?? "").includes(f)) : txns;
    const allRows = searched.filter((t) => passes(t) && matchesSearch(t)).sort((a, b) => {
      let c = 0;
      if (S.sortKey === "amount") c = a.amount - b.amount;
      else if (S.sortKey === "date") c = a.txn_date.localeCompare(b.txn_date);
      else if (S.sortKey === "account") {
        const al = a.account_label ?? "", bl = b.account_label ?? "";
        const an = /^\d{4}$/.test(al) ? Number(al) : NaN, bn = /^\d{4}$/.test(bl) ? Number(bl) : NaN;
        c = !isNaN(an) && !isNaN(bn) ? an - bn : al.localeCompare(bl, "he");
      } else c = cellValue(a, S.sortKey).localeCompare(cellValue(b, S.sortKey), "he");
      return S.sortDir === "asc" ? c : -c;
    });
    const rows = allRows.slice(0, S.limit);
    const inc = allRows.filter((t) => t.kind === "income").reduce((s, t) => s + t.amount, 0);
    const exp = allRows.filter((t) => t.kind === "expense").reduce((s, t) => s + t.amount, 0);

    const optionsFor = (k) => {
      const set = new Set();
      for (const t of searched) if (passes(t, k)) set.add(cellValue(t, k));
      return [...set].sort((a, b) => {
        const na = Number(a.replace(/[^\d.-]/g, "")), nb = Number(b.replace(/[^\d.-]/g, ""));
        if (k === "amount" && !isNaN(na) && !isNaN(nb)) return na - nb;
        return a.localeCompare(b, "he");
      });
    };

    $("#tx-totals").innerHTML = `
      <div class="card p4"><div class="kpi-label">הכנסות (מסונן)</div><div class="kpi-sm up">${esc(ils(inc))}</div></div>
      <div class="card p4"><div class="kpi-label">הוצאות (מסונן)</div><div class="kpi-sm down">${esc(ils(exp))}</div></div>
      <div class="card p4"><div class="kpi-label">יתרה</div><div class="kpi-sm">${esc(ils(inc - exp))}</div></div>`;

    $("#tx-bulk").innerHTML = S.selected.size ? `<section class="card p4 row3 small" style="background:color-mix(in oklch,var(--muted) 40%,transparent);box-shadow:none">
        <span style="font-weight:500">${S.selected.size} נבחרו</span>
        ${picker({ ctx: "bulk-cat", value: S.bulkCat, options: categories, emptyLabel: "שיוך לקטגוריה…", newLabel: "+ קטגוריה חדשה…", placeholder: "שם הקטגוריה", cls: "sel-sm" })}
        ${picker({ ctx: "bulk-topic", value: S.bulkTopic, options: topics, emptyLabel: "שיוך לנושא…", newLabel: "+ נושא חדש…", placeholder: "שם הנושא", cls: "sel-sm" })}
        <button type="button" class="btn sm" data-act="bulk-apply" ${!S.bulkCat && !S.bulkTopic ? "disabled" : ""}>החל על הנבחרות</button>
        <button type="button" class="btn outline sm" data-act="bulk-cancel">ביטול בחירה</button>
      </section>` : "";

    const more = allRows.length <= rows.length;
    $("#tx-info").innerHTML = `
      <h2>תנועות (${txns.length})</h2>
      <span class="small muted">מוצגות ${rows.length} מתוך ${allRows.length}</span>
      <button type="button" class="btn outline sm" data-act="more" ${more ? "disabled" : ""}>הצג עוד 500</button>
      <button type="button" class="btn sm" data-act="all" ${more ? "disabled" : ""}>הצג הכל</button>
      ${Object.values(S.colFilters).some((v) => v?.length) ? `<button type="button" class="btn ghost sm" data-act="clear-cols">נקה סינונים</button>` : ""}`;

    const colFilterHtml = (k) => {
      const sel = S.colFilters[k] ?? [];
      return `<div class="cf">
        <button type="button" class="cf-btn ${sel.length ? "on" : ""} ${S.openCol === k ? "open" : ""}" data-act="cf-toggle" data-k="${k}"><span class="trunc">${sel.length ? `${sel.length} נבחרו` : "הכל"}</span><span>▾</span></button>
      </div>`;
    };
    const cfOptions = S.openCol ? optionsFor(S.openCol) : [];
    const cfShown = () => (S.colQ ? cfOptions.filter((o) => o.toLowerCase().includes(S.colQ.toLowerCase())) : cfOptions);
    const renderCfList = () => {
      const el = $("#cf-list");
      if (!el) return;
      const keepScroll = el.scrollTop;
      const sel = S.colFilters[S.openCol] ?? [];
      const shown = cfShown();
      el.innerHTML = shown.length
        ? shown.map((o, i) => `<label><input type="checkbox" data-act="cf-check" data-i="${i}" ${sel.includes(o) ? "checked" : ""}><span class="trunc">${esc(o)}</span></label>`).join("")
        : `<p class="xs muted" style="padding:8px">אין ערכים</p>`;
      el.scrollTop = keepScroll;
      const count = $("#cf-count");
      if (count) count.textContent = sel.length ? `${sel.length} נבחרו` : "";
    };
    /** The open column filter floats above the page (never clipped by the table) and stays open while ticking. */
    const renderCfPop = () => {
      const layer = $("#cf-layer");
      if (!S.openCol) { layer.innerHTML = ""; return; }
      if (layer.dataset.col !== S.openCol || !$("#cf-list")) {
        layer.dataset.col = S.openCol;
        layer.innerHTML = `<div class="cf-overlay" data-act="cf-close"></div>
          <div class="cf-pop" id="cf-pop">
            <input class="input xs" style="width:100%;margin-bottom:8px;padding:4px 8px" data-act="cf-q" data-autofocus value="${esc(S.colQ)}" placeholder="חיפוש…">
            <div class="row xs between" style="margin-bottom:8px">
              <div class="row">
                <button type="button" class="link" data-act="cf-all">בחר הכל</button>
                <button type="button" class="muted" data-act="cf-none">נקה</button>
              </div>
              <span class="muted" id="cf-count"></span>
            </div>
            <div class="cf-list" id="cf-list"></div>
            <div style="margin-top:8px;border-top:1px solid var(--border);padding-top:8px;text-align:left">
              <button type="button" class="btn sm" data-act="cf-close">סגירה</button>
            </div>
          </div>`;
      }
      positionCfPop();
      renderCfList();
    };

    const allShownSelected = rows.length > 0 && rows.every((t) => S.selected.has(t.id));
    $("#tx-table").innerHTML = `<table class="tbl hover">
      <thead><tr>
        <th><input type="checkbox" data-act="sel-all" ${allShownSelected ? "checked" : ""}></th>
        ${COLS.map(([k, label]) => `<th><button type="button" class="sortbtn ${S.sortKey === k ? "on" : ""}" data-act="sort" data-k="${k}">${label}<span class="xs">${S.sortKey === k ? (S.sortDir === "asc" ? "▲" : "▼") : "↕"}</span></button>${colFilterHtml(k)}</th>`).join("")}
      </tr></thead>
      <tbody>
        ${rows.map((t) => `<tr>
          <td><input type="checkbox" data-act="sel" data-id="${t.id}" ${S.selected.has(t.id) ? "checked" : ""}></td>
          <td class="num nowrap">${heDate(t.txn_date)}</td>
          <td>${descHtml(t)}</td>
          <td><span class="kind ${t.kind === "income" ? "income" : t.kind === "cc_payment" ? "cc" : t.kind === "separate" ? "sep" : t.kind === "financing" ? "fin" : "expense"}">${KIND_LABEL(t.kind)}</span></td>
          <td class="num nowrap">${esc(ils(t.amount))}</td>
          <td>${picker({ ctx: `row-cat:${t.id}`, value: t.category_id ?? "", options: categories, emptyLabel: t.source_category || "—", newLabel: "+ קטגוריה חדשה…", placeholder: "שם הקטגוריה", cls: "" })}</td>
          <td>${picker({ ctx: `row-topic:${t.id}`, value: t.topic_id ?? "", options: topics, emptyLabel: t.source_topic || "—", newLabel: "+ נושא חדש…", placeholder: "שם הנושא", cls: "" })}</td>
          <td class="num nowrap" style="text-align:center">${esc(t.account_label ?? "—")}</td>
          <td class="xs muted">${esc(t.source_file)}</td>
        </tr>`).join("")}
        ${!rows.length ? `<tr><td colspan="9" class="muted" style="padding:32px;text-align:center">אין תנועות להצגה.</td></tr>` : ""}
      </tbody>
    </table>`;
    $("#tx-table").querySelectorAll("select.sel-xs").forEach((s) => (s.style.maxWidth = "10rem"));
    renderCfPop();

    H = {
      "tx-search": { input: (e, el) => { S.filter = el.value; update(); } },
      more: { click: () => { S.limit += 500; update(); } },
      all: { click: () => { S.limit = allRows.length; update(); } },
      "clear-cols": { click: () => { S.colFilters = {}; update(); } },
      sort: { click: (e, el) => {
        const k = el.dataset.k;
        if (k === S.sortKey) S.sortDir = S.sortDir === "asc" ? "desc" : "asc";
        else { S.sortKey = k; S.sortDir = k === "date" || k === "amount" ? "desc" : "asc"; }
        update();
      } },
      "cf-toggle": { click: (e, el) => { S.openCol = S.openCol === el.dataset.k ? null : el.dataset.k; S.colQ = ""; $("#cf-layer").innerHTML = ""; update(); focusAutofocus(); } },
      "cf-close": { click: () => { S.openCol = null; update(); } },
      "cf-q": { input: (e, el) => { S.colQ = el.value; renderCfList(); } },
      "cf-all": { click: () => { S.colFilters = { ...S.colFilters, [S.openCol]: cfShown() }; update(); } },
      "cf-none": { click: () => { S.colFilters = { ...S.colFilters, [S.openCol]: [] }; update(); } },
      "cf-check": { change: (e, el) => {
        const o = cfShown()[+el.dataset.i];
        const sel = S.colFilters[S.openCol] ?? [];
        S.colFilters = { ...S.colFilters, [S.openCol]: el.checked ? [...sel, o] : sel.filter((v) => v !== o) };
        update();
      } },
      "sel-all": { change: (e, el) => { S.selected = new Set(el.checked ? rows.map((t) => t.id) : []); update(); } },
      sel: { change: (e, el) => { el.checked ? S.selected.add(el.dataset.id) : S.selected.delete(el.dataset.id); update(); } },
      "bulk-apply": { click: () => {
        classifyTransactions([...S.selected], { ...(S.bulkCat ? { categoryId: S.bulkCat } : {}), ...(S.bulkTopic ? { topicId: S.bulkTopic } : {}) });
        S.selected = new Set(); S.bulkCat = ""; S.bulkTopic = "";
        update();
      } },
      "bulk-cancel": { click: () => { S.selected = new Set(); update(); } },
    };
  };
  rerender = () => { update(); focusAutofocus(); };
  update();
}

/* ============================================================
   Import
   ============================================================ */
const imp = { busy: false, lines: [] };

function downloadCsv(filename, header, rows) {
  const e = (v) => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const csv = "﻿" + [header, ...rows].map((r) => r.map(e).join(",")).join("\n");
  const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function importPage() {
  document.title = "Flow-Wise — ייבוא קבצי אקסל";
  const data = flow();
  $("#app").innerHTML = `${appNav("ייבוא נתונים", "קבצי אקסל של בנק וכרטיסי אשראי — כל הגיליונות בקובץ")}
  <main class="wrap w5 stack-lg">
    <section class="card dashed" style="padding:24px;text-align:center">
      <h2>בחירת קבצים</h2>
      <p class="small muted" style="margin-top:4px">פורמט ‎.xlsx‎ / ‎.xls‎ בלבד. אפשר לבחור כמה קבצים יחד. הנתונים נשמרים בדפדפן זה, ותנועות כפולות מסוננות אוטומטית.</p>
      <div class="row3" style="justify-content:center;margin-top:16px">
        <input type="file" accept=".xlsx,.xls" multiple data-act="files" ${imp.busy ? "disabled" : ""} class="input" style="width:100%;max-width:24rem;padding:8px">
        <button type="button" class="btn outline sm" data-act="clear" ${imp.busy ? "disabled" : ""}>מחיקת כל הנתונים</button>
        <button type="button" class="btn outline sm" data-act="export" ${imp.busy || !data.transactions.length ? "disabled" : ""}>ייצוא נתונים (CSV)</button>
        <button type="button" class="btn outline sm" data-act="reset" ${imp.busy ? "disabled" : ""}>שחזור הנתונים המקוריים</button>
      </div>
      ${imp.busy ? `<p class="small muted" style="margin-top:12px">מעבד קבצים…</p>` : ""}
    </section>
    ${imp.lines.length ? `<section class="card">
      <h2 style="margin-bottom:12px">תוצאות הטעינה</h2>
      <ul class="small">${imp.lines.map((l) => `<li class="row between" style="border-bottom:1px solid var(--border);padding-block:8px">
        <span style="font-weight:500">${esc(l.file)}</span>
        ${l.error ? `<span class="down">שגיאה: ${esc(l.error)}</span>` : `<span class="muted">נקראו ${l.read} · נוספו ${l.added} · כפילויות ${l.duplicates}</span>`}
      </li>`).join("")}</ul>
    </section>` : ""}
    <section class="card">
      <h2 style="margin-bottom:12px">היסטוריית טעינות</h2>
      ${!data.imports.length ? `<p class="small muted">עדיין לא נטענו קבצים.</p>` : `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>קובץ</th><th>תאריך</th><th>נקראו</th><th>נוספו</th><th>כפילויות</th><th></th></tr></thead>
        <tbody>${data.imports.map((i) => `<tr>
          <td>${esc(i.file_name)}</td>
          <td class="num nowrap">${heDate(i.created_at.slice(0, 10))}</td>
          <td class="num">${i.rows_read}</td><td class="num">${i.rows_added}</td><td class="num">${i.rows_duplicate}</td>
          <td><button type="button" class="xs down" data-act="undo" data-id="${i.id}" data-name="${esc(i.file_name)}">ביטול טעינה</button></td>
        </tr>`).join("")}</tbody>
      </table></div>`}
    </section>
  </main>`;

  H = {
    files: { change: async (e, el) => {
      const files = [...(el.files ?? [])];
      if (!files.length) return;
      imp.busy = true; imp.lines = []; importPage();
      for (const file of files) {
        try {
          const XLSX = await loadXLSX();
          const parsed = parseWorkbook(XLSX, file.name, await file.arrayBuffer());
          const sheets = [...new Set(parsed.map((t) => t.sheet ?? "").filter(Boolean))];
          const res = importWorkbook({ fileName: file.name, sheetNames: sheets, rows: parsed });
          imp.lines.push({ file: file.name, ...res });
        } catch (err) {
          imp.lines.push({ file: file.name, read: 0, added: 0, duplicates: 0, error: err.message });
        }
      }
      imp.busy = false;
      importPage();
    } },
    clear: { click: () => { if (!confirm("למחוק את כל התנועות וההיסטוריה?")) return; clearAllTransactions(); importPage(); } },
    reset: { click: () => {
      if (!confirm("לשחזר את הנתונים כפי שיוצאו מהאפליקציה? כל השינויים שנעשו כאן יימחקו.")) return;
      resetToExport(); imp.lines = []; importPage(); toast("הנתונים המקוריים שוחזרו");
    } },
    undo: { click: (e, el) => { if (!confirm(`לבטל את הטעינה של ${el.dataset.name} ולמחוק את שורותיה?`)) return; deleteImport(el.dataset.id); importPage(); } },
    export: { click: () => {
      const d = flow();
      const stamp = new Date().toISOString().slice(0, 10);
      const catName = new Map(d.categories.map((c) => [c.id, c.name]));
      const topicName = new Map(d.topics.map((t) => [t.id, t.name]));
      downloadCsv(`transactions-${stamp}.csv`, ["תאריך", "תיאור", "סכום", "סוג", "חשבון", "קטגוריה", "נושא", "קובץ מקור", "גיליון"],
        d.transactions.map((t) => [t.txn_date, t.description, t.amount, t.kind, t.account_label,
          (t.category_id && catName.get(t.category_id)) || t.source_category, (t.topic_id && topicName.get(t.topic_id)) || t.source_topic, t.source_file, t.source_sheet]));
      downloadCsv(`categories-${stamp}.csv`, ["קטגוריה"], d.categories.map((c) => [c.name]));
      downloadCsv(`topics-${stamp}.csv`, ["נושא"], d.topics.map((t) => [t.name]));
      downloadCsv(`imports-${stamp}.csv`, ["קובץ", "תאריך טעינה", "נקראו", "נוספו", "כפילויות"],
        d.imports.map((i) => [i.file_name, i.created_at.slice(0, 10), i.rows_read, i.rows_added, i.rows_duplicate]));
    } },
  };
}

  const syncBtn =(act, v) => { const b = $(`[data-act="${act}"]`); if (b) b.disabled = !v.trim(); };
  H = {
    "new-topic": { input: (e, el) => { tax.newTopic = el.value; syncBtn("add-topic", el.value); }, keydown: (e) => { if (e.key === "Enter") H["add-topic"].click(); } },
    "new-cat": { input: (e, el) => { tax.newCategory = el.value; syncBtn("add-cat", el.value); }, keydown: (e) => { if (e.key === "Enter") H["add-cat"].click(); } },
    "add-topic": { click: () => { if (!tax.newTopic.trim()) return; try { upsertTopic({ name: tax.newTopic }); tax.newTopic = ""; taxonomyPage(); } catch (err) { toast(err.message); } } },
    "add-cat": { click: () => { if (!tax.newCategory.trim()) return; try { upsertCategory({ name: tax.newCategory }); tax.newCategory = ""; taxonomyPage(); } catch (err) { toast(err.message); } } },
    "apply-topics": { click: () => { const n = applyPrimaryTopics(); taxonomyPage(); toast(`עודכנו ${n} תנועות`); } },
  };
  Object.assign(H, TYPES_HANDLERS);
  renderTypes();
  rerender = () => { const y = scrollY; taxonomyPage(); scrollTo(0, y); focusAutofocus(); };
}

/* ---------- transaction types: one row per transaction name (section of the taxonomy screen) ---------- */
// Installment suffixes and the "פרעון" (early repayment) prefix belong to the same merchant name.
const typeName = (d) =>
  String(d ?? "").replace(/\s*\(תשלום \d+ מתוך \d+\)\s*$/, "").replace(/^פרעון\s+/, "").replace(/\s+/g, " ").trim() || "ללא תיאור";
// pending: name -> { categoryId?, topicId? } chosen on screen but not yet applied to the transactions.
const typesState = { pending: new Map(), filter: "", onlyMissing: false, sort: "missing", dir: "desc", limit: 150 };
// Default direction when a column is chosen: names A→Z, numbers largest first.
const TYPES_DEFAULT_DIR = { name: "asc", count: "desc", total: "desc", category: "asc", topic: "asc", missing: "desc" };
let typesIndex = new Map(); // row key -> group

function buildTypes() {
  const groups = new Map();
  for (const t of db.transactions) {
    const name = typeName(t.description);
    let g = groups.get(name);
    if (!g) groups.set(name, (g = { name, count: 0, total: 0, cats: new Map(), topics: new Map(), accounts: new Set() }));
    g.count++;
    g.total += t.kind === "income" ? -t.amount : t.kind === "expense" ? t.amount : 0;
    g.cats.set(t.category_id ?? "", (g.cats.get(t.category_id ?? "") ?? 0) + 1);
    g.topics.set(t.topic_id ?? "", (g.topics.get(t.topic_id ?? "") ?? 0) + 1);
    g.accounts.add(t.account_label ?? "—");
  }
  const mostUsed = (m) => [...m].sort((a, b) => b[1] - a[1])[0][0];
  const index = new Map();
  let n = 0;
  for (const g of [...groups.values()].sort((a, b) => heSort(a.name, b.name))) {
    g.categoryId = mostUsed(g.cats);
    g.topicId = mostUsed(g.topics);
    g.key = `t${n++}`;
    index.set(g.key, g);
  }
  return index;
}

function stageType(key, field, id) {
  const g = typesIndex.get(key);
  if (!g) return;
  const p = { ...(typesState.pending.get(g.name) ?? {}) };
  const original = field === "categoryId" ? g.categoryId : g.topicId;
  if ((id ?? "") === (original ?? "")) delete p[field];
  else p[field] = id ?? "";
  // Choosing a category fills an empty topic with that category's primary topic.
  if (field === "categoryId" && id) {
    const topicNow = p.topicId !== undefined ? p.topicId : g.topicId;
    const primary = db.categories.find((c) => c.id === id)?.primary_topic_id;
    if (!db.topics.some((t) => t.id === topicNow) && primary) p.topicId = primary;
  }
  if (Object.keys(p).length) typesState.pending.set(g.name, p);
  else typesState.pending.delete(g.name);
}

function applyTypeChanges() {
  const pending = typesState.pending;
  let updated = 0;
  for (const t of db.transactions) {
    const p = pending.get(typeName(t.description));
    if (!p) continue;
    if (p.categoryId !== undefined) t.category_id = p.categoryId || null;
    if (p.topicId !== undefined) t.topic_id = p.topicId || null;
    updated++;
  }
  const names = pending.size;
  pending.clear();
  saveDb();
  return { updated, names };
}

function renderTypes() {
  const table = $("#types-table");
  if (!table) return;
  const S = typesState;
  typesIndex = buildTypes();
  const cats = [...db.categories].sort((a, b) => heSort(a.name, b.name));
  const tops = [...db.topics].sort((a, b) => heSort(a.name, b.name));
  const catIds = new Set(cats.map((c) => c.id));
  const topicIds = new Set(tops.map((t) => t.id));
  const current = (g) => {
    const p = S.pending.get(g.name) ?? {};
    return { cat: p.categoryId !== undefined ? p.categoryId : g.categoryId, topic: p.topicId !== undefined ? p.topicId : g.topicId, p };
  };
  const missing = (cat, topic) => !catIds.has(cat) || !topicIds.has(topic);

  const all = [...typesIndex.values()];
  const missingCount = all.filter((g) => { const v = current(g); return missing(v.cat, v.topic); }).length;
  let list = all;
  const q = S.filter.trim().toLowerCase();
  if (q) list = list.filter((g) => g.name.toLowerCase().includes(q));
  // Rows being edited stay visible even after they are no longer missing.
  if (S.onlyMissing) list = list.filter((g) => missing(g.categoryId, g.topicId) || S.pending.has(g.name));
  // Sort by the state before editing, so a row doesn't jump away while its category/topic is being chosen.
  const isMissing = (g) => (missing(g.categoryId, g.topicId) ? 1 : 0);
  // Ascending comparators; the chosen direction flips them.
  // Category/topic sort uses each row's value before editing, like the other columns.
  const catNameOf = new Map(cats.map((c) => [c.id, c.name]));
  const topicNameOf = new Map(tops.map((t) => [t.id, t.name]));
  const labelOf = { category: (g) => catNameOf.get(g.categoryId) ?? "", topic: (g) => topicNameOf.get(g.topicId) ?? "" };
  const ascending = {
    total: (a, b) => a.total - b.total, // as shown: income is negative
    count: (a, b) => a.count - b.count,
    name: (a, b) => heSort(a.name, b.name),
    category: (a, b) => heSort(labelOf.category(a), labelOf.category(b)),
    topic: (a, b) => heSort(labelOf.topic(a), labelOf.topic(b)),
  };
  const sign = S.dir === "asc" ? 1 : -1;
  // Rows without a category/topic stay at the bottom in both directions.
  const blankLast = (a, b) => (labelOf[S.sort] ? (!labelOf[S.sort](a)) - (!labelOf[S.sort](b)) : 0);
  list.sort(S.sort === "missing"
    ? (a, b) => isMissing(b) - isMissing(a) || Math.abs(b.total) - Math.abs(a.total)
    : (a, b) => blankLast(a, b) || sign * ascending[S.sort](a, b) || heSort(a.name, b.name));
  const sortSelect = $('[data-act="types-sort"]');
  if (sortSelect) sortSelect.value = S.sort;
  const sortTh = (key, label) =>
    `<th><button type="button" class="sortbtn ${S.sort === key ? "on" : ""}" data-act="types-sort-head" data-k="${key}">${label}<span class="xs">${S.sort === key ? (S.dir === "asc" ? "▲" : "▼") : "↕"}</span></button></th>`;
  const shown = list.slice(0, S.limit);

  const pendingNames = S.pending.size;
  const affected = all.filter((g) => S.pending.has(g.name)).reduce((s, g) => s + g.count, 0);
  $("#types-summary").textContent = `${all.length} שמות · ${missingCount} חסרי קטגוריה או נושא`;
  $("#types-actions").innerHTML = `
    ${pendingNames ? `<span class="small muted">${pendingNames} שמות · ${affected} תנועות יעודכנו</span>
      <button type="button" class="btn outline sm" data-act="types-discard">בטל שינויים</button>` : ""}
    <button type="button" class="btn" data-act="types-apply" ${pendingNames ? "" : "disabled"}>ישם שינויים${pendingNames ? ` (${pendingNames})` : ""}</button>`;

  const cell = (g, kind, value, options, groupMap, p, newLabel, placeholder) => {
    const ctx = `type-${kind}:${g.key}`;
    const field = kind === "cat" ? "categoryId" : "topicId";
    return `<div class="pick-cell">
        ${picker({ ctx, value: value ?? "", options, emptyLabel: "—", newLabel, placeholder })}
        ${ctx in pickerDraft ? "" : `<button type="button" class="add-btn" title="${esc(newLabel.replace("…", ""))}" data-act="types-add" data-ctx="${ctx}">+</button>`}
      </div>
      ${groupMap.size > 1 && p[field] === undefined ? `<div class="mixed">${groupMap.size} ערכים שונים בתנועות</div>` : ""}`;
  };

  table.innerHTML = `<div class="tbl-wrap"><table class="tbl hover">
      <thead><tr>${sortTh("name", "שם העסקה")}${sortTh("count", "תנועות")}${sortTh("total", "סכום")}<th>חשבון</th>${sortTh("category", "קטגוריה")}${sortTh("topic", "נושא")}</tr></thead>
      <tbody>
        ${shown.map((g) => {
          const v = current(g);
          return `<tr class="${S.pending.has(g.name) ? "changed" : ""} ${missing(v.cat, v.topic) ? "missing" : ""}">
            <td>${esc(g.name)}</td>
            <td class="num"><a class="link" href="${href("/transactions", { q: g.name })}" title="הצגת התנועות">${g.count}</a></td>
            <td class="num nowrap">${esc(ils(g.total))}</td>
            <td class="xs muted">${esc([...g.accounts].slice(0, 3).join(", "))}${g.accounts.size > 3 ? "…" : ""}</td>
            <td>${cell(g, "cat", v.cat, cats, g.cats, v.p, "+ קטגוריה חדשה…", "שם הקטגוריה")}</td>
            <td>${cell(g, "topic", v.topic, tops, g.topics, v.p, "+ נושא חדש…", "שם הנושא")}</td>
          </tr>`;
        }).join("")}
        ${!shown.length ? `<tr><td colspan="6" class="muted" style="padding:24px;text-align:center">אין שמות להצגה.</td></tr>` : ""}
      </tbody>
    </table></div>
    ${list.length > shown.length ? `<div class="row" style="margin-top:12px">
      <span class="small muted">מוצגים ${shown.length} מתוך ${list.length}</span>
      <button type="button" class="btn outline sm" data-act="types-more">הצג עוד 150</button>
      <button type="button" class="btn sm" data-act="types-all">הצג הכל</button>
    </div>` : ""}`;
  table.querySelectorAll(".pick-cell select").forEach((s) => (s.style.maxWidth = "11rem"));
}

const TYPES_HANDLERS = {
  "types-search": { input: (e, el) => { typesState.filter = el.value; typesState.limit = 150; renderTypes(); } },
  "types-missing": { change: (e, el) => { typesState.onlyMissing = el.checked; typesState.limit = 150; renderTypes(); } },
  "types-sort": { change: (e, el) => { typesState.sort = el.value; typesState.dir = TYPES_DEFAULT_DIR[el.value]; renderTypes(); } },
  "types-sort-head": { click: (e, el) => {
    const k = el.dataset.k;
    if (typesState.sort === k) typesState.dir = typesState.dir === "asc" ? "desc" : "asc";
    else { typesState.sort = k; typesState.dir = TYPES_DEFAULT_DIR[k]; }
    renderTypes();
  } },
  "types-more": { click: () => { typesState.limit += 150; renderTypes(); } },
  "types-all": { click: () => { typesState.limit = Infinity; renderTypes(); } },
  "types-add": { click: (e, el) => {
    const input = document.querySelector(`input[data-act="cb"][data-ctx="${CSS.escape(el.dataset.ctx)}"]`);
    if (!input) return;
    input.focus();
    input.value = "";
    input.placeholder = "הקלידו שם חדש…";
    combo.keepOnEmpty = true; // leaving the field without typing keeps the current value
    comboRender("");
  } },
  "types-discard": { click: () => { typesState.pending.clear(); renderTypes(); } },
  "types-apply": { click: () => {
    const { updated, names } = applyTypeChanges();
    const y = scrollY;
    taxonomyPage();
    scrollTo(0, y);
    toast(`עודכנו ${updated} תנועות ב-${names} שמות`);
  } },
};

let prdObserver = null;
let prdNavOpen = false;

function blockHtml(b) {
  switch (b.t) {
    case "lead": return `<p class="b-lead">${esc(b.text)}</p>`;
    case "p": return `<p class="b-p">${esc(b.text)}</p>`;
    case "h3": return `<h3 class="b-h3">${esc(b.text)}</h3>`;
    case "label": return `<p class="b-label">${esc(b.text)}</p>`;
    case "ul": case "sub": return `<ul class="b-ul ${b.t === "sub" ? "sub" : ""}">${b.items.map((i) => `<li><span class="dot"></span><span>${esc(i)}</span></li>`).join("")}</ul>`;
    case "ol": return `<ol class="b-ol">${b.items.map((i, n) => `<li><span class="olnum">${n + 1}</span><span>${esc(i)}</span></li>`).join("")}</ol>`;
    case "table": return `<div class="b-table"><table><thead><tr>${b.head.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${b.rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    default: return "";
  }
}

    document.querySelectorAll("[data-toc]").forEach((b) => b.classList.toggle("on", b.dataset.toc === visible.target.id));
  }, { rootMargin: "-15% 0px -70% 0px", threshold: 0 });
  sections.forEach((s) => { const el = document.getElementById(s.id); if (el) prdObserver.observe(el); });
}

function parseModules(blocks) {
  const out = [];
  let current = null, inCriteria = false;
  for (const block of blocks) {
    if (block.t === "h3") {
      const match = /^(M\d+)\s*[—-]\s*(.*)$/.exec(block.text);
      const rest = match ? match[2] : block.text;
      const phaseMatch = /\(([^)]*)\)\s*$/.exec(rest);
      current = {
        id: match ? match[1] : block.text,
        title: (phaseMatch ? rest.slice(0, phaseMatch.index) : rest).trim(),
        phase: phaseMatch ? phaseMatch[1].trim() : "",
        notes: [], features: [], criteriaLabel: "קריטריוני קבלה", criteria: [],
      };
      inCriteria = false;
      out.push(current);
      continue;
    }
    if (!current) continue;
    if (block.t === "label") { inCriteria = true; current.criteriaLabel = block.text; }
    else if (block.t === "p") current.notes.push(block.text);
    else if (block.t === "ul") current.features.push(...block.items);
    else if (block.t === "sub") (inCriteria ? current.criteria : current.features).push(...block.items);
  }
  return out;
}

          <ul class="b-ul small">${m.features.map((f) => `<li><span class="dot" style="margin-top:12px"></span><span>${esc(f)}</span></li>`).join("")}</ul>

          </div>` : ""}
        </article>`).join("")}
      </div>

    <footer class="doc" style="text-align:center;padding-bottom:32px">${esc(prdMeta.product)} · ${esc(prdMeta.subtitle)} · ${esc(prdMeta.version)} · ${esc(prdMeta.date)}</footer>`;
}
