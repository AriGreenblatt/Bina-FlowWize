const STORE_KEY = SEED.storeKey ?? "flowwise.standalone.db.v4";

/* ---------------- helpers ---------------- */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const $ = (sel, root = document) => root.querySelector(sel);
/** A transaction's description; card months with no statement get a "data not available" tag. */
const NODATA = "הנתונים אינם זמינים";
const descHtml = (t) => `${esc(t.description)}${t.missing_detail ? `<span class="nodata" title="אין פירוט עסקאות לחודש זה — מוצג הסכום שחויב בבנק">${NODATA}</span>` : ""}`;
const ils = (n) => new Intl.NumberFormat("he-IL", { style: "currency", currency: "ILS", maximumFractionDigits: 0 }).format(n);
const heDate = (iso) => { const [y, m, d] = iso.split("-"); return `${d}/${m}/${y}`; };
const heSort = (a, b) => a.localeCompare(b, "he");
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now().toString(36) + Math.random().toString(36).slice(2));
const clean = (v) => { const s = (v ?? "").trim(); return s.length ? s : null; };

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.add("hidden"), 2600);
}

/* ---------------- local database ---------------- */
let db = loadDb();

function loadDb() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return fillBlanks(migrate(JSON.parse(raw)));
  } catch {}
  return structuredClone(SEED);
}

/** One-time changes applied to data already saved in the browser, keeping the user's edits. */
/**
 * Rows saved in the browser that still have no category/topic get the one the built-in data now has
 * (e.g. after new merchant rules), matched by dedup_key. Rows the user already classified are kept.
 */
function fillBlanks(saved) {
  const seedCat = new Map(SEED.categories.map((c) => [c.id, c]));
  const seedTopic = new Map(SEED.topics.map((t) => [t.id, t.name]));
  const catByName = new Map(saved.categories.map((c) => [c.name, c.id]));
  const topicByName = new Map(saved.topics.map((t) => [t.name, t.id]));
  const seedRow = new Map(SEED.transactions.map((t) => [t.dedup_key, t]));
  let changed = 0;
  for (const t of saved.transactions) {
    // The type (card payment, kept out of the cash flow, …) is decided by the build, not edited in
    // the app, so it always follows the built-in data.
    const seedT = seedRow.get(t.dedup_key);
    if (seedT && seedT.kind !== t.kind) { t.kind = seedT.kind; for (const k of ["cc_company", "cc_card", "cc_amount", "fin_amount"]) if (k in seedT) t[k] = seedT[k]; changed++; }
    if (t.category_id || t.topic_id) continue;
    const s = seedRow.get(t.dedup_key);
    const cat = s?.category_id && seedCat.get(s.category_id);
    const topic = s?.topic_id && seedTopic.get(s.topic_id);
    if (!cat && !topic) continue;
    if (topic && !topicByName.has(topic)) { saved.topics.push({ id: s.topic_id, name: topic }); topicByName.set(topic, s.topic_id); }
    if (cat && !catByName.has(cat.name)) { saved.categories.push({ id: cat.id, name: cat.name, primary_topic_id: topic ? topicByName.get(topic) : null }); catByName.set(cat.name, cat.id); }
    if (cat) t.category_id = catByName.get(cat.name);
    if (topic) t.topic_id = topicByName.get(topic);
    if (cat && topic && !saved.category_topics.some((l) => l.category_id === t.category_id && l.topic_id === t.topic_id)) saved.category_topics.push({ category_id: t.category_id, topic_id: t.topic_id });
    changed++;
  }
  if (changed) { try { localStorage.setItem(STORE_KEY, JSON.stringify(saved)); } catch {} }
  return saved;
}

function migrate(saved) {
  saved.migrations ??= [];
  const pending = (SEED.migrations ?? []).filter((m) => !saved.migrations.includes(m));
  if (!pending.length) return saved;

  if (pending.includes("remove-bank-transactions")) {
    // Sep 2026: the old bank rows from the Lovable export were removed.
    saved.transactions = saved.transactions.filter((t) => t.account_label !== "בנק");
  }
  for (const m of pending) {
    // Each "add-…" migration copies the rows of its imports from the built-in data
    // (Sep 2026: bank Sep 2024 – Sep 2026; credit-card statements Feb 2024 – Mar 2026).
    // Matched by name so the user's own categories/topics are reused.
    const importIds = new Set(SEED.migrationImports?.[m] ?? []);
    if (!importIds.size) continue;
    const catByName = new Map(saved.categories.map((c) => [c.name, c.id]));
    const topicByName = new Map(saved.topics.map((t) => [t.name, t.id]));
    const seedCat = new Map(SEED.categories.map((c) => [c.id, c]));
    const seedTopic = new Map(SEED.topics.map((t) => [t.id, t.name]));
    const topicFor = (seedId) => {
      const name = seedId && seedTopic.get(seedId);
      if (!name) return null;
      if (!topicByName.has(name)) { saved.topics.push({ id: seedId, name }); topicByName.set(name, seedId); }
      return topicByName.get(name);
    };
    const categoryFor = (seedId) => {
      const c = seedId && seedCat.get(seedId);
      if (!c) return null;
      if (!catByName.has(c.name)) { saved.categories.push({ id: seedId, name: c.name, primary_topic_id: topicFor(c.primary_topic_id) }); catByName.set(c.name, seedId); }
      return catByName.get(c.name);
    };
    const have = new Set(saved.transactions.map((t) => t.dedup_key));
    for (const t of SEED.transactions) {
      if (!importIds.has(t.import_id) || have.has(t.dedup_key)) continue;
      saved.transactions.push({ ...t, category_id: categoryFor(t.category_id), topic_id: topicFor(t.topic_id) });
    }
    for (const l of SEED.category_topics) {
      const cid = categoryFor(l.category_id), tid = topicFor(l.topic_id);
      if (cid && tid && !saved.category_topics.some((x) => x.category_id === cid && x.topic_id === tid)) saved.category_topics.push({ category_id: cid, topic_id: tid });
    }
    for (const i of SEED.imports) if (importIds.has(i.id) && !saved.imports.some((x) => x.id === i.id)) saved.imports.push(i);
  }
  saved.migrations.push(...pending);
  try { localStorage.setItem(STORE_KEY, JSON.stringify(saved)); } catch {}
  return saved;
}
function saveDb() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
  catch { toast("לא ניתן לשמור בדפדפן — השינויים יישמרו רק עד רענון הדף"); }
}

/** Same shape the app's getFlowData server function returned. */
function flow() {
  return {
    transactions: [...db.transactions].sort((a, b) => b.txn_date.localeCompare(a.txn_date)),
    categories: [...db.categories].sort((a, b) => heSort(a.name, b.name)),
    topics: [...db.topics].sort((a, b) => heSort(a.name, b.name)),
    imports: [...db.imports].sort((a, b) => b.created_at.localeCompare(a.created_at)),
  };
}

function upsertTopic({ id, name }) {
  name = name.trim();
  if (!name) throw new Error("שם הנושא ריק");
  if (id) { const t = db.topics.find((x) => x.id === id); if (t) t.name = name; saveDb(); return id; }
  const existing = db.topics.find((t) => t.name === name);
  if (existing) return existing.id;
  const row = { id: uuid(), name };
  db.topics.push(row);
  saveDb();
  return row.id;
}

function upsertCategory({ id, name, primaryTopicId }) {
  if (id) {
    const c = db.categories.find((x) => x.id === id);
    if (!c) return id;
    if (name !== undefined) c.name = name.trim();
    if (primaryTopicId !== undefined) c.primary_topic_id = primaryTopicId;
    if (primaryTopicId && !db.category_topics.some((l) => l.category_id === id && l.topic_id === primaryTopicId))
      db.category_topics.push({ category_id: id, topic_id: primaryTopicId });
    saveDb();
    return id;
  }
  name = (name ?? "").trim();
  if (!name) throw new Error("שם הקטגוריה ריק");
  const existing = db.categories.find((c) => c.name === name);
  if (existing) return existing.id;
  const row = { id: uuid(), name, primary_topic_id: primaryTopicId ?? null };
  db.categories.push(row);
  saveDb();
  return row.id;
}

function classifyTransactions(ids, patch) {
  const set = new Set(ids);
  for (const t of db.transactions) {
    if (!set.has(t.id)) continue;
    if (patch.categoryId !== undefined) t.category_id = patch.categoryId;
    if (patch.topicId !== undefined) t.topic_id = patch.topicId;
  }
  saveDb();
}

function applyPrimaryTopics() {
  const primary = new Map(db.categories.filter((c) => c.primary_topic_id).map((c) => [c.id, c.primary_topic_id]));
  let updated = 0;
  for (const t of db.transactions) {
    const p = t.category_id && primary.get(t.category_id);
    if (p) { t.topic_id = p; updated++; }
  }
  saveDb();
  return updated;
}

function importWorkbook({ fileName, sheetNames, rows }) {
  rows = rows.slice(0, 20000);
  const imp = { id: uuid(), file_name: fileName, sheet_names: sheetNames, rows_read: rows.length, rows_added: 0, rows_duplicate: 0, created_at: new Date().toISOString() };
  db.imports.push(imp);

  // taxonomy from the source file
  for (const name of new Set(rows.map((r) => clean(r.topic)).filter(Boolean)))
    if (!db.topics.some((t) => t.name === name)) db.topics.push({ id: uuid(), name });
  for (const name of new Set(rows.map((r) => clean(r.category)).filter(Boolean)))
    if (!db.categories.some((c) => c.name === name)) db.categories.push({ id: uuid(), name, primary_topic_id: null });
  const topicByName = new Map(db.topics.map((t) => [t.name, t.id]));
  const catByName = new Map(db.categories.map((c) => [c.name, c]));

  // link categories to the topics they appear with, and set a primary topic once
  for (const r of rows) {
    const c = catByName.get(clean(r.category));
    const tid = topicByName.get(clean(r.topic));
    if (!c || !tid) continue;
    if (!db.category_topics.some((l) => l.category_id === c.id && l.topic_id === tid))
      db.category_topics.push({ category_id: c.id, topic_id: tid });
    if (!c.primary_topic_id) c.primary_topic_id = tid;
  }

  // transactions
  const existing = new Set(db.transactions.map((t) => t.dedup_key));
  const seen = new Set();
  let added = 0;
  for (const r of rows) {
    const account = clean(r.account);
    const dedup_key = [r.date, r.description, r.amount.toFixed(2), r.kind, account ?? ""].join("|");
    if (seen.has(dedup_key)) continue;
    seen.add(dedup_key);
    if (existing.has(dedup_key)) continue;
    const catName = clean(r.category);
    const topName = clean(r.topic);
    const cat = catName ? catByName.get(catName) : null;
    db.transactions.push({
      id: uuid(),
      import_id: imp.id,
      txn_date: r.date,
      description: r.description,
      amount: r.amount,
      kind: r.kind,
      account_label: account,
      category_id: cat?.id ?? null,
      topic_id: topName ? (topicByName.get(topName) ?? null) : (cat?.primary_topic_id ?? null),
      source_category: catName,
      source_topic: topName,
      source_file: fileName,
      source_sheet: clean(r.sheet),
      dedup_key,
    });
    added++;
  }
  imp.rows_added = added;
  imp.rows_duplicate = rows.length - added;
  saveDb();
  return { read: rows.length, added, duplicates: rows.length - added };
}

function deleteImport(id) {
  db.imports = db.imports.filter((i) => i.id !== id);
  db.transactions = db.transactions.filter((t) => t.import_id !== id);
  saveDb();
}
function clearAllTransactions() {
  db.transactions = [];
  db.imports = [];
  saveDb();
}
function resetToExport() {
  db = structuredClone(SEED);
  try { localStorage.removeItem(STORE_KEY); } catch {}
}

/* ---------------- Excel parsing (port of src/lib/txns.ts) ---------------- */
let xlsxPromise = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return (xlsxPromise ||= new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = () => resolve(window.XLSX);
    s.onerror = () => { xlsxPromise = null; reject(new Error("לא ניתן לטעון את ספריית האקסל (נדרש חיבור לאינטרנט)")); };
    document.head.appendChild(s);
  }));
}

const DATE_KEYS = ["תאריך", "תאריך ערך", "תאריך עסקה", "תאריך חיוב", "date"];
const DESC_KEYS = ["תיאור", "פירוט", "שם בית עסק", "בית עסק", "תאור", "אסמכתא", "description"];
const DEBIT_KEYS = ["חובה", "חיוב", "סכום חיוב", "הוצאה", "סכום העסקה", "debit"];
const CREDIT_KEYS = ["זכות", "הכנסה", "סכום זיכוי", "credit"];
const AMOUNT_KEYS = ["סכום", "סך", "amount", "total"];
const CATEGORY_KEYS = ["קטגוריה", "קטגוריה ראשית", "סיווג", "category"];
const TOPIC_KEYS = ["נושא", "נושא ראשי", "topic"];
const BAD_KEY = /(חודש|מספר|כרטיס|אסמכתא|גיליון|קובץ|סיווג|ענף|מטבע|סוג)/;
const CC_HINTS = ["כרטיס", "אשראי", "cal", "isracard", "visa", "mastercard", "card", "cc", "ישראכרט"];

const norm = (s) => String(s ?? "").trim().toLowerCase().replace(/\s+/g, " ");

function findKey(keys, candidates, used = [], strict = false) {
  const pool = keys.filter((k) => !used.includes(k) && !(strict && BAD_KEY.test(k)));
  return pool.find((k) => candidates.some((c) => norm(k) === norm(c)))
    ?? pool.find((k) => candidates.some((c) => norm(k).includes(norm(c))));
}

function toNumber(v) {
  if (typeof v === "number") return isFinite(v) ? v : null;
  if (typeof v !== "string") return null;
  if (/[^\d.,\-()₪\s]/.test(v.trim())) return null;
  const cleaned = v.replace(/[₪,\s]/g, "").replace(/[^\d.\-()]/g, "");
  if (!cleaned) return null;
  const neg = /^\(.*\)$/.test(cleaned);
  const n = parseFloat(cleaned.replace(/[()]/g, ""));
  if (!isFinite(n)) return null;
  return neg ? -n : n;
}

function toDate(v) {
  if (v instanceof Date && !isNaN(v.getTime())) return v.toISOString().slice(0, 10);
  if (typeof v === "number" && v > 20000 && v < 60000) {
    const d = new Date(Date.UTC(1899, 11, 30));
    d.setUTCDate(d.getUTCDate() + Math.round(v));
    return d.toISOString().slice(0, 10);
  }
  if (typeof v === "string") {
    const m = v.trim().match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/);
    if (m) {
      const yy = m[3] ?? "";
      const y = yy.length === 2 ? 2000 + Number(yy) : Number(yy);
      const d = new Date(Date.UTC(y, Number(m[2]) - 1, Number(m[1])));
      if (!isNaN(d.getTime())) return d.toISOString().slice(0, 10);
    }
    const d2 = new Date(v);
    if (!isNaN(d2.getTime())) return d2.toISOString().slice(0, 10);
  }
  return null;
}

function detectHeaderRow(rows) {
  const all = [...DATE_KEYS, ...DESC_KEYS, ...DEBIT_KEYS, ...CREDIT_KEYS, ...AMOUNT_KEYS];
  for (let i = 0; i < Math.min(rows.length, 25); i++) {
    const hits = (rows[i] || []).filter((c) => all.some((k) => norm(c) && norm(c).includes(norm(k)))).length;
    if (hits >= 2) return i;
  }
  return 0;
}

function findCardDigitsInSheet(header, rows, matrix) {
  const looksCard = (v) => {
    const m = String(v ?? "").trim().match(/(?:\*{2,}|\b)(?!20\d{2}\b|19\d{2}\b)(\d{4})\b/);
    return m?.[1] ?? null;
  };
  const cardCol = header.find((h) => /כרטיס|ספרות/.test(h));
  if (cardCol) {
    const counts = new Map();
    for (const r of rows) { const d = looksCard(r[cardCol]); if (d) counts.set(d, (counts.get(d) ?? 0) + 1); }
    const top = [...counts.entries()].sort((a, b) => b[1] - a[1])[0];
    if (top) return top[0];
  }
  for (const row of matrix.slice(0, 10)) {
    for (const cell of row) {
      const s = String(cell ?? "");
      if (/כרטיס|אשראי/.test(s)) { const d = looksCard(s); if (d) return d; }
    }
  }
  return null;
}

function extractCardDigits(name) {
  const m = name.match(/\b(?!20\d{2}|19\d{2})\d{4}\b/);
  return m ? m[0] : null;
}

function accountLabel(fileName, sheetName, sheetCardDigits) {
  if (/בנק/.test(sheetName)) return "בנק";
  const isCc = CC_HINTS.some((h) => sheetName.toLowerCase().includes(h) || fileName.toLowerCase().includes(h));
  if (isCc) return sheetCardDigits ?? extractCardDigits(fileName) ?? extractCardDigits(sheetName) ?? "בנק";
  return sheetCardDigits ?? extractCardDigits(fileName) ?? "בנק";
}

function parseWorkbook(XLSX, fileName, data) {
  const wb = XLSX.read(data, { cellDates: true });
  const out = [];
  const fileHintsIncome = /הכנס/.test(fileName);
  for (const sheetName of wb.SheetNames) {
    const sheet = wb.Sheets[sheetName];
    if (!sheet) continue;
    const matrix = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: "" });
    if (!matrix.length) continue;
    const hIdx = detectHeaderRow(matrix);
    const header = matrix[hIdx].map((c) => String(c ?? "").trim());
    const rows = matrix.slice(hIdx + 1).map((r) => {
      const o = {};
      header.forEach((h, i) => { if (h) o[h] = r[i]; });
      return o;
    });
    const keys = header.filter(Boolean);
    const dateKey = findKey(keys, DATE_KEYS);
    const used = dateKey ? [dateKey] : [];
    const debitKey = findKey(keys, DEBIT_KEYS, used, true); if (debitKey) used.push(debitKey);
    const creditKey = findKey(keys, CREDIT_KEYS, used, true); if (creditKey) used.push(creditKey);
    const amountKey = findKey(keys, AMOUNT_KEYS, used, true); if (amountKey) used.push(amountKey);
    const descKey = findKey(keys, DESC_KEYS, used); if (descKey) used.push(descKey);
    const categoryKey = findKey(keys, CATEGORY_KEYS, used); if (categoryKey) used.push(categoryKey);
    const topicKey = findKey(keys, TOPIC_KEYS, used);
    if (!dateKey || (!debitKey && !creditKey && !amountKey)) continue;
    const sheetCardDigits = findCardDigitsInSheet(header, rows, matrix);

    for (const row of rows) {
      const date = toDate(row[dateKey]);
      if (!date) continue;
      const debit = debitKey ? toNumber(row[debitKey]) : null;
      const credit = creditKey ? toNumber(row[creditKey]) : null;
      const generic = amountKey ? toNumber(row[amountKey]) : null;
      let amount = null;
      let kind = "expense";
      if (debit && Math.abs(debit) > 0) { amount = Math.abs(debit); kind = "expense"; }
      else if (credit && Math.abs(credit) > 0) { amount = Math.abs(credit); kind = "income"; }
      else if (generic && Math.abs(generic) > 0) {
        amount = Math.abs(generic);
        kind = generic > 0 ? (fileHintsIncome ? "income" : "expense") : "income";
        if (fileHintsIncome) kind = "income";
      }
      if (!amount) continue;
      const description = String(descKey ? (row[descKey] ?? "") : "").trim() || "ללא תיאור";
      const category = String(categoryKey ? (row[categoryKey] ?? "") : "").trim();
      const topic = String(topicKey ? (row[topicKey] ?? "") : "").trim();
      out.push({
        date,
        description,
        amount: Math.round(amount * 100) / 100,
        kind,
        sheet: sheetName,
        account: accountLabel(fileName, sheetName, sheetCardDigits),
        category: category || null,
        topic: topic || null,
      });
    }
  }
  return out;
}

/* ---------------- charts (SVG, replaces recharts) ---------------- */
const tip = {
  show(html, e) { const t = $("#tip"); t.innerHTML = html; t.classList.remove("hidden"); tip.move(e); },
  move(e) {
    const t = $("#tip");
    const w = t.offsetWidth, h = t.offsetHeight;
    let x = e.clientX + 14, y = e.clientY + 14;
    if (x + w > innerWidth - 8) x = e.clientX - w - 14;
    if (y + h > innerHeight - 8) y = e.clientY - h - 14;
    t.style.left = x + "px"; t.style.top = y + "px";
  },
  hide() { $("#tip").classList.add("hidden"); },
};

function niceTicks(min, max, count = 5) {
  if (min === max) max = min + 1;
  const raw = (max - min) / (count - 1);
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const out = [];
  for (let v = lo; v <= hi + step / 2; v += step) out.push(Math.round(v * 1e6) / 1e6);
  return out;
}

function barPath(x, y, w, h, r, roundTop) {
  if (h <= 0 || w <= 0) return "";
  r = Math.min(r, w / 2, h);
  return roundTop
    ? `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`
    : `M${x},${y}H${x + w}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x + r}Q${x},${y + h} ${x},${y + h - r}Z`;
}

/** Grouped bar chart. opts: { xKey, bars:[{key,name,color}], axes, legend, tooltip, radius } */
function drawBar(el, data, opts) {
  const W = el.clientWidth || 600, H = el.clientHeight || 300;
  const legendH = opts.legend ? 30 : 0;
  const m = { t: 8, r: 8, b: (opts.axes ? 26 : 24) + legendH, l: opts.axes ? 70 : 8 };
  const pw = Math.max(10, W - m.l - m.r), ph = Math.max(10, H - m.t - m.b);
  const vals = data.flatMap((d) => opts.bars.map((b) => d[b.key]));
  const ticks = niceTicks(Math.min(0, ...vals), Math.max(0, ...vals));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const Y = (v) => m.t + ph - ((v - y0) / (y1 - y0)) * ph;
  const band = pw / Math.max(1, data.length);
  const gap = band * 0.1, barGap = 4;
  const bw = Math.max(1, (band - 2 * gap - (opts.bars.length - 1) * barGap) / opts.bars.length);
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-size="12" direction="ltr">`;
  if (opts.axes) {
    for (const t of ticks) {
      s += `<line x1="${m.l}" x2="${m.l + pw}" y1="${Y(t)}" y2="${Y(t)}" stroke="#e5e7eb" stroke-dasharray="3 3"/>`;
      s += `<text x="${m.l - 8}" y="${Y(t)}" text-anchor="end" dominant-baseline="central" fill="#666">${t.toLocaleString("en-US")}</text>`;
    }
    data.forEach((_, i) => {
      const cx = m.l + band * (i + 0.5);
      s += `<line x1="${cx}" x2="${cx}" y1="${m.t}" y2="${m.t + ph}" stroke="#e5e7eb" stroke-dasharray="3 3"/>`;
    });
    s += `<line x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${m.t + ph}" stroke="#666"/>`;
    s += `<line x1="${m.l}" x2="${m.l + pw}" y1="${m.t + ph}" y2="${m.t + ph}" stroke="#666"/>`;
  }
  s += `<rect class="hl" x="0" y="${m.t}" width="${band}" height="${ph}" fill="#ccc" opacity=".3" visibility="hidden"/>`;
  data.forEach((d, i) => {
    opts.bars.forEach((b, j) => {
      const v = d[b.key];
      const x = m.l + i * band + gap + j * (bw + barGap);
      const top = Y(Math.max(v, 0)), bottom = Y(Math.min(v, 0));
      const sel = opts.selected && opts.selected.i === i && opts.selected.key === b.key;
      s += `<path d="${barPath(x, top, bw, bottom - top, opts.radius ?? 4, v >= 0)}" fill="${b.color}"${sel ? ' stroke="#111" stroke-width="2"' : ""}${opts.selected && !sel ? ' opacity=".55"' : ""}/>`;
    });
    const tx = m.l + band * (i + 0.5);
    s += `<text x="${tx}" y="${m.t + ph + 16}" text-anchor="middle" fill="#666">${esc(d[opts.xKey])}</text>`;
  });
  if (opts.legend) {
    const items = opts.bars.map((b) => ({ b, w: 14 + 6 + b.name.length * 8 + 16 }));
    let x = (W - items.reduce((a, it) => a + it.w, 0)) / 2;
    const ly = H - 12;
    for (const { b, w } of items) {
      s += `<rect x="${x}" y="${ly - 6}" width="14" height="12" fill="${b.color}"/>`;
      s += `<text x="${x + 20}" y="${ly}" dominant-baseline="central" fill="${b.color}">${esc(b.name)}</text>`;
      x += w;
    }
  }
  data.forEach((_, i) => { s += `<rect class="hit" data-i="${i}" x="${m.l + i * band}" y="${m.t}" width="${band}" height="${ph}" fill="transparent"${opts.onClick ? ' style="cursor:pointer"' : ""}/>`; });
  s += `</svg>`;
  el.innerHTML = s;
  const svg = el.firstChild, hl = svg.querySelector(".hl");
  // Click: which month (the band) and which series (the bar within the band, or the nearest one).
  if (opts.onClick) svg.addEventListener("click", (e) => {
    const hit = e.target.closest(".hit");
    if (!hit) return;
    const i = +hit.dataset.i;
    const x = e.clientX - svg.getBoundingClientRect().left - (m.l + i * band + gap);
    const j = Math.min(opts.bars.length - 1, Math.max(0, Math.floor(x / (bw + barGap))));
    opts.onClick(data[i], opts.bars[j].key);
  });
  if (!opts.tooltip) return;
  svg.addEventListener("mousemove", (e) => {
    const hit = e.target.closest(".hit");
    if (!hit) { hl.setAttribute("visibility", "hidden"); tip.hide(); return; }
    const d = data[+hit.dataset.i];
    hl.setAttribute("x", hit.getAttribute("x"));
    hl.setAttribute("visibility", "visible");
    tip.show(`<div style="margin-bottom:4px">${esc(d[opts.xKey])}</div>` +
      opts.bars.map((b) => `<div style="color:${b.color}">${esc(b.name)} : ${esc(opts.format ? opts.format(d[b.key]) : d[b.key])}</div>`).join(""), e);
  });
  svg.addEventListener("mouseleave", () => { hl.setAttribute("visibility", "hidden"); tip.hide(); });
}

/**
 * Stacked bar chart: one bar per row of `data`, split into `stacks` segments (positive values only).
 * opts: { xKey, format, onClick(row, stackKey), selected: { i, key } }
 */
function drawStacked(el, data, stacks, opts) {
  const W = el.clientWidth || 600, H = el.clientHeight || 300;
  const m = { t: 8, r: 8, b: 26, l: 70 };
  const pw = Math.max(10, W - m.l - m.r), ph = Math.max(10, H - m.t - m.b);
  const totals = data.map((d) => stacks.reduce((a, st) => a + Math.max(0, d[st.key] || 0), 0));
  const ticks = niceTicks(0, Math.max(1, ...totals));
  const y1 = ticks[ticks.length - 1];
  const Y = (v) => m.t + ph - (v / y1) * ph;
  const band = pw / Math.max(1, data.length);
  const bw = Math.max(4, band * 0.62);
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-size="12" direction="ltr">`;
  for (const t of ticks) {
    s += `<line x1="${m.l}" x2="${m.l + pw}" y1="${Y(t)}" y2="${Y(t)}" stroke="#e5e7eb" stroke-dasharray="3 3"/>`;
    s += `<text x="${m.l - 8}" y="${Y(t)}" text-anchor="end" dominant-baseline="central" fill="#666">${t.toLocaleString("en-US")}</text>`;
  }
  s += `<line x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${m.t + ph}" stroke="#666"/><line x1="${m.l}" x2="${m.l + pw}" y1="${m.t + ph}" y2="${m.t + ph}" stroke="#666"/>`;
  data.forEach((d, i) => {
    const x = m.l + i * band + (band - bw) / 2;
    let acc = 0;
    stacks.forEach((st) => {
      const v = Math.max(0, d[st.key] || 0);
      if (!v) return;
      const top = Y(acc + v), bottom = Y(acc);
      const sel = opts.selected && opts.selected.i === i && opts.selected.key === st.key;
      s += `<rect class="seg" data-i="${i}" data-k="${esc(st.key)}" x="${x}" y="${top}" width="${bw}" height="${Math.max(0.5, bottom - top)}" fill="${st.color}"${sel ? ' stroke="#111" stroke-width="2"' : ' stroke="#fff" stroke-width=".5"'}${opts.selected && !sel ? ' opacity=".5"' : ""} style="cursor:pointer"/>`;
      acc += v;
    });
    s += `<text x="${m.l + band * (i + 0.5)}" y="${m.t + ph + 16}" text-anchor="middle" fill="#666">${esc(d[opts.xKey])}</text>`;
  });
  s += `</svg>`;
  el.innerHTML = s;
  const svg = el.firstChild;
  svg.addEventListener("click", (e) => {
    const seg = e.target.closest(".seg");
    if (seg) opts.onClick(data[+seg.dataset.i], seg.dataset.k);
  });
  svg.addEventListener("mousemove", (e) => {
    const seg = e.target.closest(".seg");
    if (!seg) { tip.hide(); return; }
    const d = data[+seg.dataset.i], st = stacks.find((x) => x.key === seg.dataset.k);
    const total = stacks.reduce((a, x) => a + Math.max(0, d[x.key] || 0), 0);
    tip.show(`<div style="margin-bottom:4px">${esc(d[opts.xKey])} · סה"כ ${esc(opts.format(total))}</div><div style="color:${st.color};font-weight:600">${esc(st.name)} : ${esc(opts.format(d[st.key]))}</div>`, e);
  });
  svg.addEventListener("mouseleave", () => tip.hide());
}

/** Pie chart. opts: { outerRadius, color(entry,i), label: "nameValue"|"name", onClick(entry), onContext(entry), tooltip } */
function drawPie(el, data, opts) {
  const W = el.clientWidth || 400, H = el.clientHeight || 288;
  const cx = W / 2, cy = H / 2, R = opts.outerRadius ?? 95;
  const total = data.reduce((s, d) => s + d.value, 0);
  if (!total) { el.innerHTML = ""; return; }
  // Angles run clockwise from 12 o'clock, so the first slice always starts at the top.
  const pt = (r, deg) => { const a = (deg * Math.PI) / 180; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; };
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" direction="ltr">`;
  let labels = "";
  let a = 0;
  data.forEach((d, i) => {
    const sweep = (d.value / total) * 360;
    const a0 = a, a1 = a + sweep, mid = (a0 + a1) / 2;
    a = a1;
    const fill = opts.color(d, i);
    const cursor = opts.onClick ? ' style="cursor:pointer"' : "";
    if (sweep >= 359.99) s += `<circle class="sl" data-i="${i}" cx="${cx}" cy="${cy}" r="${R}" fill="${fill}" stroke="#fff"${cursor}/>`;
    else if (sweep > 0) {
      const [x0, y0] = pt(R, a0), [x1, y1] = pt(R, a1);
      s += `<path class="sl" data-i="${i}" d="M${cx},${cy}L${x0},${y0}A${R},${R} 0 ${sweep > 180 ? 1 : 0} 1 ${x1},${y1}Z" fill="${fill}" stroke="#fff"${cursor}/>`;
    }
    const [lx, ly] = pt(R + 20, mid);
    // Thin slices sit next to each other in the fixed order; their labels would overlap, so they rely on the tooltip.
    if (opts.label !== "name" && sweep < 12) return;
    labels += opts.label === "name"
      ? `<text x="${lx}" y="${ly}" text-anchor="${lx >= cx ? "start" : "end"}" dominant-baseline="central" font-size="14" fill="${fill}">${esc(d.name)}</text>`
      : (() => {
          // One line, Hebrew name first then the amount, growing away from the pie.
          const dx = lx - cx;
          const anchor = Math.abs(dx) < 12 ? "middle" : dx > 0 ? "end" : "start"; // rtl: "end" = left edge
          return `<text x="${lx}" y="${ly}" direction="rtl" unicode-bidi="embed" text-anchor="${anchor}" dominant-baseline="central" font-size="12" font-weight="600" fill="#0f172a">${esc(d.name)} ${esc(ils(d.value))}</text>`;
        })();
  });
  s += labels + `</svg>`;
  el.innerHTML = s;
  const svg = el.firstChild;
  const entryOf = (e) => { const sl = e.target.closest(".sl"); return sl ? data[+sl.dataset.i] : null; };
  if (opts.tooltip) {
    svg.addEventListener("mousemove", (e) => {
      const d = entryOf(e);
      if (!d) return tip.hide();
      tip.show(`<span style="color:${opts.color(d, data.indexOf(d))}">${esc(d.name)} : ${esc(ils(d.value))}</span>`, e);
    });
    svg.addEventListener("mouseleave", () => tip.hide());
  }
  if (opts.onClick) svg.addEventListener("click", (e) => { const d = entryOf(e); if (d) { tip.hide(); opts.onClick(d); } });
  if (opts.onContext) svg.addEventListener("contextmenu", (e) => { const d = entryOf(e); if (d) { e.preventDefault(); tip.hide(); opts.onContext(d); } });
}

/* ---------------- routing + event delegation ---------------- */
let H = {};            // handlers of the current page, keyed by data-act
let redraw = null;     // chart redraw of the current page (on resize)
let rerender = null;   // re-render of the current page after a data change

function parseHash() {
  const h = location.hash.slice(1) || "/";
  const [path, qs] = h.split("?");
  return { path: path || "/", q: Object.fromEntries(new URLSearchParams(qs || "")), raw: h };
}
function href(path, q) {
  const qs = q && Object.keys(q).length ? "?" + new URLSearchParams(q).toString() : "";
  return "#" + path + qs;
}
function go(path, q) { location.hash = href(path, q).slice(1); }

for (const type of ["click", "change", "input", "keydown"]) {
  document.addEventListener(type, (e) => {
    const el = e.target.closest?.("[data-act]");
    if (!el) return;
    const h = H[el.dataset.act] || G[el.dataset.act];
    if (h && h[type]) h[type](e, el);
  });
}
let resizeT;
addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => redraw && redraw(), 120); });

/* ---------------- picker (port of PickerSelect) ---------------- */
const pickerDraft = {}; // ctx -> name being typed for a new category/topic

function picker({ ctx, value, options, emptyLabel = "—", newLabel, placeholder, disabled, cls = "" }) {
  if (ctx in pickerDraft) {
    return `<span class="picker-add">
      <input class="in-xs ${cls}" data-act="pk-input" data-ctx="${esc(ctx)}" data-autofocus value="${esc(pickerDraft[ctx])}" placeholder="${esc(placeholder)}">
      <button type="button" class="btn-xs" data-act="pk-save" data-ctx="${esc(ctx)}">שמירה</button>
      <button type="button" class="xs muted" style="padding:0 4px" data-act="pk-cancel" data-ctx="${esc(ctx)}">✕</button>
    </span>`;
  }
  // A type-to-search field (see the combobox code below); the list itself is built when the field is focused.
  const name = options.find((o) => o.id === value)?.name ?? "";
  return `<input class="combo-in ${cls}" data-act="cb" data-ctx="${esc(ctx)}" data-id="${esc(value ?? "")}" data-name="${esc(name)}"
    value="${esc(name)}" placeholder="${esc(emptyLabel)}" title="${esc(name || emptyLabel)}" autocomplete="off" spellcheck="false" ${disabled ? "disabled" : ""}>`;
}

function pickerIsCategory(ctx) { return ctx.startsWith("row-cat") || ctx.startsWith("bulk-cat") || ctx.startsWith("type-cat"); }

function pickerChange(ctx, id) {
  const [kind, arg] = ctx.split(":");
  if (kind === "row-cat") classifyTransactions([arg], { categoryId: id || null });
  else if (kind === "row-topic") classifyTransactions([arg], { topicId: id || null });
  else if (kind === "bulk-cat") txState.bulkCat = id;
  else if (kind === "bulk-topic") txState.bulkTopic = id;
  else if (kind === "tax-primary") upsertCategory({ id: arg, primaryTopicId: id || null });
  else if (kind === "type-cat") stageType(arg, "categoryId", id);
  else if (kind === "type-topic") stageType(arg, "topicId", id);
  rerender && rerender();
}

function pickerSave(ctx) {
  const name = (pickerDraft[ctx] ?? "").trim();
  if (!name) return;
  try {
    const id = pickerIsCategory(ctx) ? upsertCategory({ name }) : upsertTopic({ name });
    delete pickerDraft[ctx];
    pickerChange(ctx, id);
  } catch (e) { toast(e.message); }
}

/* ---------- type-to-search combobox for every category/topic field ---------- */
const combo = { el: null, items: [], active: -1, original: "", keepOnEmpty: false };
const comboNorm = (s) => String(s ?? "").toLowerCase().replace(/["'׳״]/g, "").replace(/\s+/g, " ").trim();
const COMBO_LIMIT = 80;

function comboOptions(ctx) {
  return [...(pickerIsCategory(ctx) ? db.categories : db.topics)].sort((a, b) => heSort(a.name, b.name));
}

function comboMark(label, query) {
  const q = query.trim().toLowerCase();
  const i = q ? label.toLowerCase().indexOf(q) : -1;
  return i < 0 ? esc(label) : `${esc(label.slice(0, i))}<mark>${esc(label.slice(i, i + q.length))}</mark>${esc(label.slice(i + q.length))}`;
}

function comboOpen(el) {
  combo.el = el;
  combo.original = el.dataset.name ?? "";
  combo.keepOnEmpty = false;
  el.select();
  comboRender("");
}

function comboRender(query) {
  const el = combo.el;
  const pop = $("#combo-pop");
  if (!el || !pop) return;
  const ctx = el.dataset.ctx;
  const q = comboNorm(query);
  const all = comboOptions(ctx);
  const matches = q
    ? all.filter((o) => comboNorm(o.name).includes(q))
        .sort((a, b) => comboNorm(b.name).startsWith(q) - comboNorm(a.name).startsWith(q) || heSort(a.name, b.name))
    : all;
  const exact = q && all.some((o) => comboNorm(o.name) === q);
  const isCat = pickerIsCategory(ctx);
  combo.items = [
    ...(el.dataset.id && !q ? [{ kind: "clear", label: "— ללא —" }] : []),
    ...matches.slice(0, COMBO_LIMIT).map((o) => ({ kind: "pick", id: o.id, label: o.name })),
    ...(q && !exact ? [{ kind: "create", name: query.trim(), label: `+ ${isCat ? "קטגוריה חדשה" : "נושא חדש"}: "${query.trim()}"` }] : []),
  ];
  combo.active = q ? combo.items.findIndex((i) => i.kind !== "clear") : -1;
  pop.innerHTML =
    combo.items
      .map((it, i) => `<div class="combo-item ${it.kind}${i === combo.active ? " active" : ""}" data-i="${i}">${it.kind === "pick" ? comboMark(it.label, query) : esc(it.label)}</div>`)
      .join("") +
    (matches.length > COMBO_LIMIT ? `<div class="combo-more">ועוד ${matches.length - COMBO_LIMIT} — המשיכו להקליד</div>` : "") +
    (!combo.items.length ? `<div class="combo-more">הקלידו שם</div>` : "");
  pop.hidden = false;
  comboPosition();
}

function comboPosition() {
  const el = combo.el;
  const pop = $("#combo-pop");
  if (!el || !pop || pop.hidden) return;
  const r = el.getBoundingClientRect();
  if (r.bottom < 0 || r.top > innerHeight) return;
  pop.style.minWidth = Math.max(220, r.width) + "px";
  pop.style.right = Math.max(8, innerWidth - r.right) + "px";
  const below = innerHeight - r.bottom;
  if (below < 220 && r.top > below) {
    pop.style.top = "";
    pop.style.bottom = innerHeight - r.top + 2 + "px";
    pop.style.maxHeight = Math.min(280, r.top - 12) + "px";
  } else {
    pop.style.bottom = "";
    pop.style.top = r.bottom + 2 + "px";
    pop.style.maxHeight = Math.min(280, below - 12) + "px";
  }
}

function comboClose() {
  combo.el = null;
  const pop = $("#combo-pop");
  if (pop) { pop.hidden = true; pop.innerHTML = ""; }
}

function comboMove(delta) {
  const n = combo.items.length;
  if (!n) return;
  combo.active = combo.active < 0 ? (delta > 0 ? 0 : n - 1) : (combo.active + delta + n) % n;
  const pop = $("#combo-pop");
  pop.querySelectorAll(".combo-item").forEach((node, i) => node.classList.toggle("active", i === combo.active));
  pop.querySelector(".combo-item.active")?.scrollIntoView({ block: "nearest" });
}

/** Save a chosen value; if the re-render replaced the field the user moved to, put the cursor back there. */
function comboCommit(el, ctx, id) {
  if ((el.dataset.id ?? "") === (id ?? "")) { el.value = el.dataset.name ?? ""; return; }
  const next = document.activeElement?.dataset?.act === "cb" ? document.activeElement.dataset.ctx : null;
  pickerChange(ctx, id);
  if (next && next !== ctx) document.querySelector(`input[data-act="cb"][data-ctx="${CSS.escape(next)}"]`)?.focus();
}

function comboChoose(i) {
  const it = combo.items[i];
  const el = combo.el;
  if (!it || !el) return;
  const ctx = el.dataset.ctx;
  comboClose();
  if (it.kind === "create") {
    try { comboCommit(el, ctx, pickerIsCategory(ctx) ? upsertCategory({ name: it.name }) : upsertTopic({ name: it.name })); }
    catch (err) { toast(err.message); }
  } else comboCommit(el, ctx, it.kind === "pick" ? it.id : "");
}

document.addEventListener("focusin", (e) => {
  const el = e.target.closest?.('input[data-act="cb"]');
  if (el && combo.el !== el) comboOpen(el);
});
document.addEventListener("focusout", (e) => {
  const el = e.target;
  if (el !== combo.el) return;
  const ctx = el.dataset.ctx;
  const q = comboNorm(el.value);
  const hit = q && comboOptions(ctx).find((o) => comboNorm(o.name) === q);
  const keep = combo.keepOnEmpty;
  comboClose();
  setTimeout(() => {
    if (!q) { if (el.dataset.id && !keep) comboCommit(el, ctx, ""); else el.value = el.dataset.name ?? ""; }
    else if (hit) comboCommit(el, ctx, hit.id);
    else el.value = el.dataset.name ?? ""; // unknown text: nothing is created unless "+ …" is chosen
  }, 0);
});
document.addEventListener("mousedown", (e) => {
  if (!e.target.closest?.("#combo-pop")) return;
  e.preventDefault(); // keep the cursor in the field
  const item = e.target.closest(".combo-item");
  if (item) comboChoose(+item.dataset.i);
});
addEventListener("scroll", () => combo.el && comboPosition(), true);
addEventListener("resize", () => combo.el && comboPosition());

function focusAutofocus() {
  const el = $("[data-autofocus]");
  if (el) { el.focus(); if (el.setSelectionRange) el.setSelectionRange(el.value.length, el.value.length); }
}

/** Handlers shared by all pages. */
const G = {
  back: { click: () => history.back() },
  cb: {
    input: (e, el) => {
      if (combo.el !== el) { combo.el = el; combo.original = el.dataset.name ?? ""; }
      comboRender(el.value);
    },
    keydown: (e, el) => {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        if (combo.el !== el) comboOpen(el);
        comboMove(e.key === "ArrowDown" ? 1 : -1);
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (combo.el === el && combo.active >= 0) comboChoose(combo.active);
      } else if (e.key === "Escape") {
        el.value = el.dataset.name ?? "";
        comboClose();
        el.blur();
      }
    },
  },
  "modal-close": { click: () => closeModal() },
  "modal-drill": { click: () => { const run = modalDrill; closeModal(); run && run(); } },
  pk: { change: (e, el) => {
    if (el.value === "__new__") { pickerDraft[el.dataset.ctx] = ""; rerender && rerender(); focusAutofocus(); }
    else pickerChange(el.dataset.ctx, el.value);
  } },
  "pk-input": {
    input: (e, el) => { pickerDraft[el.dataset.ctx] = el.value; },
    keydown: (e, el) => {
      if (e.key === "Enter") pickerSave(el.dataset.ctx);
      if (e.key === "Escape") { delete pickerDraft[el.dataset.ctx]; rerender && rerender(); }
    },
  },
  "pk-save": { click: (e, el) => pickerSave(el.dataset.ctx) },

const CARD_SLICE = "כרטיסי אשראי";
const OTHER_SLICE = "אחר";
const NO_TOPIC = "ללא נושא";

/**
 * Fixed pie layout: every topic always sits in the same place in this order (clockwise from
 * 12 o'clock) and always has the same color. Order follows the all-time totals, so the large,
 * steady topics come first and barely move when sizes change. Edit colors or order here.
 */
const TOPIC_PALETTE = [
  [CARD_SLICE, "hsl(350 70% 55%)"],        // red — card bills (ראה פירוט CC / לא להתייחס)
  ["ילדים", "hsl(215 70% 50%)"],
  ["הלוואות", "hsl(28 90% 52%)"],          // orange
  ["שכר דירה", "hsl(150 55% 38%)"],
  ["רכב", "hsl(10 75% 62%)"],
  ["טיפול", "hsl(240 50% 58%)"],
  ["בריאות", "hsl(95 50% 45%)"],
  ["צדקה", "hsl(325 60% 55%)"],
  ["מזון", "hsl(45 90% 48%)"],
  ["אירוח", "hsl(200 80% 55%)"],
  ["קורסים", "hsl(25 45% 40%)"],
  ["ביטוח", "hsl(210 25% 45%)"],
  ["דמי ניהול", "hsl(260 45% 72%)"],
  ["אינטרנט", "hsl(295 55% 45%)"],
  ["מוניות", "hsl(52 85% 45%)"],
  ["דלק", "hsl(190 70% 30%)"],
  ["ביגוד", "hsl(340 55% 70%)"],
  ["ארוחות", "hsl(70 45% 40%)"],
  ["לא ידוע", "hsl(30 10% 50%)"],
  ["קנסות", "hsl(0 55% 38%)"],
  ["מחשבים", "hsl(200 30% 55%)"],
  ["נייד", "hsl(185 65% 50%)"],
  ["בית", "hsl(35 50% 60%)"],
  ["פעילות שלום", "hsl(205 60% 70%)"],
  ["בתי קפה", "hsl(20 35% 55%)"],
  ["משפחה", "hsl(275 55% 55%)"],
  ["שרותי אינטרנט", "hsl(295 40% 65%)"],
  ["עבודה", "hsl(225 55% 35%)"],
  ["משרד", "hsl(160 45% 65%)"],
  ["ריבית", "hsl(45 40% 55%)"],
  ["פנאי", "hsl(285 50% 68%)"],
  // Topics from the earlier Lovable data, kept in case they are used again.
  ["פרעון הלוואות", "hsl(28 70% 40%)"],
  ["רכישת רכב", "hsl(10 60% 45%)"],
];
const TOPIC_RANK = new Map(TOPIC_PALETTE.map(([n], i) => [n, i]));
const TOPIC_COLOR = new Map(TOPIC_PALETTE);
// Topics created later (not in the list above) get a color from here and sit after the known ones.
const EXTRA_COLORS = ["hsl(170 65% 40%)", "hsl(250 55% 60%)", "hsl(65 70% 42%)", "hsl(300 45% 55%)", "hsl(0 65% 60%)", "hsl(120 35% 50%)"];

// Bank rows that only pay a card bill; the card's own transactions carry the real topics.
const isCardTopic = (name) => name === CARD_SLICE || name.includes("לא להתייחס") || name === "ראה פירוט CC";

function colorFor(name) {
  if (name === OTHER_SLICE) return "hsl(0 0% 62%)";
  if (name === NO_TOPIC) return "hsl(0 0% 80%)";
  if (isCardTopic(name)) return TOPIC_COLOR.get(CARD_SLICE);
  if (TOPIC_COLOR.has(name)) return TOPIC_COLOR.get(name);
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return EXTRA_COLORS[h % EXTRA_COLORS.length];
}

/** Known topics in fixed order, then new topics by name, then ללא נושא, then אחר last. */
function pieRank(name) {
  if (name === OTHER_SLICE) return [3, 0, ""];
  if (name === NO_TOPIC) return [2, 0, ""];
  if (isCardTopic(name)) return [0, TOPIC_RANK.get(CARD_SLICE), ""];
  if (TOPIC_RANK.has(name)) return [0, TOPIC_RANK.get(name), ""];
  return [1, 0, name];
}
function byPieOrder(a, b) {
  const ra = pieRank(a.name), rb = pieRank(b.name);
  return ra[0] - rb[0] || ra[1] - rb[1] || ra[2].localeCompare(rb[2], "he");
}
const monthLabel = (ym) => { const [y, m] = ym.split("-"); return `${m}/${(y ?? "").slice(2)}`; };

const dash = { months: 12, pieView: "main", otherSource: "main", pieMode: "total", selectedMonth: null, bar: null, view: "bar" };

  const topicName = new Map(data.topics.map((t) => [t.id, t.name]));

  let scoped = txns;
  if (txns.length && dash.months !== 0) {
    const sorted = [...new Set(txns.map((t) => t.txn_date.slice(0, 7)))].sort();
    const keep = new Set(sorted.slice(-dash.months));
    scoped = txns.filter((t) => keep.has(t.txn_date.slice(0, 7)));
  }
  const monthOptions = [...new Set(scoped.map((t) => t.txn_date.slice(0, 7)))].sort();
  const activeMonth = dash.pieMode === "monthly"
    ? (dash.selectedMonth && monthOptions.includes(dash.selectedMonth) ? dash.selectedMonth : (monthOptions[monthOptions.length - 1] ?? null))
    : null;
  const pieScoped = activeMonth ? scoped.filter((t) => t.txn_date.slice(0, 7) === activeMonth) : scoped;
  const monthSuffix = activeMonth ? ` — ${monthLabel(activeMonth)}` : "";

  const income = scoped.filter((t) => t.kind === "income").reduce((s, t) => s + t.amount, 0);
  const expense = scoped.filter((t) => t.kind === "expense").reduce((s, t) => s + t.amount, 0);
  const balance = income - expense;
  // Financing: savings withdrawn and loans taken (+), loan principal repaid (−). Kept apart from
  // income and spending so the bars show the regular month.
  const financing = scoped.filter((t) => t.kind === "financing").reduce((s, t) => s + (t.fin_amount ?? 0), 0);

  const seriesMap = new Map();

    });
    renderBarDetail();
    if ($("#dash-pie")) drawPie($("#dash-pie"), pieData, {
      outerRadius: 95, tooltip: true, color: (d) => colorFor(d.name),
      onClick: (d) => {
        const drill = dash.pieView === "main" && d.name === CARD_SLICE
          ? { label: "פירוט לפי נושא ←", run: () => { dash.pieView = "cards"; dashboardPage(); } }
          : d.name === OTHER_SLICE && dash.pieView !== "other"
            ? { label: "פירוט הנושאים הקטנים ←", run: () => { dash.otherSource = dash.pieView === "cards" ? "cards" : "main"; dash.pieView = "other"; dashboardPage(); } }
            : null;
        const pageQuery = d.name === CARD_SLICE ? { account: "card" } : d.name === OTHER_SLICE ? { kind: "expense" } : { topic: d.name };
        openSliceModal(`${d.name}${monthSuffix}`, colorFor(d.name), sliceTxns(d.name), { drill, pageQuery, catName, topicOf });
      },
      onContext: (d) => {
        if (d.name === CARD_SLICE) return go("/transactions", { account: "card" });
        if (d.name === OTHER_SLICE) return go("/transactions", { kind: "expense" });
        go("/transactions", { topic: d.name });
      },
    });
  };
  redraw();
}

/** Popup listing the transactions behind a pie slice. */
function openSliceModal(title, color, txns, { drill, pageQuery, catName, topicOf }) {
  const rows = [...txns].sort((a, b) => b.txn_date.localeCompare(a.txn_date));
  const total = rows.reduce((s, t) => s + t.amount, 0);
  const el = $("#modal");
  el.innerHTML = `<div class="modal-overlay" data-act="modal-close"></div>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="row3 between modal-head">

        <button type="button" class="btn ghost sm" data-act="modal-close" aria-label="סגירה">✕</button>
      </div>
      <div class="row3 between small" style="margin-bottom:12px">
        <span class="muted">${rows.length} תנועות · סה"כ <strong class="num" style="color:var(--foreground)">${esc(ils(total))}</strong></span>
        <div class="row">
          ${drill ? `<button type="button" class="btn outline sm" data-act="modal-drill">${esc(drill.label)}</button>` : ""}
          <a class="btn outline sm" href="${href("/transactions", pageQuery)}" data-act="modal-close">לעמוד העסקאות</a>
        </div>
      </div>
      ${rows.some((t) => t.missing_detail) ? `<div class="nodata-note"><strong>${NODATA}</strong> — ${rows.every((t) => t.missing_detail) ? "לחודשים אלה" : `ל-${rows.filter((t) => t.missing_detail).length} מהשורות`} אין פירוט עסקאות מחברת האשראי. מוצג הסכום שחויב בבנק (${esc(ils(rows.filter((t) => t.missing_detail).reduce((s, t) => s + t.amount, 0)))}).</div>` : ""}
      <div class="modal-body tbl-wrap">
        <table class="tbl hover">
          <thead><tr><th>תאריך</th><th>תיאור</th><th>סכום</th><th>קטגוריה</th><th>נושא</th><th>חשבון</th></tr></thead>
          <tbody>
            ${rows.map((t) => `<tr>
              <td class="num nowrap">${heDate(t.txn_date)}</td>
              <td>${descHtml(t)}</td>
              <td class="num nowrap">${esc(ils(t.amount))}</td>
              <td>${esc((t.category_id && catName.get(t.category_id)) || t.source_category || "—")}</td>
              <td>${esc(topicOf(t))}</td>
              <td class="num nowrap" style="text-align:center">${esc(t.account_label ?? "—")}</td>
            </tr>`).join("")}
            ${!rows.length ? `<tr><td colspan="6" class="muted" style="padding:24px;text-align:center">אין תנועות.</td></tr>` : ""}
          </tbody>

  el.classList.remove("hidden");
